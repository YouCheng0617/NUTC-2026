<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日便利貼 - 秘密海域</title>
    <link rel="stylesheet" href="notes.css">
</head>
<body>
<!-- 頂部導航 -->
<header class="top-bar">
    <h1 id="page-title">📝 每日便利貼</h1>
    <div style="display: flex; gap: 10px;">
        <button class="btn-back" id="btn-lang" onclick="toggleLang()">EN</button>
        <button class="btn-back" id="btn-back" onclick="window.location.href='games.html'">回到大廳</button>
    </div>
</header>

    <div class="container">
        <!-- 新增便利貼的控制台 -->
        <div class="note-creator glass-panel">
            <textarea id="note-text" placeholder="今天想記錄點什麼呢？..." rows="3"></textarea>
            <div class="creator-actions">
                
                <button id="add-note-btn" class="btn-action">發佈便利貼</button>
            </div>
        </div>

        <!-- 便利貼展示佈告欄 -->
        <div id="notes-board" class="notes-grid">
            <!-- JS 會將便利貼卡片渲染在這裡 -->
        </div>
    </div>

    <script src="notes.js"></script>
</body>
</html>
