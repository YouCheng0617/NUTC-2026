<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海兔養成記</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    
    <!-- 🌟 引入 Socket.IO (用來處理多人連線的套件) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js">

    </script>

    <style>
        /* 🌟 【全域變數調色盤】這裡定義了整個遊戲的主要顏色，換這裡的色號，整個網頁風格就會跟著變哦！ */
        :root {
            --primary-bg: #fff0f5; 
            --panel-bg: #ffffff;
            --card-bg: #fff9fa;
            --accent-color: #ffb6c1;
            --text-dark: #6b4c4a;
            --text-dim: #b89f9d;
            --border-color: #ffd1dc;
            --btn-hover: #ffedf0;
            --shadow-color: rgba(255, 182, 193, 0.4);
            
            /* 海兔預設的身體顏色變數 */
            --c-body: #ffffff;
            --c-outline: #3f2a2a;
            --c-ear-top: #3f2a2a;
            --c-tail: #3f2a2a;
            --c-spot: #3f2a2a;
            --c-blush: #fca5a5;
        }

        /* 🌟 基礎排版設定，不讓玩家反白選取文字 */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Nunito', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--primary-bg);
            color: var(--text-dark);
        }

        /* 🌟 【多人連線區塊 UI】包含右上角的連線按鈕、房間代碼顯示 */
        .mp-panel {
            position: absolute;
            top: 75px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 55;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 20px;
            border: 3px solid var(--border-color);
            box-shadow: 0 5px 15px var(--shadow-color);
            backdrop-filter: blur(4px);
        }
        .mp-info { font-size: 0.9rem; font-weight: 900; color: var(--text-dark); text-align: center; }
        .mp-btn { background: var(--text-dark); color: white; border: none; padding: 8px 15px; border-radius: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.15); transition: 0.1s; }
        .mp-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        .mp-btn.secondary { background: #ffffff; color: var(--text-dark); border: 2px solid var(--text-dark); box-shadow: 0 4px 0 var(--text-dark); }
        
        /* 🌟 【其他玩家與聊天泡泡】別人進來房間時的顯示設定 */
        .other-player { position: absolute; width: 280px; height: 180px; pointer-events: none; transition: left 0.15s ease-out, top 0.15s ease-out; z-index: 8; }
        .other-player-name { position: absolute; top: -10px; width: 100%; text-align: center; font-weight: 900; font-size: 1.1rem; color: var(--text-dark); text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; z-index: 10; }  
        .chat-bubble { position: absolute; top: -65px; left: 50%; transform: translateX(-50%); background: white; padding: 8px 15px; border-radius: 20px; border: 2px solid var(--accent-color); font-weight: 900; font-size: 1rem; color: var(--text-dark); white-space: nowrap; box-shadow: 0 5px 15px rgba(255, 182, 193, 0.4); animation: chatPop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); z-index: 30; }
        .chat-bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border-width: 8px 8px 0; border-style: solid; border-color: white transparent transparent transparent; }
        .chat-bubble::before { content: ''; position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%); border-width: 10px 10px 0; border-style: solid; border-color: var(--accent-color) transparent transparent transparent; z-index: -1; }
        @keyframes chatPop { 0% { transform: translateX(-50%) scale(0.5); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }

        /* 🌟 【最頂端資訊列】返回按鈕、積分顯示、語言切換 */
        .top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }
        .points-display {
            background: #ffffff;
            padding: 8px 24px;
            border-radius: 30px;
            border: 3px solid var(--border-color);
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-dark);
            box-shadow: 0 4px 0 var(--border-color);
            backdrop-filter: blur(4px);
            font-size: 1.1rem;
        }
        .lang-btn {
            background: #ffffff;
            border: 3px solid var(--border-color);
            color: var(--text-dark);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.9rem;
            transition: 0.1s;
            box-shadow: 0 4px 0 var(--border-color);
        }
        .lang-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        /* 🌟 【主要遊戲舞台】包含背景底色、網點、還有特效圖層 */
        .stage {
            position: absolute;
            top: 0; left: 0; 
            width: 100%; height: 58%; 
            background: #dbeafe; overflow: hidden; transition: background 1s ease;
        }
        .dot-pattern {
            position: absolute; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.7) 3px, transparent 3px);
            background-size: 35px 35px; opacity: 0.9; pointer-events: none;
            box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.5); z-index: 2; transition: opacity 0.5s;
        }
        .effect-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 5; overflow: hidden; }

        /* 特效動畫：雨滴與泡泡 */
        .rain-drop { position: absolute; width: 2px; height: 20px; background: rgba(255, 255, 255, 0.7); top: -20px; animation: rainFall linear infinite; }
        @keyframes rainFall { to { transform: translateY(60vh); } }
        .bubble { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.7); background: rgba(255, 255, 255, 0.2); bottom: -20px; animation: bubbleRise ease-in infinite; }
        @keyframes bubbleRise { to { transform: translateY(-60vh) scale(1.5); opacity: 0; } }
/* 🌟 愛心由下往上飄動與破掉的動畫 */
@keyframes heartFloatAndPop {
    0% {
        transform: translateY(0vh) scale(0.3);
        opacity: 0;
    }
    15% {
        opacity: 0.9;
        transform: translateY(-10vh) scale(1);
    }
    85% {
        opacity: 0.9;
        transform: translateY(-50vh) scale(1.1);
    }
    92% {
        opacity: 1;
        transform: translateY(-55vh) scale(1.3); /* 破裂前瞬間放大 */
        filter: brightness(2) drop-shadow(0 0 10px #fff);
    }
    100% {
        transform: translateY(-58vh) scale(0.2); /* 啵！縮小炸開消失 */
        opacity: 0;
    }
}
/* 📺 【阿嬤的舊電視】CRT 舊電視掃描線 + 噪點濾鏡 + 畫面閃爍效果 (清晰且柔和緩慢版) */
    .tv-filter-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 99;
        /* 加深掃描線的對比與網格感，讓濾鏡更清晰明顯 */
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), 
                    linear-gradient(90deg, rgba(255, 0, 0, 0.12), rgba(0, 255, 0, 0.04), rgba(0, 0, 255, 0.12));
        background-size: 100% 4px, 3px 100%;
        /* 提高不透明度，並將閃爍動畫時間拉長、採用柔和的呼吸漸變，避免太快造成不舒服 */
        opacity: 0.5;
        animation: flicker 0.8s infinite alternate ease-in-out;
    }
    @keyframes flicker {
        0% { opacity: 0.45; } 
        100% { opacity: 0.55; }
    }
    /* 🌟 【深海魚群專屬】中心透光深淵 ＋ 鯊魚漩渦風暴全域背景 */
.shark-vortex-bg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    /* 100% 還原圖片：中心亮青藍透光，四周極致深海暗藍黑 */
    background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.45) 0%, rgba(2, 132, 199, 0.3) 25%, rgba(15, 23, 42, 0.75) 60%, rgba(2, 6, 23, 0.92) 100%);
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

/* 🌟 中心發光光柱核心 */
.shark-center-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(224, 242, 254, 0.8) 0%, rgba(56, 189, 248, 0.4) 45%, transparent 75%);
    filter: blur(15px);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    animation: centerGlowPulse 4s ease-in-out infinite alternate;
}
@keyframes centerGlowPulse {
    0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1.0; }
}

/* 🌟 旋轉軌道環容器（同心圓旋轉） */
.shark-ring-track {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    border-radius: 50%;
    transform-origin: center center;
}

/* 🌟 鯊魚本體：依照切線方向朝著圓周前方游動 */
.vortex-shark {
    position: absolute;
    pointer-events: none;
    transform-origin: center center;
}

/* 各層軌道旋轉動畫 */
@keyframes ringSpinClockwise {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}
@keyframes ringSpinCounter {
    0% { transform: translate(-50%, -50%) rotate(360deg); }
    100% { transform: translate(-50%, -50%) rotate(0deg); }
}
/* 🌟 【深海點擊泡泡】晶瑩透亮反光 ＋ 自然左右搖曳慢速上升 */
.deep-sea-click-bubble {
    position: absolute;
    pointer-events: none;
    z-index: 25;
    border-radius: 50%;
    /* 水晶泡泡高光與透光水藍漸層 */
    background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.95) 0%, rgba(224, 242, 254, 0.45) 25%, rgba(56, 189, 248, 0.15) 65%, rgba(255, 255, 255, 0.7) 100%);
    border: 1.2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.7), inset 0 0 5px rgba(255, 255, 255, 0.9);
    transform: translate(-50%, -50%);
    animation: clickBubbleRise 2.8s cubic-bezier(0.2, 0.6, 0.35, 1) forwards;
}

@keyframes clickBubbleRise {
    0% {
        transform: translate(-50%, -50%) translate(0, 0) scale(0.3);
        opacity: 0;
    }
    12% {
        opacity: 0.95;
        transform: translate(-50%, -50%) translate(var(--drift-x), -25px) scale(1);
    }
    60% {
        opacity: 0.85;
        transform: translate(-50%, -50%) translate(calc(var(--drift-x) * -0.6), -90px) scale(1.08);
    }
    100% {
        transform: translate(-50%, -50%) translate(calc(var(--drift-x) * 1.4), -180px) scale(1.2);
        opacity: 0;
    }
}
/* 🌟 【蝴蝶翩翩專屬】微光幽境柔霧圖層 */
.butterfly-mist-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, rgba(192, 132, 252, 0.12) 0%, rgba(76, 29, 149, 0.18) 60%, transparent 100%);
    pointer-events: none;
    z-index: 1;
}

/* 🌟 影子蝴蝶本體容器 (自帶柔和發光與深色剪影) */
.shadow-butterfly {
    position: absolute;
    width: 32px; height: 32px;
    pointer-events: none;
    z-index: 4;
    perspective: 400px;
    transform-origin: center center;
}

/* 🌟 翅膀拍動（以 50px 中脊為軸心自然呼吸扇動） */
.butterfly-wing-l {
    transform-origin: 50px center;
    animation: wingFlapPureL 1.1s infinite alternate ease-in-out;
}
.butterfly-wing-r {
    transform-origin: 50px center;
    animation: wingFlapPureR 1.1s infinite alternate ease-in-out;
}

@keyframes wingFlapPureL {
    0% { transform: scaleX(1); }
    100% { transform: scaleX(0.72) skewY(-3deg); }
}
@keyframes wingFlapPureR {
    0% { transform: scaleX(1); }
    100% { transform: scaleX(0.72) skewY(3deg); }
}
/* 🌟 蝴蝶飛行時身後留下的微光星塵粒子 */
.butterfly-spark-trail {
    position: absolute;
    width: 4px; height: 4px;
    background: #e9d5ff;
    border-radius: 50%;
    box-shadow: 0 0 6px #c084fc, 0 0 10px #fbcfe8;
    pointer-events: none;
    z-index: 3;
    animation: sparkFade 1.2s ease-out forwards;
}

@keyframes sparkFade {
    0% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
    50% { opacity: 0.6; }
    100% { transform: translate(-50%, -50%) translateY(12px) scale(0.2); opacity: 0; }
}
/* 📐 【數學當機】清晰、正確且緩慢移動的數學公式與發光叉叉 */
    .math-formula {
        position: absolute; 
        color: #ffffff; /* 使用純白色，並加上深色陰影確保在任何背景都絕對清晰 */
        background: rgba(107, 76, 74, 0.85); /* 加上深色半透明膠囊底色，讓公式像教科書一樣超好辨識 */
        padding: 6px 14px;
        border-radius: 12px;
        border: 2px solid #ffd1dc;
        font-family: 'Courier New', monospace;
        font-weight: 900; 
        font-size: 1.4rem; 
        pointer-events: none; 
        z-index: 6;
        white-space: nowrap;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        animation: mathSprintVerySlow linear infinite;
    }
    @keyframes mathSprintVerySlow { 
        0% { transform: translateX(-300px) translateY(var(--start-y)); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(calc(100vw + 300px)) translateY(var(--end-y)); opacity: 0; }
    }

    .wrong-mark {
        position: absolute; 
        top: 0; left: 0; 
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        color: rgba(244, 63, 94, 0.65); 
        font-size: 35vw; 
        font-weight: 900;
        z-index: 7; 
        pointer-events: none;
        /* 散發柔和光芒的滿版叉叉 */
        filter: drop-shadow(0 0 30px rgba(244, 63, 94, 0.9)) blur(0.5px);
        mix-blend-mode: overlay;
        animation: glowingMarkPulse 2s ease-in-out infinite;
    }
    @keyframes glowingMarkPulse {
        0% { transform: scale(1.05) rotate(-3deg); opacity: 0.5; filter: drop-shadow(0 0 20px rgba(244,63,94,0.6)) blur(1px); }
        50% { transform: scale(1) rotate(0deg); opacity: 0.9; filter: drop-shadow(0 0 50px rgba(244, 63, 94, 1)) blur(0px); }
        100% { transform: scale(1.05) rotate(3deg); opacity: 0.5; filter: drop-shadow(0 0 20px rgba(244,63,94,0.6)) blur(1px); }
    }
/* 🌟 【繁星閃爍專屬】四周淡淡金黃色光暈 + 背景明暗呼吸閃爍 */
.star-golden-vignette-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0) 30%, rgba(254, 240, 138, 0.22) 65%, rgba(245, 158, 11, 0.38) 100%);
    pointer-events: none;
    z-index: 1;
    animation: goldenShimmerPulse 4s ease-in-out infinite alternate;
}
@keyframes goldenShimmerPulse {
    0% { opacity: 0.55; filter: brightness(0.95); }
    50% { opacity: 0.85; filter: brightness(1.15) drop-shadow(0 0 15px rgba(254, 240, 138, 0.4)); }
    100% { opacity: 0.65; filter: brightness(1.0); }
}

/* 🌟 背景定點一閃一閃的微光星芒 */
.background-twinkle-sparkle {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    transform-origin: center center;
    animation: backgroundTwinkleBlink ease-in-out infinite;
}
@keyframes backgroundTwinkleBlink {
    0% { transform: scale(0.2); opacity: 0; filter: drop-shadow(0 0 0px #fff); }
    50% { transform: scale(1.15); opacity: 0.95; filter: drop-shadow(0 0 8px #fef08a); }
    100% { transform: scale(0.2); opacity: 0; filter: drop-shadow(0 0 0px #fff); }
}

/* 🌟 飄落流星與星星的滑落動畫 */
.twinkling-golden-star {
    position: absolute;
    pointer-events: none;
    z-index: 8;
    transform-origin: center center;
    animation: starGlissando linear infinite;
}
@keyframes starGlissando {
    0% { transform: translateY(-5vh) translateX(0px) rotate(0deg) scale(0.3); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(108vh) translateX(var(--star-drift)) rotate(360deg) scale(0.9); opacity: 0; }
}

/* 🌟 滑鼠劃過殘留的流星與星星粒子動畫 */
.star-cursor-trail {
    position: absolute;
    pointer-events: none;
    z-index: 100;
    transform-origin: center center;
    animation: cursorStarPop 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes cursorStarPop {
    0% {
        transform: translate(-50%, -50%) translate(0, 0) scale(0.4) rotate(0deg);
        opacity: 1;
        filter: drop-shadow(0 0 8px #fff);
    }
    40% {
        transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(1.1) rotate(45deg);
        opacity: 0.95;
        filter: drop-shadow(0 0 10px #fef08a);
    }
    100% {
        transform: translate(-50%, -50%) translate(calc(var(--tx) * 1.6), calc(var(--ty) * 1.6 + 15px)) scale(0.1) rotate(90deg);
        opacity: 0;
        filter: drop-shadow(0 0 0px transparent);
    }
}
        /* 🌟 【海兔本體的容器與動畫】 */
        .slug-container {
            position: absolute !important;
            width: 340px !important; height: 240px !important;
            cursor: grab !important; z-index: 10 !important; touch-action: none !important;
            left: calc(50% - 170px); top: calc(50% - 120px);
            user-select: none !important; -webkit-user-select: none !important; -webkit-user-drag: none !important;
            perspective: 800px; /* 解鎖 3D 側翻視覺 */
        }
        body.is-dragging-global, body.is-dragging-global * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
        .slug-container.is-petting .slug-svg { transform: scale(1.06, 0.92) translateY(12px); filter: drop-shadow(0 5px 8px rgba(0,0,0,0.25)); }
        .slug-svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.15)); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2), filter 0.3s ease; pointer-events: none !important; }
        
        /* 兔子的耳朵與尾巴自動擺動動畫 */
        @keyframes earTwitchL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
        @keyframes earTwitchR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg); } }
        @keyframes tailFluff { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.05) rotate(3deg); } }
        .anim-earL { animation: earTwitchL 3s infinite ease-in-out; transform-origin: 100px 95px; }
        .anim-earR { animation: earTwitchR 3.5s infinite ease-in-out; transform-origin: 145px 90px; }
        .anim-tail { animation: tailFluff 4s infinite ease-in-out; transform-origin: 240px 120px; }

       /* 🌟 【底部操作面板】餵食互動、切換商店與圖鑑 */
        .ui-panel {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 45%;
            background: var(--panel-bg); border-top: 3px solid white; display: flex; flex-direction: column;
            padding: 30px 20px 20px 20px; z-index: 80; border-radius: 40px 40px 0 0; box-shadow: 0 -10px 40px var(--shadow-color);
            /* 🪄 以下是新增的抽屜動畫魔法 */
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); 
        }
        
        /* 🌟 當面板被呼叫展開時的樣式 */
        .ui-panel.open {
            transform: translateY(0); /* 回到原位 */
        }
        .interaction-group { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn-interact { flex: 1; background: var(--card-bg); border: 3px solid var(--border-color); border-radius: 22px; padding: 16px 0; color: var(--text-dark); cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: 0.1s; box-shadow: 0 5px 0 var(--border-color); }

    60% {

    <!-- 🌟 ==========================================
         🌟 JavaScript 遊戲程式邏輯開始
         🌟 ========================================== -->
    <script>

// 🌟 【後台與網路連線資料】
        const API_BASE = 'https://api.drift-bottles.xyz'; // 伺服器網址
        
        // 🌟 1. 嚴格綁定帳號！直接去拿你真實登入系統存下來的 Token
        // 💡 寶寶注意：請把裡面的 'token' 換成你主程式登入時存進 localStorage 的名稱 
        // 💡 把括號裡的字，換成你在 F12 裡面找到的一模一樣的真實名字！
let GAME_TOKEN = localStorage.getItem('authToken') || localStorage.getItem('access_token');
        
        // 🌟 2. 殺掉單機測試防呆！如果沒抓到真實帳號，就不准他玩！
        if (!GAME_TOKEN) {
            alert("請先登入帳號才能看見您的海兔喔！");
            // window.location.href = "login.html"; // 如果需要，可以把這行打開，自動踢回登入頁
        }
        
        let socket = null;
        let currentRoomId = null;
        let otherPlayersData = {};
        let isRoomHost = false; // 🌟 判斷：用來確認目前這個人是不是房間的主人！
        
        // 單機模擬展示模式狀態
        let isMockMode = false;
        let mockIntervals = [];

        // 🌟 【呼叫伺服器 API 的小幫手】
        async function fetchAPI(endpoint, method = 'GET', payload = null) {
            try {
                const options = {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GAME_TOKEN}` }
                };
                if (payload) options.body = JSON.stringify(payload);
                const response = await fetch(`${API_BASE}${endpoint}`, options);
                return await response.json();
            } catch (error) {
                console.warn(`[API] ${endpoint} 失敗，使用本地邏輯...`);
                return null;
            }
        }

        // 🌟 【多人連線小總管】負責跟伺服器打招呼，處理誰加進來、誰離開，還有房主權限的判定
        function initSocketIO() {
            try {
                socket = io(API_BASE, { reconnectionAttempts: 3, timeout: 2000, transports: ['websocket', 'polling'] });
                socket.on('connect', () => { console.log('Socket 連線成功!'); });
                
                // 創立房間成功 -> 代表我是房主
                socket.on('room_created', (data) => { 
                    isRoomHost = true; 
                    currentRoomId = data.roomId; 
                    updateRoomUI(`房間代碼: ${currentRoomId} (房主)`); 
                    showFloatText('創立房間成功！'); 
                });
                
                // 加入別人的房間 -> 代表我是作客的
                socket.on('room_joined', (data) => {
                    console.log("偷看後端傳來的房間資料：", data); // 👈 加上這行！132
                    isRoomHost = false; 
                    currentRoomId = data.roomId; 
                    updateRoomUI(`已加入房間: ${currentRoomId}`); 
                    showFloatText('加入房間成功！');
                    document.getElementById('otherPlayersLayer').innerHTML = ''; 
                    otherPlayersData = {};
                    // 把房間裡原有的玩家畫出來
                    if(data.players) { 
                        data.players.forEach(p => { if(p.socketId !== socket.id) addOtherPlayer(p); }); 
                    }
                });

                socket.on('player_joined', (p) => { addOtherPlayer(p); showFloatText(`${p.petName} 來串門子了！`); });
                socket.on('player_moved', (data) => { /* 寶寶專屬護法陣型，不吃原本亂跑的設定 */ });
                socket.on('player_left', (data) => {
                    const el = document.getElementById(`player-${data.socketId}`);
                    if(el) { el.remove(); delete otherPlayersData[data.socketId]; }
                });
                socket.on('receive_message', (data) => { showChatBubble(data.senderName, data.message); });
                socket.on('error', (err) => { alert(err.message || "發生錯誤"); });
            } catch (e) { console.log('Socket.IO 未連線'); }
        }

        function getPlayerData() { return { memberId: Math.floor(Math.random() * 1000), petName: gameState.petName || '小可愛', petColor: gameState.currentSpecies }; }
        
        function createSocketRoom() { 
            if(!socket || !socket.connected) {
                if(confirm("伺服器未連線！要先開啟「單機模擬展示」看看連線後的樣子嗎？")) {
                    startMockMultiplayer();
                }
                return;
            }
            socket.emit('create_room', { playerData: getPlayerData(), maxPlayers: 6 }); 
        }

        function joinSocketRoom() {
            if(!socket || !socket.connected) {
                if(confirm("伺服器未連線！要先開啟「單機模擬展示」看看連線後的樣子嗎？")) {
                    startMockMultiplayer();
                }
                return;
            }
            const code = prompt("請輸入 6 碼房間邀請碼 (大寫英數):");
            if (code && code.trim().length > 0) socket.emit('join_room', { roomId: code.trim().toUpperCase(), playerData: getPlayerData() });
        }

        function leaveSocketRoom() { 
            if(isMockMode) {
                isMockMode = false;
                mockIntervals.forEach(clearInterval);
                mockIntervals = [];
            } else if(socket) {
                socket.emit('leave_room'); 
            }
            currentRoomId = null; 
            document.getElementById('otherPlayersLayer').innerHTML = ''; 
            otherPlayersData = {}; 
            updateRoomUI("尚未連線"); 
        }
        // 🌟 展開或收合連線面板的小魔法
        function toggleMpPanel() {
            const panel = document.getElementById('mpPanel');
            // 如果是隱藏的，就讓它彈出來；如果已經打開了，就把它收回去

// 🌟 【貼心小工具：一鍵複製房間代碼】
function copyRoomId() {
    if (!currentRoomId) return; // 防呆：如果沒有代碼就不做事

    // 呼叫瀏覽器內建的剪貼簿 API 來複製
    navigator.clipboard.writeText(currentRoomId).then(() => {
        // 複製成功，觸發畫面上飄起可愛的提示字！
        showFloatText('📋 代碼複製成功！', 2000);
    }).catch(err => {
        // 萬一遇到某些舊版瀏覽器擋住，就跳出傳統的框框讓玩家自己複製
        prompt("請手動複製代碼：", currentRoomId);
    });
}

        // 🌟 【寶寶專屬：好友護法列陣系統】讓好友乖乖排在你旁邊
        function updateFriendsPosition() {
            const slugEl = document.getElementById('slugContainer');
            const cx = parseFloat(slugEl.style.left) || (window.innerWidth / 2 - 170);
            const cy = parseFloat(slugEl.style.top) || (window.innerHeight * 0.29 - 120);

            // 排列位置：左、右、左下、右下
            const offsets = [
                { dx: -240, dy: 20 }, { dx: 260, dy: 20 },
                { dx: -130, dy: 160 }, { dx: 150, dy: 160 }
            ];

            Object.keys(otherPlayersData).forEach((id, index) => {
                const el = document.getElementById(`player-${id}`);
                if (el) {
                    const offset = offsets[index % 4];
                    el.style.left = (cx + offset.dx) + 'px';
                    el.style.top = (cy + offset.dy) + 'px';
                }
            });
        }

// 🌟 【切換介面顯示狀態】進入房間後，把商店收起來，只有房主能開百寶袋
function updateRoomUI(text) {
    const statusEl = document.getElementById('roomStatusText');
    
    if (currentRoomId && text !== "尚未連線") {
        statusEl.innerHTML = text + ` <button onclick="copyRoomId()" style="background: var(--accent-color); border: none; border-radius: 8px; cursor: pointer; padding: 4px 8px; font-size: 0.85rem; color: white; font-weight: 900; margin-left: 8px; box-shadow: 0 3px 0 rgba(255, 182, 193, 0.8); vertical-align: middle;" onmousedown="this.style.transform='translateY(3px)'; this.style.boxShadow='none';" onmouseup="this.style.transform='none'; this.style.boxShadow='0 3px 0 rgba(255, 182, 193, 0.8)';">📋 複製</button>`;
    } else {
        statusEl.innerText = text;
    }

    const btnFeed = document.getElementById('btnFeed');
    const btnClean = document.getElementById('btnClean');
    const btnPet = document.getElementById('btnPet');
    const tabs = document.querySelector('.ui-panel .tabs');
    const shopGrid = document.getElementById('shopGrid');
    const btnCatalog = document.getElementById('btnCatalog');

    if (currentRoomId) {
        // 已連線：隱藏大廳按鈕，顯示房間按鈕
        document.getElementById('btnCreateRoom').style.display = 'none'; 
        document.getElementById('btnJoinRoom').style.display = 'none'; 
        document.getElementById('btnChat').style.display = 'block'; 
        document.getElementById('btnLeaveRoom').style.display = 'block';
        
        // 隱藏互動按鈕與商店區塊
        if (btnFeed) btnFeed.style.display = 'none';
        if (btnClean) btnClean.style.display = 'none';
        if (btnPet) btnPet.style.display = 'none';
        if (tabs) tabs.style.display = 'none';
        if (shopGrid) shopGrid.style.display = 'none';
        
        // 🌟 房主專屬特權：如果是房主就顯示百寶袋，不然就隱藏
        if (btnCatalog) {
            btnCatalog.style.display = isRoomHost ? 'flex' : 'none';
        }
    } else {
        // 未連線：顯示大廳按鈕
        document.getElementById('btnCreateRoom').style.display = 'block'; 
        document.getElementById('btnJoinRoom').style.display = 'block'; 
        document.getElementById('btnChat').style.display = 'none'; 
        document.getElementById('btnLeaveRoom').style.display = 'none';
        
        // 恢復原狀，顯示互動按鈕與商店
        if (btnFeed) btnFeed.style.display = 'flex';
        if (btnClean) btnClean.style.display = 'flex';
        if (btnPet) btnPet.style.display = 'flex';
        if (tabs) tabs.style.display = 'flex';
        if (shopGrid) shopGrid.style.display = 'grid';
        if (btnCatalog) btnCatalog.style.display = 'none';
    }
}

        // 🌟 【遊戲啟動核心】網頁載入後第一個跑來這裡，負責讀檔、連線、把所有畫面準備好
        async function initGameData() {
            // 1. 先第一時間讀取本地存檔，讓畫面瞬間恢復！
            loadGame();
checkDaily();

            // 🌟 3. 背景悄悄同步伺服器資料
            try {
                const data = await fetchAPI('/pet-games/my-pet', 'GET');
                if (data && !data.error) {
                    console.log('成功從伺服器同步海兔資料！', data);
                    
                    // 同步名字與金幣
                    if (data.petName) gameState.petName = data.petName;
                    if (data.coins !== undefined) gameState.points = data.coins;
                    
                    // 同步目前裝備 (以下屬性名稱 data.bgColor 等，需確認後端實際給的名稱)
                    if (data.petColor) gameState.currentSpecies = data.petColor;
                    if (data.bgColor) gameState.currentBg = data.bgColor;
                    if (data.bgEffect) gameState.currentEffect = data.bgEffect;
                    
                    // 同步背包已解鎖清單 (這部分也需確認後端傳回的陣列名稱)
                    if (data.unlockedPets) gameState.unlockedSpecies = data.unlockedPets;

                    if (data.unlockedEffects) gameState.unlockedEffects = data.unlockedEffects;
                    
                    // 防呆：確保預設的經典兔一定在背包裡
                    if (!gameState.unlockedSpecies.includes(gameState.currentSpecies)) {
                        gameState.unlockedSpecies.push(gameState.currentSpecies);

                    gameState.hasAdopted = true; 
                    saveGame();
                    
                    checkFirstTime();
                    updateNameUI();
                    renderShop();
                    updateUI();

// 🌟 寶寶專屬：洗掉前任記憶的忘情水！

        // 切換商店的標籤頁 (幻獸/背景/特效)
        function switchTab(tab) {
            currentTab = tab;
            refreshAll(); 
            document.getElementById('tabSpecies').className = tab === 'species' ? 'tab active' : 'tab';
            document.getElementById('tabBg').className = tab === 'bg' ? 'tab active' : 'tab';
            document.getElementById('tabEffect').className = tab === 'effect' ? 'tab active' : 'tab';
        }

        // 🌟 【商店總管】幫你把商品排好，判斷你買過了沒
        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            const t = i18n[currLang];
            
            const txtTry = currLang === 'zh' ? '👀 試用' : 'Try';
            const txtBuy = currLang === 'zh' ? '💰 購買' : 'Buy';
            const txtCancel = currLang === 'zh' ? '❌ 取消' : 'Cancel';

            let dataObj, unlockedArr, currentActive, typeKey, currentTrial;
            if (currentTab === 'species') { dataObj = speciesData; unlockedArr = gameState.unlockedSpecies; currentActive = gameState.currentSpecies; typeKey = 'species'; currentTrial = trialState.species; }
            else if (currentTab === 'bg') { dataObj = bgData; unlockedArr = gameState.unlockedBgs; currentActive = gameState.currentBg; typeKey = 'bg'; currentTrial = trialState.bg; }
            else { dataObj = effectData; unlockedArr = gameState.unlockedEffects; currentActive = gameState.currentEffect; typeKey = 'effect'; currentTrial = trialState.effect; }

            Object.keys(dataObj).forEach(key => {
                const item = dataObj[key];
                let isUnlocked = unlockedArr.includes(key); // 買過了沒
                let isEquipped = (currentActive === key) && !currentTrial; // 正穿著嗎
                let isTrialing = (currentTrial === key); // 正在試用嗎

                const card = document.createElement('div');
                card.className = `item-card ${isEquipped || isTrialing ? 'equipped' : ''}`;
                
                let actionHTML = '';
                if (isUnlocked) { // 買過了
                    let btnText = isEquipped ? t.equip : t.owned;
                    actionHTML = `<div class="item-cost owned">${btnText}</div>`;
                    card.onclick = () => equipItem(key, typeKey); // 點了直接穿上
                } else if (isTrialing) { // 試用中
                    actionHTML = `
                        <div style="display:flex; gap:6px; justify-content:center; margin-top:5px;">
                            <div class="item-cost" style="background:#4ade80; font-size:0.8rem; padding:4px 8px; cursor:pointer;" onclick="buyItem('${key}', '${typeKey}', ${item.cost}, event)">${txtBuy}</div>
                            <div class="item-cost" style="background:#ef4444; font-size:0.8rem; padding:4px 8px; cursor:pointer;" onclick="cancelTrial('${typeKey}', event)">${txtCancel}</div>
                        </div>
                    `;
                } else { // 還沒買
                    actionHTML = `<div class="item-cost"><span style="font-size:0.7rem;margin-right:4px;">${txtTry}</span>${item.cost}</div>`;
                    card.onclick = () => tryItem(key, typeKey);
                }
                
                let previewStyle = typeKey === 'species' 
                    ? `background:${item.body}; border: 3px solid ${item.outline}`
                    : `background: ${item.preview}; border: 3px solid #cbd5e1`;

                card.innerHTML = `
                    <div class="item-color-preview" style="${previewStyle}"></div>
                    <div class="item-name">${item.name[currLang]}</div>
                    ${actionHTML}
                `;
                grid.appendChild(card);
            });
        }

        // 🌟 【百寶袋專屬邏輯】跟商店很像，只是過濾掉還沒買的東西
        function openCatalog() {
            document.getElementById('catalogModalOverlay').style.display = 'flex';
            renderCatalog();
        }
        function closeCatalog() { document.getElementById('catalogModalOverlay').style.display = 'none'; }
        
        function switchCatalogTab(tab) {
            currentTab = tab;
            document.getElementById('catTabSpecies').className = tab === 'species' ? 'tab active' : 'tab';
            document.getElementById('catTabBg').className = tab === 'bg' ? 'tab active' : 'tab';
            document.getElementById('catTabEffect').className = tab === 'effect' ? 'tab active' : 'tab';
            renderCatalog();
        }

        function renderCatalog() {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';
            const t = i18n[currLang];
            
            let dataObj, unlockedArr, currentActive, typeKey;
            if (currentTab === 'species') { dataObj = speciesData; unlockedArr = gameState.unlockedSpecies; currentActive = gameState.currentSpecies; typeKey = 'species'; }
            else if (currentTab === 'bg') { dataObj = bgData; unlockedArr = gameState.unlockedBgs; currentActive = gameState.currentBg; typeKey = 'bg'; }
            else { dataObj = effectData; unlockedArr = gameState.unlockedEffects; currentActive = gameState.currentEffect; typeKey = 'effect'; }

            Object.keys(dataObj).forEach(key => {
                const item = dataObj[key];
                
                // 🌟 核心：如果沒擁有的直接跳過不顯示！
                if (!unlockedArr.includes(key)) return;

                let isEquipped = (currentActive === key);
                const card = document.createElement('div');
                card.className = `item-card ${isEquipped ? 'equipped' : ''}`;
                
                let btnText = isEquipped ? t.equip : t.owned;
                card.onclick = () => { 
                    equipItem(key, typeKey); 
                    renderCatalog(); // 點擊換上後馬上刷新按鈕狀態
                };

                let previewStyle = typeKey === 'species' 
                    ? `background:${item.body}; border: 3px solid ${item.outline}`
                    : `background: ${item.preview}; border: 3px solid #cbd5e1`;

                card.innerHTML = `
                    <div class="item-color-preview" style="${previewStyle}"></div>
                    <div class="item-name">${item.name[currLang]}</div>
                    <div class="item-cost owned">${btnText}</div>
                `;
                grid.appendChild(card);
            });
        }

        // 🌟 【穿上裝備】
        function equipItem(key, type) {
            trialState[type] = null; // 取消試用狀態
            
            if (type === 'species') gameState.currentSpecies = key;
            else if (type === 'bg') gameState.currentBg = key;
            else gameState.currentEffect = key;
            
            // 如果身上已經沒有任何試用的東西了，就把倒數計時器收起來
            if (!trialState.species && !trialState.bg && !trialState.effect) {
                if(trialInterval) clearInterval(trialInterval);
                document.getElementById('trialTimerDisplay').style.display = 'none';
            }
            
            refreshAll();
            saveGame();
        }

let trialTimeLeft = 10; // 全域記錄試用剩餘時間

        function tryItem(key, type) {
            trialState[type] = key;
            refreshAll();
            
            if(trialTimer) clearTimeout(trialTimer);
            if(trialInterval) clearInterval(trialInterval);
            
            trialTimeLeft = 10;
            const timerDisplay = document.getElementById('trialTimerDisplay');
            const numDisplay = document.getElementById('trialCountdownNum');
            
            timerDisplay.style.display = 'block';
            numDisplay.innerText = trialTimeLeft;
            showFloatText('⏱️ 試用開始', 2000);
            
            startTrialCountdown();
        }

        // 獨立出計時器啟動函式，方便暫停與恢復
        function startTrialCountdown() {
            if(trialInterval) clearInterval(trialInterval);
            const timerDisplay = document.getElementById('trialTimerDisplay');
            
            trialInterval = setInterval(() => {
                trialTimeLeft--;
                const numDisplay = document.getElementById('trialCountdownNum');
                if (numDisplay) numDisplay.innerText = trialTimeLeft;
                
                if(trialTimeLeft <= 0) {
                    clearInterval(trialInterval);
                    timerDisplay.style.display = 'none';
                    trialState = { species: null, bg: null, effect: null };
                    refreshAll();
                    showFloatText('✨ 試用結束，喜歡就帶回家吧！', 5000); 
                }
            }, 1000);
        }

// 🌟 1. 購買物品：只要負責扣錢跟解鎖就好，剩下的交給 equipItem
        function buyItem(key, type, cost, e) {
            if(e) e.stopPropagation(); 
            if (gameState.points >= cost) {
                gameState.points -= cost; // 扣錢
                
                // 記錄到本地的已解鎖清單
                if (type === 'species') gameState.unlockedSpecies.push(key); 
                else if (type === 'bg') gameState.unlockedBgs.push(key); 
                else gameState.unlockedEffects.push(key); 
                
                // 呼叫裝備函數 (裡面會統一發送 API 給伺服器)
                equipItem(key, type); 
                showFloatText('✨ 購買成功 ✨', 5000);
            } else {
                showFloatText('積分不足 😢');
            }
        }
// 🌟 【取消試用】按鈕的專屬煞車系統
        function cancelTrial(type, e) {
            // 防止點擊取消按鈕時，不小心點到背後的商品卡片
            if (e) e.stopPropagation(); 
            
            // 1. 把該部位的試用狀態清空
            trialState[type] = null; 
            
            // 2. 檢查是不是身上所有的試用都取消了？如果是，就把上面的倒數計時器關掉隱藏
            if (!trialState.species && !trialState.bg && !trialState.effect) {
                if (trialInterval) clearInterval(trialInterval);
                document.getElementById('trialTimerDisplay').style.display = 'none';
            }
            
            // 3. 重新刷新畫面，讓海兔一秒變回原本穿著的樣子
            refreshAll();
            showFloatText('✨ 已取消試用');
        }
        // 🌟 2. 裝備物品：不管你是剛買的還是早就有的，只要穿上就跟伺服器報備！
        function equipItem(key, type) {
            trialState[type] = null; 
            
            let categoryStr = '';
            if (type === 'species') {
                gameState.currentSpecies = key;
                categoryStr = 'pet_color';
            } else if (type === 'bg') {
                gameState.currentBg = key;
                categoryStr = 'background_color';
            } else {
                gameState.currentEffect = key;
                categoryStr = 'background_effects';
            }
            
            // ✨ 在這裡統一告訴伺服器：我換裝備囉！
            fetchAPI('/pet-games/buy', 'POST', { category: categoryStr, itemName: key });
            
            // 取消試用計時器
            if (!trialState.species && !trialState.bg && !trialState.effect) {
                if(trialInterval) clearInterval(trialInterval);
                document.getElementById('trialTimerDisplay').style.display = 'none';
            }
            
            refreshAll();
            saveGame();
        }

        // 🌟 【一鍵畫面重繪】每次有改變就叫他幫忙把海兔、背景、特效全部重新畫一次
        function refreshAll() {
            applySlugStyles();
            applyBg();
            applyEffect();
            renderShop();
            updateRecallButtonVisibility(); // 確保浮動挑釁按鈕顯示正確

            // 🎨 檢查目前是否為 paint 特效，來決定左下角按鈕要不要顯示
            const palettePanel = document.getElementById('paintPalettePanel');
            if (palettePanel) {
                const activeEffect = trialState.effect || gameState.currentEffect;

                        pCtx.save();
                        splatters.forEach(s => {

                        pCtx.restore();

                                    y: drop.ty,
                                    radius: drop.radius,

                                if (splatters.length > 25) splatters.shift();
                                flyingDrops.splice(i, 1);

                            let curX = drop.x + (drop.tx - drop.x) * ease;
                            let curY = drop.y + (drop.ty - drop.y) * ease;
                            let curScale = 0.15 + 0.85 * drop.progress;

                            list.push({

                                y: Math.sin(angle) * dist,
                                r: radius * (0.05 + Math.random() * 0.1),
                                connected: Math.random() > 0.3
                            });
                        }
                        return list;

                        ctx.save();

                        ctx.lineWidth = 1.8;
                        s.splashes.forEach(sp => {

                                ctx.moveTo(0, 0);
                                ctx.quadraticCurveTo(sp.x * 0.4, sp.y * 0.4, sp.x, sp.y);
                                ctx.stroke();
                            }
                        });

                        ctx.beginPath();
                        const len = s.points.length;
                        for (let i = 0; i < len; i++) {
                            const angle = (i / len) * Math.PI * 2;
                            const r = s.radius * s.points[i];
                            const px = s.x + Math.cos(angle) * r;
                            const py = s.y + Math.sin(angle) * r;
                            if (i === 0) ctx.moveTo(px, py);
                            else ctx.quadraticCurveTo(s.x + Math.cos(angle - 0.25) * (r * 1.2), s.y + Math.sin(angle - 0.25) * (r * 1.2), px, py);

                        ctx.closePath();
                        ctx.fill();

                            const dotY = s.y + sp.y;
                            ctx.moveTo(dotX + sp.r, dotY);
                            ctx.arc(dotX, dotY, sp.r, 0, Math.PI * 2);

                        ctx.fill();

                        ctx.restore();

    // 💖 【心動幻境】滑鼠互動愛心監聽器：滑鼠滑過時在指標位置生成小愛心

        });

    hbCanvas.style.pointerEvents = 'auto';
    hbCanvas.addEventListener('mousemove', mouseHeartHandler);

    function drawHeartPath(ctx, x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(size, size);
        ctx.beginPath();
        ctx.moveTo(0, -15);
        ctx.bezierCurveTo(-25, -45, -65, -5, 0, 45);
        ctx.bezierCurveTo(65, -5, 25, -45, 0, -15);
        ctx.closePath();
        ctx.restore();

        if (gameState.currentEffect !== 'heartbeat' && trialState.effect !== 'heartbeat') {
            if (hbCanvas.parentNode) hbCanvas.parentNode.removeChild(hbCanvas);

        function getSaveKey() {

                if (currentUser && (currentUser.email || currentUser.name)) {
                    return 'nudi_save_' + (currentUser.email || currentUser.name);

        function saveGame() { 
            try {
                const dataString = JSON.stringify(gameState);
                const encodedData = btoa(encodeURIComponent(dataString)); 
                localStorage.setItem(getSaveKey(), encodedData); // 用專屬鑰匙上鎖！
            } catch(e) {
                console.warn("存檔失敗", e);
            }
        }

            if (saved) { 
                try {

                    // 如果有加密過，就幫它解碼
                    if (!saved.startsWith('{')) {
                        decodedData = decodeURIComponent(atob(saved));
                    }
                    let parsed = JSON.parse(decodedData);

        function initDragAndPetSystem() {

                if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };

        function playDuckStepSound(scale = 1.0) {

                // 1. 踩水波的「啪嗒」短促水音
                const osc = ctx.createOscillator();

                osc.type = 'triangle';

                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + duration);

                // 柔和低通濾波器（降低尖銳高頻，讓聲音更溫潤）
                filter.type = 'lowpass';

    const today = new Date().toLocaleDateString();
    
    if (!gameState.daily) {
        gameState.daily = {
            lastCheckInDate: '', streakDays: 0, todayClaimed: false,
            progress: { pet: 0, feed: 0, clean: 0 }, claimed: { pet: false, feed: false, clean: false }
        };
    }

    if (gameState.daily.lastCheckInDate !== today) {
        if (gameState.daily.streakDays >= 14) {
            gameState.daily.streakDays = 0; // 滿 14 天自動回到第 1 天！
        }
        gameState.daily.lastCheckInDate = today;
        gameState.daily.todayClaimed = false; 
        gameState.daily.progress = { pet: 0, feed: 0, clean: 0 };
        gameState.daily.claimed = { pet: false, feed: false, clean: false };

                    const shimmerGain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    shimmerOsc.type = 'triangle';
                    shimmerOsc.frequency.setValueAtTime(freq * 2, now);

                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.linearRampToValueAtTime(volume, now + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

                    shimmerGain.gain.setValueAtTime(0.0001, now);
                    shimmerGain.gain.linearRampToValueAtTime(volume * 0.22, now + 0.02);
                    shimmerGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    shimmerOsc.connect(shimmerGain);
                    shimmerGain.connect(ctx.destination);

                    osc.start(now);
                    shimmerOsc.start(now);
                    osc.stop(now + 3.0);
                    shimmerOsc.stop(now + 1.8);
                } catch(e) {}
            }

            function playRomanticLoop() {
                if (window.sakuraSessionId !== currentSession || !window.sakuraMusicActive) return;

                const activeEffect = trialState.effect || gameState.currentEffect;
                if (activeEffect !== 'sakura') {
                    window.sakuraMusicActive = false;
                    return;
                }

                // 將每個音符計時器存入陣列中管控
                romanticMelody.forEach(item => {
                    const t = setTimeout(() => {
                        if (window.sakuraSessionId === currentSession && window.sakuraMusicActive) {
                            const freq = harpScale[item.note];
                            playMusicBoxNote(freq, 0.035);
                        }
                    }, item.delay);
                    window.sakuraNoteTimers.push(t);
                });

                window.sakuraMusicTimer = setTimeout(playRomanticLoop, 19000);
            }

            playRomanticLoop();
        }
        // 🎵 【活潑動感 Pop 音符音樂引擎】(生動明亮、輕快律動、無版權、自動循環)
        function startMusicBGM() {
            window.musicNoteActive = true;

            // 明亮活潑的 C 大調高八度音階頻率
            const noteFreqs = {
                'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
                'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77,
                'C6': 1046.50
            };

            // 輕快俏皮的彈跳旋律序列
            const bounceMelody = [
                { note: 'C5', time: 0 },
                { note: 'E5', time: 160 },
                { note: 'G5', time: 320 },
                { note: 'C6', time: 480 },
                { note: 'G5', time: 700 },
                { note: 'A5', time: 920 },
                { note: 'G5', time: 1140 },
                { note: 'E5', time: 1360 },

                { note: 'D5', time: 1680 },
                { note: 'F5', time: 1840 },
                { note: 'A5', time: 2000 },
                { note: 'B5', time: 2160 },
                { note: 'C6', time: 2400 },
                { note: 'G5', time: 2650 },
                { note: 'E5', time: 2900 },
                { note: 'C5', time: 3150 }
            ];

            function playPopNote(freq, volume = 0.038) {
                if (!window.musicNoteActive) return;
                try {
                    if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') {
                        sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (sharedAudioCtx.state === 'suspended') {
                        sharedAudioCtx.resume();
                    }

                    const ctx = sharedAudioCtx;
                    const now = ctx.currentTime;

                    // 主音合成器（明亮方波 + 柔和濾波）
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const filter = ctx.createBiquadFilter();

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now);

                    // 低通濾波打造圓潤俏皮的 8-bit Pop 質感
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(2200, now);
                    filter.frequency.exponentialRampToValueAtTime(600, now + 0.22);

                    // 短促彈跳音量包絡
                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.linearRampToValueAtTime(volume, now + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.25);
                } catch(e) {}
            }

            function playMusicLoop() {
                if (!window.musicNoteActive) return;
                const activeEffect = trialState.effect || gameState.currentEffect;
                if (activeEffect !== 'music') {
                    window.musicNoteActive = false;
                    return;
                }

                bounceMelody.forEach(item => {
                    setTimeout(() => {
                        if (window.musicNoteActive && (trialState.effect === 'music' || gameState.currentEffect === 'music')) {
                            playPopNote(noteFreqs[item.note], 0.035);
                        }
                    }, item.time);
                });

                // 每 4 秒循環一次活潑小樂段
                window.musicNoteTimer = setTimeout(playMusicLoop, 4000);
            }

            playMusicLoop();
        }
        // 🎵 【音符打擊即時音效】(隨連擊音調遞增)
        function playHitNoteSound(combo = 1) {
            try {
                if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') {
                    sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (sharedAudioCtx.state === 'suspended') {
                    sharedAudioCtx.resume();
                }

                const ctx = sharedAudioCtx;
                const now = ctx.currentTime;

                // 隨連擊步進的大調音階頻率
                const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51];
                const freq = scale[(combo - 1) % scale.length];

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.065, now + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.32);
            } catch(e) {}
        }

        // 🎵 【活潑動感 Pop 背景音樂引擎】(Session 驗證防重疊版)

            function playMusicLoop() {

        // 🎼 【五線譜專屬清脆單音發聲器】(高音量清亮加強版)
        function playSingleStaffTone(freq, volume = 0.22) {
            try {
                if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') {
                    sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (sharedAudioCtx.state === 'suspended') {
                    sharedAudioCtx.resume();
                }

                const ctx = sharedAudioCtx;
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                // 額外加入微弱泛音層，讓聲音大聲且更具穿透力
                const shimmerOsc = ctx.createOscillator();
                const shimmerGain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);

                shimmerOsc.type = 'triangle';
                shimmerOsc.frequency.setValueAtTime(freq * 2, now);

                // 主音量提升
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

                // 泛音層音量提升
                shimmerGain.gain.setValueAtTime(0.0001, now);
                shimmerGain.gain.linearRampToValueAtTime(volume * 0.4, now + 0.01);
                shimmerGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

                osc.connect(gain);
                gain.connect(ctx.destination);
                shimmerOsc.connect(shimmerGain);
                shimmerGain.connect(ctx.destination);

                osc.start(now);
                shimmerOsc.start(now);
                osc.stop(now + 0.58);
                shimmerOsc.stop(now + 0.38);
            } catch(e) {}
        }
