<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幻獸海兔養成</title>
    <!-- 引入圓潤可愛的字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 更粉嫩、溫暖的 UI 配色 */
            --primary-bg: #fff0f5; 
            --panel-bg: #ffffff;
            --card-bg: #fff9fa;
            --accent-color: #ffb6c1;
            --text-dark: #6b4c4a; /* 暖可可色代替冷灰色 */
            --text-dim: #b89f9d;
            --border-color: #ffd1dc;
            --btn-hover: #ffedf0;
            --shadow-color: rgba(255, 182, 193, 0.4);
            
            /* 預設海兔顏色變數 (經典雪兔) */
            --c-body: #ffffff;
            --c-outline: #3f2a2a;
            --c-ear-top: #3f2a2a;
            --c-tail: #3f2a2a;
            --c-spot: #3f2a2a;
            --c-blush: #fca5a5;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            /* 套用可愛字體 */
            font-family: 'Nunito', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--primary-bg);
            color: var(--text-dark);
        }

        /* ------------------ 頂部列 ------------------ */
        .top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .points-display {
            background: #ffffff;
            padding: 8px 24px;
            border-radius: 30px;
            border: 3px solid var(--border-color);
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-dark);
            /* Q版立體陰影 */
            box-shadow: 0 4px 0 var(--border-color);
            backdrop-filter: blur(4px);
            font-size: 1.1rem;
        }

        .lang-btn {
            background: #ffffff;
            border: 3px solid var(--border-color);
            color: var(--text-dark);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.9rem;
            transition: 0.1s;
            box-shadow: 0 4px 0 var(--border-color);
        }
        
        .lang-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        /* ------------------ 舞台區域 ------------------ */
        .stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 58%; /* 微調高度讓海兔更有空間 */
            background: #dbeafe; 
            overflow: hidden;
            transition: background 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 更夢幻的點點背景裝飾 */
        .dot-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.7) 3px, transparent 3px);
            background-size: 35px 35px;
            opacity: 0.9;
            pointer-events: none;
            /* 加上一點柔和的內陰影，讓畫面更有包覆感 */
            box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.5);
        }

        /* ================== 海兔保護區 (開始) ================== */
        .slug-container {
            position: relative;
            width: 340px;
            height: 240px;
            cursor: pointer;
            z-index: 10;
            animation: floatSlug 4s infinite ease-in-out;
            margin-top: 40px;
        }

        @keyframes floatSlug {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.02, 0.98); }
        }

        .slug-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.1));
        }

        @keyframes earTwitchL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
        @keyframes earTwitchR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg); } }
        @keyframes tailFluff { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.05) rotate(3deg); } }

        .anim-earL { animation: earTwitchL 3s infinite ease-in-out; transform-origin: 100px 95px; }
        .anim-earR { animation: earTwitchR 3.5s infinite ease-in-out; transform-origin: 145px 90px; }
        .anim-tail { animation: tailFluff 4s infinite ease-in-out; transform-origin: 240px 120px; }
        /* ================== 海兔保護區 (結束) ================== */

        /* ------------------ UI 操作面板 ------------------ */
        .ui-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: var(--panel-bg);
            border-top: 3px solid white;
            display: flex;
            flex-direction: column;
            padding: 30px 20px 20px 20px;
            z-index: 20;
            /* 加大圓角，增加軟陰影 */
            border-radius: 40px 40px 0 0;
            box-shadow: 0 -10px 40px var(--shadow-color);
        }

        .interaction-group {
            display: flex;
            gap: 15px; /* 加大間距 */
            margin-bottom: 25px;
        }

        .btn-interact {
            flex: 1;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 22px; /* 圓潤的按鈕 */
            padding: 16px 0;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.1s;
            /* 立體感 */
            box-shadow: 0 5px 0 var(--border-color);
        }

        .btn-interact:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 0px 0 transparent;
            background: var(--btn-hover);
        }

        .btn-interact:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #f1f5f9;
            border-color: #cbd5e1;
            box-shadow: 0 5px 0 #cbd5e1;
            color: #94a3b8;
        }

        .btn-title { font-size: 1.05rem; font-weight: 900; margin-bottom: 6px; }
        .btn-desc { font-size: 0.8rem; color: var(--text-dim); font-weight: 800;}

        /* ------------------ 頁籤區 ------------------ */
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 10px;
            padding-left: 5px;
        }

        .tab {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 15px;
            transition: 0.2s;
        }
        
        .tab:hover { background: var(--btn-hover); }
        
        .tab.active { 
            color: white; 
            background: var(--text-dark);
            box-shadow: 0 3px 10px rgba(107, 76, 74, 0.2);
        }

        /* ------------------ 商店網格 ------------------ */
        .shop-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            overflow-y: auto;
            padding: 5px 5px 20px 5px;
        }
        .shop-grid::-webkit-scrollbar { width: 0; }

        .item-card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 22px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 0 var(--border-color);
        }
        
        .item-card:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }
        
        .item-card.equipped { 
            border-color: var(--text-dark); 
            background: #ffffff; 
            box-shadow: 0 4px 0 var(--text-dark);
        }
        
        .item-color-preview {
            width: 45px;
            height: 45px;
            border-radius: 15px;
            margin: 0 auto 15px auto;
            border: 3px solid rgba(0,0,0,0.08);
        }
        .item-name { font-size: 0.85rem; font-weight: 900; margin-bottom: 10px; color: var(--text-dark); line-height: 1.3;}
        .item-cost { 
            font-size: 0.9rem; 
            font-weight: 900; 
            color: white; 
            background: var(--accent-color);
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
            margin: 0 auto;
        }
        .item-cost.owned { 
            background: #e2e8f0;
            color: var(--text-dim);
        }
        .item-card.equipped .item-cost.owned {
            background: var(--text-dark);
            color: white;
        }

        /* ------------------ 盲盒/首抽 ------------------ */
        .gacha-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 240, 245, 0.95);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .gacha-box {
            width: 160px;
            height: 160px;
            background: white;
            border: 5px dashed var(--accent-color);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 40px;
            transition: 0.2s;
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: 900;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.3);
            animation: breatheBox 2s infinite ease-in-out;
        }
        
        @keyframes breatheBox {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .gacha-box:active { transform: scale(0.95); animation: none; }

        .gacha-title {
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: 900;
            color: var(--text-dark);
            text-shadow: 0 4px 10px rgba(255,255,255,0.8);
        }

        .start-btn {
            background: var(--text-dark);
            color: white;
            border: none;
            padding: 16px 50px;
            border-radius: 35px;
            font-weight: 900;
            font-size: 1.3rem;
            cursor: pointer;
            display: none;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            transition: 0.1s;
        }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }

        .float-text {
            position: absolute;
            color: var(--accent-color);
            font-weight: 900;
            font-size: 2rem;
            pointer-events: none;
            text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white;
            animation: floatUp 1s forwards cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); }
            50% { transform: translate(-50%, -50px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -90px) scale(1); }
        }
    </style>
</head>
<body>

    <div class="gacha-overlay" id="gachaScreen">
        <div class="gacha-title" id="gachaTitle">發現神祕海兔卵</div>
        <div class="gacha-box" id="gachaBox" onclick="rollGacha()">點擊孵化</div>
        <button class="start-btn" id="startBtn" onclick="startGame()">開始照顧</button>
    </div>

    <div class="top-bar">
        <div class="points-display"><span id="txtPts">積分</span>: <span id="pointDisplay">0</span></div>
        <button class="lang-btn" onclick="toggleLang()" id="btnLang">EN</button>
    </div>

    <div class="stage" id="mainStage">
        <div class="dot-pattern"></div>
        <div class="slug-container" id="slugContainer" onclick="petSlugDirectly(event)">
            
            <svg class="slug-svg" viewBox="0 0 340 240">
                <defs>
                    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--c-ear-top)" />
                        <stop offset="60%" stop-color="var(--c-ear-top)" />
                        <stop offset="100%" stop-color="var(--c-body)" />
                    </linearGradient>
                    <filter id="handDrawn" x="-10%" y="-10%" width="120%" height="120%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
                    </filter>
                </defs>

                <g filter="url(#handDrawn)">
                    <ellipse cx="170" cy="205" rx="120" ry="15" fill="rgba(0,0,0,0.12)" />

                    <g class="anim-tail" stroke="var(--c-outline)" stroke-width="4" stroke-linejoin="round">
                        <path d="M 250 170 C 270 180, 300 190, 290 140 C 280 100, 250 140, 240 170 Z" fill="var(--c-tail)"/>
                        <path d="M 260 150 C 290 160, 320 120, 280 80 C 260 60, 230 110, 250 150 Z" fill="var(--c-tail)"/>
                        <path d="M 240 130 C 260 100, 270 70, 240 50 C 210 30, 200 90, 230 120 Z" fill="var(--c-tail)"/>
                    </g>

                    <path d="M 70 190 C 20 180, 30 120, 90 110 C 160 100, 220 105, 260 130 C 290 150, 280 200, 200 210 C 130 220, 90 200, 70 190 Z" fill="var(--c-body)" stroke="var(--c-outline)" stroke-width="5" stroke-linejoin="round"/>

                    <g fill="var(--c-spot)">
                        <circle cx="90" cy="135" r="4"/>
                        <circle cx="125" cy="125" r="5"/>
                        <circle cx="170" cy="130" r="3.5"/>
                        <circle cx="210" cy="140" r="5.5"/>
                        <circle cx="245" cy="155" r="4"/>
                        
                        <circle cx="75" cy="160" r="4.5"/>
                        <circle cx="110" cy="165" r="3"/>
                        <circle cx="145" cy="180" r="5.5"/>
                        <circle cx="190" cy="185" r="4"/>
                        <circle cx="230" cy="175" r="4.5"/>
                        
                        <circle cx="100" cy="190" r="4"/>
                        <circle cx="160" cy="200" r="4.5"/>
                        <circle cx="205" cy="195" r="3.5"/>
                    </g>

                    <g stroke="var(--c-outline)" stroke-width="4" stroke-linejoin="round">
                        <path class="anim-earL" d="M 100 105 C 80 50, 95 20, 110 25 C 125 30, 120 90, 115 105 Z" fill="url(#earGrad)"/>
                        <path class="anim-earR" d="M 145 100 C 135 45, 160 15, 175 25 C 190 35, 165 85, 160 100 Z" fill="url(#earGrad)"/>
                    </g>

                    <g transform="translate(130, 150)">
                        <ellipse cx="-35" cy="12" rx="14" ry="8" fill="var(--c-blush)" opacity="0.85"/>
                        <ellipse cx="35" cy="12" rx="14" ry="8" fill="var(--c-blush)" opacity="0.85"/>
                        
                        <circle cx="-20" cy="0" r="7" fill="#2c3e50" />
                        <circle cx="20" cy="0" r="7" fill="#2c3e50" />
                        
                        <circle cx="-18" cy="-2" r="2.5" fill="#ffffff" />
                        <circle cx="22" cy="-2" r="2.5" fill="#ffffff" />
                        
                        <path d="M -7 5 Q 0 12 7 5" fill="none" stroke="#2c3e50" stroke-width="3.5" stroke-linecap="round"/>
                    </g>
                </g>
            </svg>
            
        </div>
    </div>

    <div class="ui-panel">
        <div class="interaction-group">
            <button class="btn-interact" id="btnFeed" onclick="interact('feed', 80, 8)">
                <span class="btn-title" id="txtFeedTitle">餵食海藻</span>
                <span class="btn-desc" id="txtFeedDesc">冷卻 0s</span>
            </button>
            <button class="btn-interact" id="btnClean" onclick="interact('clean', 100, 15)">
                <span class="btn-title" id="txtCleanTitle">淨化水質</span>
                <span class="btn-desc" id="txtCleanDesc">冷卻 0s</span>
            </button>
            <button class="btn-interact" id="btnPet" onclick="interact('pet', 50, 5)">
                <span class="btn-title" id="txtPetTitle">溫柔撫摸</span>
                <span class="btn-desc" id="txtPetDesc">冷卻 0s</span>
            </button>
        </div>

        <div class="tabs">
            <button class="tab active" id="tabSpecies" onclick="switchTab('species')">幻獸圖鑑</button>
            <button class="tab" id="tabEnvironment" onclick="switchTab('env')">環境佈景</button>
        </div>

        <div class="shop-grid" id="shopGrid"></div>
    </div>

    <script>
        // ---------------- 語言字典 ----------------
        const i18n = {
            zh: {
                points: "積分", langBtn: "EN", 
                gachaTitle: "發現神祕海兔卵", gachaBox: "點擊孵化", startBtn: "開始照顧",
                feed: "餵食海藻", clean: "淨化水質", pet: "溫柔撫摸",
                cooldown: "冷卻", ready: "可互動",
                tabSpecies: "圖鑑", tabEnv: "佈景",
                equip: "培育中", owned: "已解鎖"
            },
            en: {
                points: "Pts", langBtn: "中文", 
                gachaTitle: "Mystic Egg Found", gachaBox: "Incubate", startBtn: "Start Caring",
                feed: "Feed Algae", clean: "Purify Water", pet: "Gentle Pet",
                cooldown: "CD", ready: "Ready",
                tabSpecies: "Species", tabEnv: "Habitat",
                equip: "Active", owned: "Unlocked"
            }
        };
        let currLang = 'zh';

        // ---------------- 遊戲資料 ----------------
        let gameState = {
            hasAdopted: false,
            points: 2000,
            currentSpecies: 'snow',
            currentEnv: 'sky',
            unlockedSpecies: [], 
            unlockedItems: ['sky'],
            cooldowns: { feed: 0, clean: 0, pet: 0 }
        };

        // ===== 擴充後的海兔圖鑑 =====
        const speciesData = {
            snow: { name: {zh: '經典雪兔', en: 'Snow Bunny'}, cost: 0, body: '#ffffff', outline: '#3f2a2a', earTop: '#3f2a2a', tail: '#3f2a2a', spot: '#3f2a2a', blush: '#fca5a5' },
            ocean: { name: {zh: '深海藍寶', en: 'Ocean Gem'}, cost: 1200, body: '#e0f2fe', outline: '#1e3a8a', earTop: '#1e3a8a', tail: '#1e3a8a', spot: '#1e3a8a', blush: '#f472b6' },
            matcha: { name: {zh: '抹茶麻糬', en: 'Matcha Mochi'}, cost: 1500, body: '#ecfccb', outline: '#14532d', earTop: '#14532d', tail: '#14532d', spot: '#14532d', blush: '#f87171' },
            berry: { name: {zh: '草莓牛奶', en: 'Strawberry Milk'}, cost: 1800, body: '#fce7f3', outline: '#831843', earTop: '#831843', tail: '#831843', spot: '#831843', blush: '#fb7185' },
            choco: { name: {zh: '焦糖布丁', en: 'Caramel Pudding'}, cost: 2000, body: '#fef3c7', outline: '#713f12', earTop: '#713f12', tail: '#713f12', spot: '#713f12', blush: '#f87171' },
            grape: { name: {zh: '薰衣草', en: 'Lavender'}, cost: 2200, body: '#f3e8ff', outline: '#4c1d95', earTop: '#4c1d95', tail: '#4c1d95', spot: '#4c1d95', blush: '#f472b6' },
            lemon: { name: {zh: '黃金檸檬', en: 'Golden Lemon'}, cost: 2500, body: '#fef08a', outline: '#9a3412', earTop: '#ea580c', tail: '#ea580c', spot: '#ea580c', blush: '#ef4444' },
            sesame: { name: {zh: '黑糖芝麻', en: 'Sesame'}, cost: 2800, body: '#f1f5f9', outline: '#0f172a', earTop: '#0f172a', tail: '#0f172a', spot: '#0f172a', blush: '#f87171' },
            sakura: { name: {zh: '櫻花雪兔', en: 'Sakura Bunny'}, cost: 3000, body: '#ffffff', outline: '#be185d', earTop: '#f472b6', tail: '#f472b6', spot: '#f472b6', blush: '#fb7185' },
            mint: { name: {zh: '薄荷巧克力', en: 'Mint Choco'}, cost: 3500, body: '#ccfbf1', outline: '#0f766e', earTop: '#3f2a2a', tail: '#3f2a2a', spot: '#3f2a2a', blush: '#f472b6' },
            // --- 全新加入的幻獸海兔 ---
            watermelon: { name: {zh: '清涼西瓜', en: 'Watermelon'}, cost: 3800, body: '#bbf7d0', outline: '#14532d', earTop: '#f87171', tail: '#f87171', spot: '#000000', blush: '#fca5a5' },
            galaxy: { name: {zh: '星空宇宙', en: 'Galaxy'}, cost: 4500, body: '#1e1b4b', outline: '#c7d2fe', earTop: '#8b5cf6', tail: '#8b5cf6', spot: '#fde047', blush: '#d8b4fe' },
            sunset: { name: {zh: '日落晚霞', en: 'Sunset'}, cost: 5000, body: '#ffedd5', outline: '#9a3412', earTop: '#f97316', tail: '#f43f5e', spot: '#9a3412', blush: '#fca5a5' },
            coffee: { name: {zh: '焦糖拿鐵', en: 'Caramel Latte'}, cost: 5500, body: '#ddbea9', outline: '#6b705c', earTop: '#ffe8d6', tail: '#ffe8d6', spot: '#cb997e', blush: '#ffb4a2' },
            ghost: { name: {zh: '幽靈白兔', en: 'Spooky Ghost'}, cost: 6000, body: '#f8fafc', outline: '#475569', earTop: '#94a3b8', tail: '#94a3b8', spot: '#475569', blush: '#cbd5e1' },
            gold: { name: {zh: '招財純金', en: 'Pure Gold'}, cost: 8888, body: '#fef08a', outline: '#b45309', earTop: '#f59e0b', tail: '#f59e0b', spot: '#b45309', blush: '#fbbf24' }
        };

        const envData = {
            sky: { name: {zh: '晴空藍', en: 'Sky Blue'}, cost: 0, bg: '#dbeafe' },
            peach: { name: {zh: '蜜桃粉', en: 'Peach Pink'}, cost: 800, bg: '#fce7f3' },
            mintBg: { name: {zh: '薄荷綠', en: 'Mint Green'}, cost: 1000, bg: '#d1fae5' },
            lavender: { name: {zh: '薰衣草紫', en: 'Lavender'}, cost: 1200, bg: '#f3e8ff' }
        };

        let currentTab = 'species';

        window.onload = function() {
            loadGame();
            updateLangUI();
            checkFirstTime();
            renderShop();
            startCooldownTimer();
        };

        function toggleLang() {
            currLang = currLang === 'zh' ? 'en' : 'zh';
            updateLangUI();
            renderShop();
            updateUI();
        }

        function updateLangUI() {
            const t = i18n[currLang];
            document.getElementById('btnLang').innerText = t.langBtn;
            document.getElementById('txtPts').innerText = t.points;
            document.getElementById('gachaTitle').innerText = t.gachaTitle;
            if(document.getElementById('gachaBox').innerText !== '' && !document.getElementById('gachaBox').innerHTML.includes('div')) {
                document.getElementById('gachaBox').innerText = t.gachaBox;
            }
            document.getElementById('startBtn').innerText = t.startBtn;
            
            document.getElementById('txtFeedTitle').innerText = t.feed;
            document.getElementById('txtCleanTitle').innerText = t.clean;
            document.getElementById('txtPetTitle').innerText = t.pet;
            
            document.getElementById('tabSpecies').innerText = t.tabSpecies;
            document.getElementById('tabEnvironment').innerText = t.tabEnv;
        }

        function checkFirstTime() {
            if (!gameState.hasAdopted) {
                document.getElementById('gachaScreen').style.display = 'flex';
            } else {
                document.getElementById('gachaScreen').style.display = 'none';
                applySlugStyles();
                applyEnv();
                updateUI();
            }
        }

        function rollGacha() {
            const box = document.getElementById('gachaBox');
            box.style.border = '5px solid transparent';
            box.style.animation = 'none';
            box.innerText = '...';
            
            setTimeout(() => {
                const keys = Object.keys(speciesData);
                const randomKey = keys[Math.floor(Math.random() * keys.length)];
                
                gameState.unlockedSpecies = [randomKey];
                gameState.currentSpecies = randomKey;
                gameState.hasAdopted = true;
                
                document.getElementById('gachaTitle').innerText = speciesData[randomKey].name[currLang];
                box.style.border = 'none';
                box.style.boxShadow = 'none';
                box.innerHTML = `<div style="width:80px;height:80px;border-radius:25px;background:${speciesData[randomKey].body};border:4px solid ${speciesData[randomKey].outline}; box-shadow: 0 10px 20px rgba(0,0,0,0.1)"></div>`;
                
                document.getElementById('startBtn').style.display = 'block';
            }, 1000);
        }

        function startGame() {
            document.getElementById('gachaScreen').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('gachaScreen').style.display = 'none';
                saveGame();
                applySlugStyles();
                renderShop();
                updateUI();
            }, 500);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabSpecies').className = tab === 'species' ? 'tab active' : 'tab';
            document.getElementById('tabEnvironment').className = tab === 'env' ? 'tab active' : 'tab';
            renderShop();
        }

        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            const t = i18n[currLang];

            let dataObj = currentTab === 'species' ? speciesData : envData;

            Object.keys(dataObj).forEach(key => {
                const item = dataObj[key];
                let isUnlocked = (currentTab === 'species') ? gameState.unlockedSpecies.includes(key) : gameState.unlockedItems.includes(key);
                let isEquipped = (currentTab === 'species') ? gameState.currentSpecies === key : gameState.currentEnv === key;

                const card = document.createElement('div');
                card.className = `item-card ${isEquipped ? 'equipped' : ''}`;
                card.onclick = () => handlePurchase(key, item, currentTab);
                
                let btnText = isUnlocked ? (isEquipped ? t.equip : t.owned) : item.cost;
                let previewStyle = currentTab === 'species' 
                    ? `background:${item.body}; border: 3px solid ${item.outline}`
                    : `background: ${item.bg}; border: 3px solid #cbd5e1`;

                card.innerHTML = `
                    <div class="item-color-preview" style="${previewStyle}"></div>
                    <div class="item-name">${item.name[currLang]}</div>
                    <div class="item-cost ${isUnlocked ? 'owned' : ''}">${btnText}</div>
                `;
                grid.appendChild(card);
            });
        }

        function handlePurchase(key, item, type) {
            let isUnlocked = (type === 'species') ? gameState.unlockedSpecies.includes(key) : gameState.unlockedItems.includes(key);

            if (!isUnlocked) {
                if (gameState.points >= item.cost) {
                    gameState.points -= item.cost;
                    if (type === 'species') gameState.unlockedSpecies.push(key);
                    else gameState.unlockedItems.push(key);
                } else { return; }
            }

            if (type === 'species') gameState.currentSpecies = key;
            else gameState.currentEnv = key;

            applySlugStyles();
            applyEnv();
            saveGame();
            renderShop();
            updateUI();
        }

        function applySlugStyles() {
            const spec = speciesData[gameState.currentSpecies];
            if(!spec) return;

            const root = document.documentElement;
            root.style.setProperty('--c-body', spec.body);
            root.style.setProperty('--c-outline', spec.outline);
            root.style.setProperty('--c-ear-top', spec.earTop);
            root.style.setProperty('--c-tail', spec.tail);
            root.style.setProperty('--c-spot', spec.spot);
            root.style.setProperty('--c-blush', spec.blush);
        }

        function applyEnv() {
            const env = envData[gameState.currentEnv];
            if(env) {
                document.getElementById('mainStage').style.background = env.bg;
            }
        }

        function interact(type, reward, cdSeconds) {
            if (gameState.cooldowns[type] > 0) return;

            gameState.points += reward;
            gameState.cooldowns[type] = cdSeconds;

            const slug = document.getElementById('slugContainer');
            slug.style.transform = 'translateY(15px) scale(1.1, 0.8)';
            setTimeout(() => {
                slug.style.transform = 'translateY(-10px) scale(0.95, 1.05)';
                setTimeout(() => { slug.style.transform = 'translateY(0) scale(1, 1)'; }, 250);
            }, 200);

            showFloatText(`+${reward}`);
            saveGame();
            updateUI();
        }

        function petSlugDirectly(e) {
            if (gameState.cooldowns['pet'] === 0) interact('pet', 50, 5);
        }

        function showFloatText(text) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = text;
            el.style.left = '50%';
            el.style.top = '30%';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function startCooldownTimer() {
            setInterval(() => {
                let needUpdate = false;
                ['feed', 'clean', 'pet'].forEach(type => {
                    if (gameState.cooldowns[type] > 0) {
                        gameState.cooldowns[type]--;
                        needUpdate = true;
                    }
                });
                if (needUpdate) updateUI();
            }, 1000);
        }

        function updateUI() {
            document.getElementById('pointDisplay').innerText = gameState.points;
            const t = i18n[currLang];
            const cds = gameState.cooldowns;
            
            ['feed', 'clean', 'pet'].forEach(type => {
                const btn = document.getElementById(`btn${type.charAt(0).toUpperCase() + type.slice(1)}`);
                const desc = document.getElementById(`txt${type.charAt(0).toUpperCase() + type.slice(1)}Desc`);
                
                if(cds[type] > 0) {
                    btn.disabled = true;
                    desc.innerText = `${t.cooldown} ${cds[type]}s`;
                } else {
                    btn.disabled = false;
                    desc.innerText = t.ready;
                }
            });
        }

        function saveGame() { localStorage.setItem('nudi_v7_save', JSON.stringify(gameState)); }
        function loadGame() {
            const saved = localStorage.getItem('nudi_v7_save');
            if (saved) { try { gameState = { ...gameState, ...JSON.parse(saved) }; } catch(e) {} }
        }
    </script>
</body>
</html>
