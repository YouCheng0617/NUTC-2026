<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海兔養成記</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-bg: #fff0f5; 
            --panel-bg: #ffffff;
            --card-bg: #fff9fa;
            --accent-color: #ffb6c1;
            --text-dark: #6b4c4a;
            --text-dim: #b89f9d;
            --border-color: #ffd1dc;
            --btn-hover: #ffedf0;
            --shadow-color: rgba(255, 182, 193, 0.4);
            
            --c-body: #ffffff;
            --c-outline: #3f2a2a;
            --c-ear-top: #3f2a2a;
            --c-tail: #3f2a2a;
            --c-spot: #3f2a2a;
            --c-blush: #fca5a5;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Nunito', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--primary-bg);
            color: var(--text-dark);
        }

        .top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }

        .points-display {
            background: #ffffff;
            padding: 8px 24px;
            border-radius: 30px;
            border: 3px solid var(--border-color);
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-dark);
            box-shadow: 0 4px 0 var(--border-color);
            backdrop-filter: blur(4px);
            font-size: 1.1rem;
        }

        .lang-btn {
            background: #ffffff;
            border: 3px solid var(--border-color);
            color: var(--text-dark);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.9rem;
            transition: 0.1s;
            box-shadow: 0 4px 0 var(--border-color);
        }
        
        .lang-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        .stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 58%;
            background: #dbeafe; 
            overflow: hidden;
            transition: background 1s ease;
        }

        .dot-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.7) 3px, transparent 3px);
            background-size: 35px 35px;
            opacity: 0.9;
            pointer-events: none;
            box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.5);
            z-index: 2;
            transition: opacity 0.5s;
        }

        .effect-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .rain-drop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: rgba(255, 255, 255, 0.7);
            top: -20px;
            animation: rainFall linear infinite;
        }
        @keyframes rainFall { to { transform: translateY(60vh); } }

        .bubble {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.2);
            bottom: -20px;
            animation: bubbleRise ease-in infinite;
        }
        @keyframes bubbleRise { to { transform: translateY(-60vh) scale(1.5); opacity: 0; } }

        /* 寶寶專屬：封印瀏覽器預設行為 */
        .slug-container {
            position: absolute !important;
            width: 340px !important;
            height: 240px !important;
            cursor: grab !important;
            z-index: 10 !important;
            touch-action: none !important;
            left: calc(50% - 170px);
            top: calc(50% - 120px);
            user-select: none !important;
            -webkit-user-select: none !important;
            -webkit-user-drag: none !important;
        }

        /* 終極鎖定狀態 */
        body.is-dragging-global, body.is-dragging-global * {
            cursor: grabbing !important;
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        /* 被撫摸時的開心擠壓動畫 */
        .slug-container.is-petting .slug-svg {
            transform: scale(1.06, 0.92) translateY(12px);
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.25));
        }

        .slug-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.15));
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2), filter 0.3s ease;
            pointer-events: none !important;
        }

        @keyframes earTwitchL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
        @keyframes earTwitchR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg); } }
        @keyframes tailFluff { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.05) rotate(3deg); } }

        .anim-earL { animation: earTwitchL 3s infinite ease-in-out; transform-origin: 100px 95px; }
        .anim-earR { animation: earTwitchR 3.5s infinite ease-in-out; transform-origin: 145px 90px; }
        .anim-tail { animation: tailFluff 4s infinite ease-in-out; transform-origin: 240px 120px; }

        .ui-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: var(--panel-bg);
            border-top: 3px solid white;
            display: flex;
            flex-direction: column;
            padding: 30px 20px 20px 20px;
            z-index: 20;
            border-radius: 40px 40px 0 0;
            box-shadow: 0 -10px 40px var(--shadow-color);
        }

        .interaction-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-interact {
            flex: 1;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 22px;
            padding: 16px 0;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.1s;
            box-shadow: 0 5px 0 var(--border-color);
        }

        .btn-interact:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 0px 0 transparent;
            background: var(--btn-hover);
        }

        .btn-interact:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #f1f5f9;
            border-color: #cbd5e1;
            box-shadow: 0 5px 0 #cbd5e1;
            color: #94a3b8;
        }

        .btn-title { font-size: 1.05rem; font-weight: 900; margin-bottom: 6px; }
        .btn-desc { font-size: 0.8rem; color: var(--text-dim); font-weight: 800;}

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 10px;
            padding-left: 5px;
        }

        .tab {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 15px;
            transition: 0.2s;
        }
        
        .tab:hover { background: var(--btn-hover); }
        
        .tab.active { 
            color: white; 
            background: var(--text-dark);
            box-shadow: 0 3px 10px rgba(107, 76, 74, 0.2);
        }

        .shop-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            overflow-y: auto;
            padding: 5px 5px 20px 5px;
        }
        .shop-grid::-webkit-scrollbar { width: 0; }

        .item-card {
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 22px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 0 var(--border-color);
        }
        
        .item-card:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }
        
        .item-card.equipped { 
            border-color: var(--text-dark); 
            background: #ffffff; 
            box-shadow: 0 4px 0 var(--text-dark);
        }
        
        .item-color-preview {
            width: 45px;
            height: 45px;
            border-radius: 15px;
            margin: 0 auto 15px auto;
            border: 3px solid rgba(0,0,0,0.08);
        }
        .item-name { font-size: 0.85rem; font-weight: 900; margin-bottom: 10px; color: var(--text-dark); line-height: 1.3;}
        .item-cost { 
            font-size: 0.9rem; 
            font-weight: 900; 
            color: white; 
            background: var(--accent-color);
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
            margin: 0 auto;
        }
        .item-cost.owned { 
            background: #e2e8f0;
            color: var(--text-dim);
        }
        .item-card.equipped .item-cost.owned {
            background: var(--text-dark);
            color: white;
        }

        .gacha-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 240, 245, 0.95);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .gacha-box {
            width: 160px;
            height: 160px;
            background: white;
            border: 5px dashed var(--accent-color);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 40px;
            transition: 0.2s;
            color: var(--accent-color);
            font-size: 1.4rem;
            font-weight: 900;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.3);
            animation: breatheBox 2s infinite ease-in-out;
        }
        
        @keyframes breatheBox {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .gacha-box:active { transform: scale(0.95); animation: none; }

        .gacha-title {
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: 900;
            color: var(--text-dark);
            text-shadow: 0 4px 10px rgba(255,255,255,0.8);
        }

        .start-btn {
            background: var(--text-dark);
            color: white;
            border: none;
            padding: 16px 50px;
            border-radius: 35px;
            font-weight: 900;
            font-size: 1.3rem;
            cursor: pointer;
            display: none;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            transition: 0.1s;
        }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }

        .float-text {
            position: absolute;
            color: var(--accent-color);
            font-weight: 900;
            font-size: 2rem;
            pointer-events: none;
            text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white;
            animation: floatUp 1s forwards cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 100;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); }
            50% { transform: translate(-50%, -50px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -90px) scale(1); }
        }

        /* 寵物名字標籤（極簡純文字版 - 清晰立體優化） */
        .pet-name-tag {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: none;
            padding: 0;
            font-weight: 900;
            color: var(--text-dark); /* 保持原本可愛的深咖啡色 */
            font-size: 1.35rem; /* 字體稍微放大一點點，更清楚 */
            letter-spacing: 2px;
            
            /* 捨棄會吃掉字體顏色的描邊，改用 8 個方向的實心白邊，加上底下淡淡的黑影，絕對清晰！ */
            text-shadow: 
                2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff,
                0px 2px 0 #fff,  0px -2px 0 #fff, 2px  0px 0 #fff, -2px 0px 0 #fff,
                0px 5px 10px rgba(0,0,0,0.2);
            
            white-space: nowrap;
            pointer-events: auto; 
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 20;
        }

        /* 命名後的鎖定狀態 */
        .pet-name-tag.named {
            cursor: default;
            pointer-events: none;
        }

        /* 還沒命名時的 Hover 動畫 */
        .pet-name-tag:hover:not(.named) {
            transform: translateX(-50%) scale(1.1);
            text-shadow: 
                2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff,
                0px 2px 0 #fff,  0px -2px 0 #fff, 2px  0px 0 #fff, -2px 0px 0 #fff,
                0px 6px 15px rgba(255, 182, 193, 0.8);
        }
        .pet-name-tag:active:not(.named) {
            transform: translateX(-50%) scale(0.95);
        }

        /* 超可愛命名彈窗 */
        .name-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 240, 245, 0.8);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .name-modal {
            background: #fff;
            width: 85%;
            max-width: 340px;
            border-radius: 35px;
            border: 4px solid var(--border-color);
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(255, 182, 193, 0.4);
            animation: popIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        @keyframes popIn {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .name-input {
            width: 100%;
            padding: 14px 15px;
            border: 3px solid var(--border-color);
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-dark);
            margin: 15px 0 20px 0;
            text-align: center;
            outline: none;
            transition: 0.2s;
            background: var(--card-bg);
        }
        .name-input:focus {
            border-color: var(--accent-color);
            background: #fff;
        }
        .modal-btns { display: flex; gap: 12px; justify-content: center; }
        .modal-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-cancel { background: #f1f5f9; color: var(--text-dim); }
        .btn-confirm { background: var(--text-dark); color: white; box-shadow: 0 5px 0 rgba(0,0,0,0.15); }
        .btn-confirm:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
        .btn-random {
            background: var(--accent-color);
            color: white;
            margin-bottom: 5px;
            width: 100%;
            box-shadow: 0 5px 0 rgba(255, 182, 193, 0.8);
        }
        .btn-random:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
    </style>
</head>
<body>
    <!-- 命名彈窗 -->
    <div class="name-modal-overlay" id="nameModalOverlay">
        <div class="name-modal">
            <h2 style="margin-top:0; margin-bottom: 10px; font-weight:900; font-size:1.5rem; color: var(--text-dark);" id="txtModalTitle">為寶寶取個名字</h2>
            <button class="modal-btn btn-random" onclick="generateRandomName()" id="btnRandomName">🎲 幫我隨機想一個</button>
            <input type="text" class="name-input" id="petNameInput" maxlength="12" placeholder="輸入可愛的名字...">
            <div class="modal-btns">
                <button class="modal-btn btn-cancel" onclick="closeNameModal()" id="btnCancelName">取消</button>
                <button class="modal-btn btn-confirm" onclick="confirmName()" id="btnConfirmName">確定</button>
            </div>
        </div>
    </div>
    <!-- 試用倒數計時器 -->
<div id="trialTimerDisplay" style="display:none; position: absolute; top: 15%; left: 50%; transform: translateX(-50%); font-size: 1.2rem; font-weight: 900; color: var(--text-dark); background: rgba(255, 255, 255, 0.85); border: 3px solid var(--accent-color); padding: 8px 24px; border-radius: 30px; box-shadow: 0 5px 15px var(--shadow-color); backdrop-filter: blur(4px); z-index: 100; pointer-events: none;">
    ⏱️ 試用中 <span id="trialCountdownNum" style="color: var(--accent-color); font-size: 1.4rem;">10</span>s
</div>
    <div class="gacha-overlay" id="gachaScreen">
        <div class="gacha-title" id="gachaTitle">發現神祕海兔卵</div>
        <div class="gacha-box" id="gachaBox" onclick="rollGacha()">點擊孵化</div>
        <button class="start-btn" id="startBtn" onclick="startGame()">開始照顧</button>
    </div>

    <!-- 導覽列 -->
    <div class="top-bar">
        <button class="lang-btn" onclick="location.href='games.html'" id="btnBack">🏠 返回</button>
        <div class="points-display"><span id="txtPts">積分</span>: <span id="pointDisplay">0</span></div>
        <button class="lang-btn" onclick="toggleLang()" id="btnLang">EN</button>
    </div>

    <div class="stage" id="mainStage">
        <div class="dot-pattern" id="dotPattern"></div>
        <div id="effectLayer" class="effect-layer"></div>
        
        <div class="slug-container" id="slugContainer">
            <div class="pet-name-tag" id="petNameTag" onclick="openNameModal()">
                <span id="displayPetName">神祕海兔</span> <span id="pencilIcon">✏️</span>
            </div>
            <!-- 🌟 終極防護罩 -->
            <div style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; cursor: inherit; background: rgba(0,0,0,0);"></div>
            
            <svg class="slug-svg" viewBox="0 0 340 240" style="position: relative; z-index: 1;">
                <defs>
                    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="var(--c-ear-top)" />
                        <stop offset="60%" stop-color="var(--c-ear-top)" />
                        <stop offset="100%" stop-color="var(--c-body)" />
                    </linearGradient>
                    <filter id="handDrawn" x="-10%" y="-10%" width="120%" height="120%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
                    </filter>
                </defs>

                <g filter="url(#handDrawn)">
                    <ellipse cx="170" cy="205" rx="120" ry="15" fill="rgba(0,0,0,0.12)" />

                    <g class="anim-tail" stroke="var(--c-outline)" stroke-width="4" stroke-linejoin="round">
                        <path d="M 250 170 C 270 180, 300 190, 290 140 C 280 100, 250 140, 240 170 Z" fill="var(--c-tail)"/>
                        <path d="M 260 150 C 290 160, 320 120, 280 80 C 260 60, 230 110, 250 150 Z" fill="var(--c-tail)"/>
                        <path d="M 240 130 C 260 100, 270 70, 240 50 C 210 30, 200 90, 230 120 Z" fill="var(--c-tail)"/>
                    </g>

                    <path d="M 70 190 C 20 180, 30 120, 90 110 C 160 100, 220 105, 260 130 C 290 150, 280 200, 200 210 C 130 220, 90 200, 70 190 Z" fill="var(--c-body)" stroke="var(--c-outline)" stroke-width="5" stroke-linejoin="round"/>

                    <g fill="var(--c-spot)">
                        <circle cx="90" cy="135" r="4"/>
                        <circle cx="125" cy="125" r="5"/>
                        <circle cx="170" cy="130" r="3.5"/>
                        <circle cx="210" cy="140" r="5.5"/>
                        <circle cx="245" cy="155" r="4"/>
                        
                        <circle cx="75" cy="160" r="4.5"/>
                        <circle cx="110" cy="165" r="3"/>
                        <circle cx="145" cy="180" r="5.5"/>
                        <circle cx="190" cy="185" r="4"/>
                        <circle cx="230" cy="175" r="4.5"/>
                        
                        <circle cx="100" cy="190" r="4"/>
                        <circle cx="160" cy="200" r="4.5"/>
                        <circle cx="205" cy="195" r="3.5"/>
                    </g>

                    <g stroke="var(--c-outline)" stroke-width="4" stroke-linejoin="round">
                        <path class="anim-earL" d="M 100 105 C 80 50, 95 20, 110 25 C 125 30, 120 90, 115 105 Z" fill="url(#earGrad)"/>
                        <path class="anim-earR" d="M 145 100 C 135 45, 160 15, 175 25 C 190 35, 165 85, 160 100 Z" fill="url(#earGrad)"/>
                    </g>

                    <g transform="translate(130, 150)">
                        <ellipse cx="-35" cy="12" rx="14" ry="8" fill="var(--c-blush)" opacity="0.85"/>
                        <ellipse cx="35" cy="12" rx="14" ry="8" fill="var(--c-blush)" opacity="0.85"/>
                        
                        <circle cx="-20" cy="0" r="7" fill="#2c3e50" />
                        <circle cx="20" cy="0" r="7" fill="#2c3e50" />
                        
                        <circle cx="-18" cy="-2" r="2.5" fill="#ffffff" />
                        <circle cx="22" cy="-2" r="2.5" fill="#ffffff" />
                        
                        <path d="M -7 5 Q 0 12 7 5" fill="none" stroke="#2c3e50" stroke-width="3.5" stroke-linecap="round"/>
                    </g>
                </g>
            </svg>
            
        </div>
    </div>

    <div class="ui-panel">
        <div class="interaction-group">
            <button class="btn-interact" id="btnFeed" onclick="interact('feed', 80, 8)">
                <span class="btn-title" id="txtFeedTitle">餵食海藻</span>
                <span class="btn-desc" id="txtFeedDesc">冷卻 0s</span>
            </button>
            <button class="btn-interact" id="btnClean" onclick="interact('clean', 100, 15)">
                <span class="btn-title" id="txtCleanTitle">淨化水質</span>

        function switchTab(tab) {
            currentTab = tab;

            trialState = { species: null, bg: null, effect: null };
            if(trialTimer) clearTimeout(trialTimer);
            // 🌟 清除倒數並隱藏 UI
    if(trialInterval) clearInterval(trialInterval);
    document.getElementById('trialTimerDisplay').style.display = 'none';
            refreshAll(); 
            
            document.getElementById('tabSpecies').className = tab === 'species' ? 'tab active' : 'tab';
            document.getElementById('tabBg').className = tab === 'bg' ? 'tab active' : 'tab';
            document.getElementById('tabEffect').className = tab === 'effect' ? 'tab active' : 'tab';
        }

        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            const t = i18n[currLang];
            
            // 動態翻譯按鈕
            const txtTry = currLang === 'zh' ? '👀 試用' : 'Try';
            const txtBuy = currLang === 'zh' ? '💰 購買' : 'Buy';
            const txtCancel = currLang === 'zh' ? '❌ 取消' : 'Cancel';

            let dataObj, unlockedArr, currentActive, typeKey, currentTrial;
            if (currentTab === 'species') { dataObj = speciesData; unlockedArr = gameState.unlockedSpecies; currentActive = gameState.currentSpecies; typeKey = 'species'; currentTrial = trialState.species; }
            else if (currentTab === 'bg') { dataObj = bgData; unlockedArr = gameState.unlockedBgs; currentActive = gameState.currentBg; typeKey = 'bg'; currentTrial = trialState.bg; }
            else { dataObj = effectData; unlockedArr = gameState.unlockedEffects; currentActive = gameState.currentEffect; typeKey = 'effect'; currentTrial = trialState.effect; }

            Object.keys(dataObj).forEach(key => {
                const item = dataObj[key];
                let isUnlocked = unlockedArr.includes(key);
                let isEquipped = (currentActive === key) && !currentTrial; 
                let isTrialing = (currentTrial === key);

                const card = document.createElement('div');
                card.className = `item-card ${isEquipped || isTrialing ? 'equipped' : ''}`;
                
                let actionHTML = '';
                if (isUnlocked) {
                    let btnText = isEquipped ? t.equip : t.owned;
                    actionHTML = `<div class="item-cost owned">${btnText}</div>`;
                    card.onclick = () => equipItem(key, typeKey);
                } else if (isTrialing) {
                    actionHTML = `
                        <div style="display:flex; gap:6px; justify-content:center; margin-top:5px;">
                            <div class="item-cost" style="background:#4ade80; font-size:0.8rem; padding:4px 8px; cursor:pointer;" onclick="buyItem('${key}', '${typeKey}', ${item.cost}, event)">${txtBuy}</div>
                            <div class="item-cost" style="background:#ef4444; font-size:0.8rem; padding:4px 8px; cursor:pointer;" onclick="cancelTrial('${typeKey}', event)">${txtCancel}</div>
                        </div>
                    `;
                } else {
                    actionHTML = `<div class="item-cost"><span style="font-size:0.7rem;margin-right:4px;">${txtTry}</span>${item.cost}</div>`;
                    card.onclick = () => tryItem(key, typeKey);
                }
                
                let previewStyle = typeKey === 'species' 
                    ? `background:${item.body}; border: 3px solid ${item.outline}`
                    : `background: ${item.preview}; border: 3px solid #cbd5e1`;

                card.innerHTML = `
                    <div class="item-color-preview" style="${previewStyle}"></div>
                    <div class="item-name">${item.name[currLang]}</div>
                    ${actionHTML}
                `;
                grid.appendChild(card);
            });
        }

        function equipItem(key, type) {
            trialState[type] = null; 
            // 🌟 如果試用到一半直接購買/裝備，也要清除倒數
    if(trialInterval) clearInterval(trialInterval);
    document.getElementById('trialTimerDisplay').style.display = 'none';
            if (type === 'species') gameState.currentSpecies = key;
            else if (type === 'bg') gameState.currentBg = key;
            else gameState.currentEffect = key;
            refreshAll();
            saveGame();
        }

       function tryItem(key, type) {
    trialState[type] = key;
    refreshAll();
    
    // 清除舊的計時器
    if(trialTimer) clearTimeout(trialTimer);
    if(trialInterval) clearInterval(trialInterval);
    
    let timeLeft = 10;
    const timerDisplay = document.getElementById('trialTimerDisplay');
    const numDisplay = document.getElementById('trialCountdownNum');
    
    // 顯示倒數 UI
    timerDisplay.style.display = 'block';
    numDisplay.innerText = timeLeft;
    
    showFloatText('⏱️ 試用開始', 2000);
    
    // 每秒更新數字
    trialInterval = setInterval(() => {
        timeLeft--;
        numDisplay.innerText = timeLeft;
        
        // 時間到！結束試用
        if(timeLeft <= 0) {
            clearInterval(trialInterval);
            timerDisplay.style.display = 'none';
            
            if(trialState[type] === key) { 
                trialState[type] = null;
                refreshAll();
                showFloatText('✨ 試用結束，喜歡就帶回家吧！', 50000);
            }
        }
    }, 1000);
}

        function buyItem(key, type, cost, e) {
            if(e) e.stopPropagation(); 
            if (gameState.points >= cost) {
                gameState.points -= cost;
                if (type === 'species') gameState.unlockedSpecies.push(key);
                else if (type === 'bg') gameState.unlockedBgs.push(key);
                else gameState.unlockedEffects.push(key);
                
                equipItem(key, type); 
                showFloatText('✨ 購買成功 ✨', 5000);
            } else {
                showFloatText('積分不足 😢');
            }
        }

        function cancelTrial(type, e) {
            if(e) e.stopPropagation();
            trialState[type] = null;
            // 🌟 清除倒數並隱藏 UI
    if(trialInterval) clearInterval(trialInterval);
    document.getElementById('trialTimerDisplay').style.display = 'none';
            refreshAll();
        }

        function refreshAll() {
            applySlugStyles();
            applyBg();
            applyEffect();
            renderShop();
        }

        function applySlugStyles() {
            const spec = speciesData[trialState.species || gameState.currentSpecies];
            if(!spec) return;

            const root = document.documentElement;
            root.style.setProperty('--c-body', spec.body);
            root.style.setProperty('--c-outline', spec.outline);
            root.style.setProperty('--c-ear-top', spec.earTop);
            root.style.setProperty('--c-tail', spec.tail);
            root.style.setProperty('--c-spot', spec.spot);
            root.style.setProperty('--c-blush', spec.blush);
        }

        function applyBg() {
            const bg = bgData[trialState.bg || gameState.currentBg];
            if(bg) {
                document.getElementById('mainStage').style.background = bg.style;
                document.getElementById('dotPattern').style.opacity = bg.hasDots ? '0.9' : '0';
            }
        }

      function applyEffect() {
            const layer = document.getElementById('effectLayer');
            layer.innerHTML = ''; 
            const effectKey = trialState.effect || gameState.currentEffect;
            const effect = effectData[effectKey];
            
            if (!effect || effectKey === 'none') return;

            // 🌟 寶寶的「VIP 特效包廂」🌟
            // 根據不同的特效名字，進入不同的專屬製作區！
            switch (effectKey) {
                
                // ------------------------------------------------
                // 🌧️ 【綿綿細雨】專屬地盤 (極致朦朧升級版！)
                // ------------------------------------------------
                case 'rain':
                    // ✨ 數量再加碼到 100，因為模糊後的雨絲會交織成一片水霧！
                    for (let i = 0; i < 100; i++) { 
                        let el = document.createElement('div');
                        el.style.position = 'absolute';
                        el.style.left = Math.random() * 100 + '%';
                        el.style.top = '-60px'; 
                        
                        // 呼叫你的針狀雨絲
                        el.innerHTML = svgLib['drop']; 
                        
                        let size = Math.random() * 25 + 15;
                        el.style.width = size + 'px'; 
                        el.style.height = size + 'px';
                        
                        // 固定斜斜的 15 度，咻咻咻
                        el.style.transform = 'rotate(15deg)';
                        
                        // ✨ 朦朧感魔法：讓每一根雨絲有不同的模糊度與透明度！
                        let blurValue = Math.random() * 4; // 隨機加上 0 到 4 像素的模糊
                        el.style.filter = `blur(${blurValue}px)`;
                        
                        // 越模糊的雨絲（越遠的），透明度就越低，創造超逼真的空氣霧感
                        el.style.opacity = Math.random() * 0.4 + (1 - blurValue / 5) * 0.5; 
                        
                        // 速度與延遲
                        let duration = Math.random() * 1.5 + 0.8; 
                        el.style.animation = `rainFall ${duration}s linear infinite`;
                        el.style.animationDelay = (Math.random() * 3) + 's';
                        
                        layer.appendChild(el);
                    }
                    break;

// ------------------------------------------------
                // 🎆 【小番茄煙火】護眼護機流暢版 (智慧限制數量，拯救電腦)
                // ------------------------------------------------
                case 'tomato':
                    // 1. 清除所有的舊計時器與動畫
                    if (window.tomatoFwInterval) clearInterval(window.tomatoFwInterval);
                    if (window.tomatoFwTimeout) clearTimeout(window.tomatoFwTimeout);
                    if (window.tomatoAnimFrame) cancelAnimationFrame(window.tomatoAnimFrame);

                    let canvas = document.getElementById('tomatoCanvas');
                    if (!canvas) {
                        canvas = document.createElement('canvas');
                        canvas.id = 'tomatoCanvas';
                        canvas.style.position = 'absolute';
                        canvas.style.top = '0';
                        canvas.style.left = '0';
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                        canvas.style.pointerEvents = 'none'; 
                        canvas.style.zIndex = '999';
                        layer.appendChild(canvas);
                    }

                    const ctx = canvas.getContext('2d');
                    let particles = [];

                    function createFirework(startX, startY, scale) {
                        // 🌟 嚴格優化火花數量！用稍微大一點的粒子填補空間，減輕負擔
                        let redCount = Math.floor(300 * scale);
                        let greenCount = Math.floor(100 * scale);

                        // 🍅 紅色番茄本體
                        for (let i = 0; i < redCount; i++) {
                            let angle = Math.random() * Math.PI * 2;
                            let r = Math.random() > 0.6 ? 1.0 : Math.sqrt(Math.random()); 
                            
                            let targetX = Math.cos(angle) * r * 85 * scale; 
                            let targetY = Math.sin(angle) * r * 75 * scale; 
                            
                            let rand = Math.random();
                            let c = '#dc2626'; 
                            if (rand > 0.95) c = '#ffffff'; 
                            else if (rand > 0.4) c = '#ef4444'; 

                            particles.push({
                                startX: startX, startY: startY,
                                x: startX, y: startY,
                                tx: startX + targetX, ty: startY + targetY,
                                color: c,
                                alpha: 1,
                                // 🌟 粒子稍微放大一點點，彌補數量的減少，一樣飽滿！
                                baseSize: Math.max(1.5, (Math.random() * 2.5 + 2) * scale), 
                                progress: 0,
                                speed: Math.random() * 0.02 + 0.015 
                            });
                        }
                        
                        // 🌿 綠色立體蒂頭
                        for (let i = 0; i < greenCount; i++) {
                            let branch = i % 7; 
                            let t = Math.random();
                            let targetX, targetY;
                            let originY = -70 * scale; 

                            if (branch === 0) { targetX = t * 25 * scale; targetY = originY - t * 55 * scale; } 
                            else if (branch === 1) { targetX = -75 * t * scale; targetY = originY + 15 * t * scale; } 
                            else if (branch === 2) { targetX = -55 * t * scale; targetY = originY - 20 * t * scale; } 
                            else if (branch === 3) { targetX = -30 * t * scale; targetY = originY - 45 * t * scale; } 
                            else if (branch === 4) { targetX = 30 * t * scale; targetY = originY - 45 * t * scale; }  
                            else if (branch === 5) { targetX = 55 * t * scale; targetY = originY - 20 * t * scale; }  
                            else { targetX = 75 * t * scale; targetY = originY + 15 * t * scale; } 

                            targetX += (Math.random() - 0.5) * 6 * scale;
                            targetY += (Math.random() - 0.5) * 6 * scale;

                            let rand = Math.random();
                            let c = '#16a34a'; 
                            if (rand > 0.95) c = '#ffffff'; 
                            else if (rand > 0.4) c = '#22c55e'; 

                            particles.push({
                                startX: startX, startY: startY,
                                x: startX, y: startY,
                                tx: startX + targetX, ty: startY + targetY,
                                color: c,
                                alpha: 1,
                                baseSize: Math.max(1.5, (Math.random() * 3 + 2) * scale),
                                progress: 0,
                                speed: Math.random() * 0.02 + 0.015 
                            });
                        }
                    }

                    function render() {
                        if (gameState.currentEffect !== 'tomato' && trialState.effect !== 'tomato') {
                            if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
                            if (window.tomatoFwTimeout) clearTimeout(window.tomatoFwTimeout);
                            return;
                        }
                        
                        window.tomatoAnimFrame = requestAnimationFrame(render);
                        
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; 
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        ctx.globalCompositeOperation = 'source-over'; 
                        ctx.shadowBlur = 3; // 稍微降低光暈的運算負擔

                        for (let i = particles.length - 1; i >= 0; i--) {
                            let p = particles[i];
                            
                            p.progress += p.speed;
                            if (p.progress >= 1) p.progress = 1;
                            
                            let ease = 1 - Math.pow(1 - p.progress, 3);
                            
                            p.x = p.startX + (p.tx - p.startX) * ease;
                            p.y = p.startY + (p.ty - p.startY) * ease;
                            
                            if (p.progress >= 1) {
                                p.ty += 0.4; 
                                p.alpha -= 0.015; 
                            }

                            if (p.alpha <= 0) {
                                particles.splice(i, 1);
                                continue;
                            }

                            let twinkleSize = p.baseSize * (0.7 + Math.random() * 0.5);
                            let twinkleAlpha = p.alpha * (0.6 + Math.random() * 0.4);

                            ctx.beginPath();
                            ctx.arc(p.x, p.y, twinkleSize, 0, Math.PI * 2);
                            ctx.fillStyle = p.color;
                            ctx.shadowColor = p.color; 
                            ctx.globalAlpha = twinkleAlpha;
                            ctx.fill();
                        }
                    }

                    render();

                    function randomLaunch() {
                        if (gameState.currentEffect !== 'tomato' && trialState.effect !== 'tomato') return;
                        
                        // 🌟 煞車系統：如果畫面上已經有超過 1000 顆火花在飛，就跳過這次發射，保護電腦！
                        if (particles.length < 1000) {
                            canvas.width = canvas.offsetWidth;
                            canvas.height = canvas.offsetHeight;
                            
                            let targetX = canvas.width * (0.1 + Math.random() * 0.8);
                            let targetY = canvas.height * (0.1 + Math.random() * 0.65);
                            
                            let scale = 0.25 + Math.random() * 0.45;
                            createFirework(targetX, targetY, scale);
                        }

                        // 🌟 放慢發射間隔時間，讓電腦有時間喘氣 (1.2秒 到 2.5秒 之間)
                        let nextLaunchTime = 1200 + Math.random() * 1300;
                        window.tomatoFwTimeout = setTimeout(randomLaunch, nextLaunchTime);
                    }
                    
                    randomLaunch();
                    // 第一波稍微給點層次感，延遲0.8秒發射第二顆
                    setTimeout(randomLaunch, 800); 
                    break;
                // ------------------------------------------------
                // 🛠️ 其他還沒改到的特效，先用這個「通用備用方案」頂著
                // ------------------------------------------------
                default:
                    let count = effect.count || 15;
                    for (let i = 0; i < count; i++) {
                        let el = document.createElement('div');
                        el.style.position = 'absolute';
                        el.style.left = Math.random() * 100 + '%';
                        el.style.opacity = Math.random() * 0.5 + 0.5;
                        
                        let svgItem = effect.svg[Math.floor(Math.random() * effect.svg.length)];
                        let rawSVG = svgLib[svgItem.s] || svgLib['circle']; 
                        el.innerHTML = rawSVG;
                        if (svgItem.c) el.style.color = svgItem.c; 
                        
                        let size = Math.random() * 30 + 30;
                        el.style.width = size + 'px';
                        el.style.height = size + 'px';
                        
                        if (effect.dir === 'up') {
                            el.style.bottom = '-60px';
                            el.style.animation = `bubbleRise ${Math.random() * 3 + 3}s ease-in infinite`;
                        } else {
                            el.style.top = '-60px';
                            el.style.animation = `rainFall ${Math.random() * 3 + 3}s linear infinite`;
                        }
                        el.style.animationDelay = (Math.random() * 2) + 's';
                        layer.appendChild(el);
                    }
                    break;
            }
        }
        
        function interact(type, reward, cdSeconds) {
            if (gameState.cooldowns[type] > 0) return;

            gameState.points += reward;
            gameState.cooldowns[type] = cdSeconds;

            showFloatText(`+${reward}`);
            saveGame();
            updateUI();
        }

function showFloatText(text, duration = 1000) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.innerText = text;
    el.style.left = '50%';
    el.style.top = '30%';
    
    // 這裡的 duration 終於有主人了！
    el.style.animation = `floatUp ${duration / 1000}s forwards cubic-bezier(0.18, 0.89, 0.32, 1.28)`;
    
    document.body.appendChild(el);
    
    // 這裡原本的 1000 也要改成 duration，這樣文字才會乖乖停留！
    setTimeout(() => el.remove(), duration);
}

        function startCooldownTimer() {
            setInterval(() => {
                let needUpdate = false;
                ['feed', 'clean', 'pet'].forEach(type => {
                    if (gameState.cooldowns[type] > 0) {
                        gameState.cooldowns[type]--;
                        needUpdate = true;
                    }
                });
                if (needUpdate) updateUI();
            }, 1000);
        }

        function saveGame() { localStorage.setItem('nudi_v9_save', JSON.stringify(gameState)); }
        
        function loadGame() {
            const saved = localStorage.getItem('nudi_v9_save');
            if (saved) { 
                try { 
                    let parsed = JSON.parse(saved);
                    if(parsed.currentEnv) {
                        parsed.currentBg = 'sky';
                        parsed.currentEffect = 'none';
                        parsed.unlockedBgs = ['sky'];
                        parsed.unlockedEffects = ['none'];
                        delete parsed.currentEnv;
                        delete parsed.unlockedItems;
                    }
                    gameState = { ...gameState, ...parsed }; 
                } catch(e) {} 
            }
        }
        
        function updateUI() {
            const t = i18n[currLang];
            document.getElementById('pointDisplay').innerText = gameState.points;
            
            ['feed', 'clean', 'pet'].forEach(type => {
                const capitalizedType = type.charAt(0).toUpperCase() + type.slice(1);
                const btn = document.getElementById('btn' + capitalizedType);
                const desc = document.getElementById('txt' + capitalizedType + 'Desc');
                
                if (gameState.cooldowns[type] > 0) {
                    btn.disabled = true; 
                    desc.innerText = `${t.cooldown} ${gameState.cooldowns[type]}s`;
                } else {
                    btn.disabled = false; 
                    desc.innerText = t.ready;
                }
            });
        }

        function initDragAndPetSystem() {
            const slugEl = document.getElementById('slugContainer');
            const stageEl = document.getElementById('mainStage');
            
            let isDragging = false;
            let moved = false;
            let startX = 0, startY = 0;
            let slugStartLeft = 0, slugStartTop = 0;
            let petTimer = null;

            slugEl.oncontextmenu = (e) => { e.preventDefault(); return false; };
            slugEl.ondragstart = (e) => { e.preventDefault(); return false; };

            function getPos(e) {
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            }

            function onStart(e) {
                if (e.type === 'mousedown' && e.button !== 0) return;
                
                isDragging = true;
                moved = false;
                document.body.classList.add('is-dragging-global');

                const pos = getPos(e);
                startX = pos.x;
                startY = pos.y;

                const style = window.getComputedStyle(slugEl);
                slugStartLeft = parseFloat(style.left) || (stageEl.clientWidth / 2 - 170);
                slugStartTop = parseFloat(style.top) || (stageEl.clientHeight / 2 - 120);
                
                slugEl.classList.add('is-petting');
                spawnMiniHeart(pos.x, pos.y);
            }

            function onMove(e) {
                if (!isDragging) return; 

                if (e.cancelable) e.preventDefault(); 

                const pos = getPos(e);
                const dx = pos.x - startX;
                const dy = pos.y - startY;

                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;

                if (moved && Math.random() < 0.08) spawnMiniHeart(pos.x, pos.y);

                let newLeft = slugStartLeft + dx;
                let newTop = slugStartTop + dy;

                const stageRect = stageEl.getBoundingClientRect();
                const slugRect = slugEl.getBoundingClientRect();

                newLeft = Math.max(0, Math.min(newLeft, stageRect.width - slugRect.width));
                newTop = Math.max(0, Math.min(newTop, stageRect.height - slugRect.height));

                slugEl.style.left = newLeft + 'px';
                slugEl.style.top = newTop + 'px';
            }

            function onEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                document.body.classList.remove('is-dragging-global');
                slugEl.classList.remove('is-petting');

                if (!moved && gameState.cooldowns['pet'] === 0) {
                    interact('pet', 50, 5);
                }
            }

            function onHover(e) {
                if (!isDragging && e.type === 'mousemove') {
                    slugEl.classList.add('is-petting');
                    if (Math.random() < 0.05) spawnMiniHeart(e.clientX, e.clientY);
                    clearTimeout(petTimer);
                    petTimer = setTimeout(() => slugEl.classList.remove('is-petting'), 300);
                }
            }

            slugEl.addEventListener('mousedown', onStart, { passive: false });
            slugEl.addEventListener('touchstart', onStart, { passive: false });
            slugEl.addEventListener('mousemove', onHover);

            document.addEventListener('mousemove', onMove, { passive: false });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchend', onEnd);
            document.addEventListener('touchcancel', onEnd);
            
            function spawnMiniHeart(x, y) {
                const el = document.createElement('div');
                el.innerHTML = svgLib.heart;
                el.style.width = '30px';
                el.style.height = '30px';
                el.style.position = 'fixed';
                el.style.left = (x - 15 + Math.random() * 20) + 'px';
                el.style.top = (y - 30) + 'px';
                el.style.pointerEvents = 'none';
                el.style.animation = 'floatUp 1s ease-out forwards';
                el.style.zIndex = '1000';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            }
        }
    </script>
