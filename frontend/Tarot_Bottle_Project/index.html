<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日塔羅瓶 - 心情漂流瓶</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 左上角語言切換按鈕 -->
    <button id="lang-toggle-btn" onclick="toggleLanguage()">🌐 English</button>
    <!-- 右上角收藏按鈕 -->
    <button id="view-fav-btn" onclick="showFavorites()">📖 魔法收藏本</button>

    <div class="container">
        <h1 class="main-title">🔮 今日塔羅瓶</h1>
        
        <div id="topic-selection">
            <p class="subtitle">請靜下心來，選擇你今日想探索的塔羅指引...</p>
            <div class="topic-grid">
                <button onclick="startGame('感情')"><span class="icon">💕</span> 感情<br><small>Relationship</small></button>
                <button onclick="startGame('事業')"><span class="icon">💼</span> 事業<br><small>Career</small></button>
                <button onclick="startGame('學業')"><span class="icon">🎓</span> 學業<br><small>Education</small></button>
                <button onclick="startGame('成長')"><span class="icon">🌱</span> 成長<br><small>Growth</small></button>
                <button onclick="startGame('財運')"><span class="icon">💎</span> 財運<br><small>Wealth</small></button>
                <button onclick="startGame('人際')"><span class="icon">🤝</span> 人際<br><small>Community</small></button>
            </div>
            <div class="custom-topic">
                <input type="text" id="custom-topic-input" placeholder="其他... 請輸入你想問的問題">
                <button onclick="startCustomGame()">開始占卜</button>
            </div>
        </div>

        <div id="tarot-area" class="hidden">
            <p id="current-topic-display" class="topic-display"></p>
            <p class="instruction-text">請從下方的扇形牌陣中，憑直覺抽出 <span style="color:#d4b5ff; font-size:1.3em;">3</span> 張牌</p>
            
            <!-- 塔羅牌專屬占卜墊 -->
            <div class="tarot-mat">
                <!-- 扇形展開牌陣區 -->
                <div id="deck-spread" class="deck-spread"></div>
                
                <!-- 三張牌的放置區 (由左至右：過去、現在、未來) -->
                <div class="tarot-container">
                    <div class="tarot-card empty-slot" id="card-past">
                        <div class="card-inner">
                            <div class="card-back"><img src="images/card-back.png" alt="牌背"></div>
                            <div class="card-front" id="front-past">
                                <img id="img-past" src="" alt="">
                                <span id="text-past" class="card-name-label"></span>
                            </div>
                        </div>
                        <p class="card-title">【過去】</p>
                    </div>
                    
                    <div class="tarot-card empty-slot" id="card-present">
                        <div class="card-inner">
                            <div class="card-back"><img src="images/card-back.png" alt="牌背"></div>
                            <div class="card-front" id="front-present">
                                 <img id="img-present" src="" alt="">
                                 <span id="text-present" class="card-name-label"></span>
                            </div>
                        </div>
                        <p class="card-title">【現在】</p>
                    </div>
                    
                    <div class="tarot-card empty-slot" id="card-future">
                        <div class="card-inner">
                            <div class="card-back"><img src="images/card-back.png" alt="牌背"></div>
                            <div class="card-front" id="front-future">
                                 <img id="img-future" src="" alt="">
                                 <span id="text-future" class="card-name-label"></span>
                            </div>
                        </div>
                        <p class="card-title">【未來】</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="result-box" class="hidden">
            <h3 class="result-title">✨ 占卜結果 ✨</h3>
            <p id="ai-reading-result">命運的魔法陣正在啟動，請稍候...</p>
            <div class="action-buttons">
                <button id="restart-btn" class="hidden action-btn" onclick="resetGame()">✨ 再問一次</button>
                <button id="save-btn" class="hidden action-btn save-btn-style" onclick="saveCurrentReading()">💾 收藏此占卜</button>
            </div>
        </div>
    </div>

    <div id="favorites-modal" class="hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="hideFavorites()">&times;</span>
            <h2 id="fav-modal-title" style="color: #d4b5ff; margin-bottom: 20px;">📖 魔法收藏本</h2>
            <div id="favorites-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
