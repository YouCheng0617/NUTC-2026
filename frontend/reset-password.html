<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>重設密碼 - 心情漂流瓶</title>
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <div class="login-container">
    <img src="images/background.png" class="bg-img" alt="背景" />
    
    <div class="css-bubbles">
      <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    </div>

    <div class="cute-modal" style="display: flex; position: relative; z-index: 1000; background: transparent; backdrop-filter: none;">
      <div class="cute-modal-content">
        
        <form id="reset-page-form" class="auth-form bubble-layout" onsubmit="event.preventDefault(); submitNewPassword();" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
          
          <div class="bg-watermark" style="margin-top: -10px;">心情漂流瓶</div>
          <h2 style="color: #ffffff; margin-top: 20px; margin-bottom: 10px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);">設定新密碼</h2>
<p style="color: #ffffff; font-size: 0.95rem; text-align: center; font-weight: bold; margin-bottom: 25px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);">請輸入信件中的驗證碼與新密碼。</p>

          <div class="b-row" id="password-row" style="width: 100%;">
            <div class="b-item b-pill" style="width: 100%;">
              <label>新密碼 (New Password):</label>
              <div class="password-wrapper" style="width: 100%; position: relative;">
                <input type="password" id="new-password" required style="width: 100%; padding-right:35px !important; box-sizing: border-box;" />
                <span class="toggle-password" onclick="togglePassword('new-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666;">
                  <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
              </div>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="b-check-btn" title="確認並重設" style="margin-top: 25px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </form>

      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://api.drift-bottles.xyz/";

    // 🟢 核心魔法：從網址列抓取後端發送的 Token
    const urlParams = new URLSearchParams(window.location.search);
    const urlToken = urlParams.get("token");

    // 擋住亂闖入的訪客
    if (!urlToken) {
      document.getElementById("status-message").innerText = "⚠️ 找不到驗證碼，請確認您是從信箱的連結點擊進入的。";
      document.getElementById("status-message").style.color = "#ff4d4d";
      document.getElementById("password-row").style.display = "none";
      document.getElementById("submit-btn").style.display = "none";
    }

    function togglePassword(inputId, iconEl) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        iconEl.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      } else {
        input.type = "password";
        iconEl.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      }
    }

    async function submitNewPassword() {
      const newPassword = document.getElementById("new-password").value;

      if (newPassword.trim() === "") {
        alert("密碼不可為空！");
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: urlToken, newPassword: newPassword }),
        });

        if (response.ok) {
          alert("🎉 密碼重設成功！請使用新密碼重新登入。");
          window.location.href = "login.html"; // 成功後直接導回登入頁
        } else {
          const data = await response.json();
          alert("重設失敗：" + (data.message || "驗證連結可能已失效或過期，請重新發送信件。"));
        }
      } catch (error) {
        console.error("連線錯誤:", error);
        alert("無法連接到後端伺服器！");
      }
    }
  </script>
</body>
</html>
