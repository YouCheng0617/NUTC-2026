<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漂流指南 - 心情漂流瓶</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="images/icon-192.png" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<style>
  /* 版面：左邊章節清單（看過打勾），右邊上方截圖、旁邊白色說明卡；手機改成上方章節、中間截圖、下方說明 */
  :root {
    --sea-top: #1b8fd0;
    --sea-mid: #0d5f9c;
    --sea-deep: #083e6b;
    --glass: rgba(255, 255, 255, 0.14);
    --glass-line: rgba(255, 255, 255, 0.35);
    --ink: #123a5a;
    --ink-soft: #3d5a72;
    --brand: #0b5c94;
    --sun: #ffcf5c;
    --coral-a: #ffb84d;
    --coral-b: #ff8a5c;
    --done: #3bd38b;
    --font: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    color: #fff;
    background: linear-gradient(180deg, var(--sea-top) 0%, var(--sea-mid) 45%, var(--sea-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }
  /* 海面透下來的光 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(100deg, rgba(255, 255, 255, 0.08) 0 40px, transparent 40px 130px);
    -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%);
    mask-image: linear-gradient(180deg, #000, transparent 70%);
    pointer-events: none;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  /* 泡泡 */
  .bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .bubbles i {
    position: absolute; bottom: -80px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35);
    background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.05));
    animation: rise linear infinite;
  }
  @keyframes rise { to { transform: translateY(-115vh); } }

  /* 視窗 */
  .guide {
    position: relative;
    width: min(1220px, 100%);
    height: min(780px, 100%);
    display: grid;
    grid-template-columns: 270px minmax(0, 1fr);
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border: 1.5px solid var(--glass-line);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 30, 60, 0.35);
  }

  /* 左邊：品牌、兩大分類、章節清單 */
  .side {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 22px 16px;
    background: rgba(0, 40, 80, 0.22);
    border-right: 2px dashed rgba(255, 255, 255, 0.22);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0, 40, 80, 0.4); }
  .brand img { width: 34px; height: 34px; }
  .cats { display: flex; border-bottom: 2px solid rgba(255, 255, 255, 0.25); }
  .cats button {
    flex: 1; border: 0; background: none; color: rgba(255, 255, 255, 0.72);
    padding: 9px 0; font-weight: 800; font-size: 14.5px;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .cats button.on { color: #fff; border-color: var(--sun); }
  .chapters { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding-right: 2px; }
  .chapter {
    display: flex; align-items: center; gap: 10px;
    border: 0; background: none; text-align: left; color: #e5f3ff;
    padding: 10px 10px; border-radius: 12px; font-size: 14.5px; font-weight: 700;
    transition: background 0.15s;
  }
  .chapter:hover { background: rgba(255, 255, 255, 0.12); }
  .chapter .box {
    flex: none; width: 22px; height: 22px; border-radius: 7px;
    border: 2px solid rgba(255, 255, 255, 0.55);
    display: grid; place-items: center; font-size: 13px; font-weight: 900; color: #fff;
  }
  .chapter.done { color: rgba(229, 243, 255, 0.7); }
  .chapter.done .box { background: var(--done); border-color: var(--done); }
  .chapter.on { background: #fff; color: var(--brand); box-shadow: 0 6px 16px rgba(0, 40, 80, 0.25); }
  .chapter.on .box { border-color: var(--coral-a); }
  .chapter.on.done .box { background: var(--done); border-color: var(--done); }
  .side-note { margin-top: auto; font-size: 12.5px; color: rgba(255, 255, 255, 0.7); line-height: 1.6; }

  /* 右邊 */
  .main { min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: auto minmax(0, 1fr); gap: 16px 20px; padding: 20px 24px 22px; }
  .topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
  .crumb { font-size: 14px; color: rgba(255, 255, 255, 0.8); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumb b { color: #fff; }
  .spacer { flex: 1; }
  .pill-btn { border: 1.5px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.14); color: #fff; border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 800; white-space: nowrap; }
  .seg { display: flex; flex: none; }
  .seg button { border: 0; background: rgba(255, 255, 255, 0.16); color: #fff; padding: 6px 12px; font-size: 13px; font-weight: 800; white-space: nowrap; }
  .seg button:first-child { border-radius: 999px 0 0 999px; }
  .seg button:last-child { border-radius: 0 999px 999px 0; }
  .seg button.on { background: var(--sun); color: #5a3b00; }
  .close { flex: none; border: 0; background: rgba(255, 255, 255, 0.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; line-height: 1; }

  /* 截圖 */
  .stage { position: relative; min-height: 0; background: rgba(0, 40, 80, 0.28); border-radius: 20px; overflow: hidden; cursor: zoom-in; touch-action: pan-y; }
  .stage img {
    position: absolute; inset: 14px; width: calc(100% - 28px); height: calc(100% - 28px);
    object-fit: contain; border-radius: 10px;
    filter: drop-shadow(0 14px 26px rgba(0, 30, 60, 0.4));
    transition: opacity 0.18s;
  }
  .stage img.swap { opacity: 0; }
  .zoom-hint { position: absolute; right: 12px; bottom: 12px; background: rgba(0, 25, 50, 0.6); color: #fff; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; pointer-events: none; }

  /* 說明卡 */
  .note {
    min-height: 0; display: flex; flex-direction: column; gap: 12px;
    background: #fff; color: var(--ink); border-radius: 20px; padding: 22px;
    box-shadow: 0 14px 30px rgba(0, 30, 60, 0.25);
  }
  .step { font-size: 13px; font-weight: 900; letter-spacing: 0.08em; color: #e07a1f; }
  .note h2 { margin: 0; font-size: 25px; line-height: 1.3; color: #0b4f82; text-wrap: balance; }
  .desc { flex: 1; min-height: 0; overflow-y: auto; }
  .desc p { margin: 0; font-size: 15.5px; line-height: 1.85; color: var(--ink-soft); }
  .progress { display: flex; gap: 6px; }
  .progress i { flex: 1; height: 6px; border-radius: 9px; background: #d6e6f2; }
  .progress i.on { background: linear-gradient(90deg, var(--coral-a), var(--coral-b)); }
  .nav { display: flex; gap: 8px; }
  .nav button { flex: 1; border: 0; border-radius: 14px; padding: 12px 10px; font-weight: 800; font-size: 15px; }
  .nav .prev { flex: 0 0 auto; padding-inline: 16px; background: #eef5fb; color: #2b5d84; }
  .nav .prev:disabled { opacity: 0.4; cursor: default; }
  .nav .next { background: linear-gradient(135deg, var(--coral-a), var(--coral-b)); color: #fff; box-shadow: 0 6px 14px rgba(255, 138, 92, 0.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .keys { font-size: 12px; color: #8aa1b2; text-align: center; }

  /* 放大看圖 */
  .lightbox { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 20, 40, 0.88); cursor: zoom-out; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
  .lightbox-close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 18px; color: #fff; font-size: 38px; line-height: 1; }

  /* 平板：說明卡移到截圖下面 */
  @media (max-width: 1000px) {
    .guide { grid-template-columns: 220px minmax(0, 1fr); }
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
    .note { max-height: 42vh; }
  }

  /* 手機：上方章節（橫向捲動）、中間截圖、下方說明 */
  @media (max-width: 700px), (max-width: 1024px) and (orientation: portrait) {
    body { padding: 0; }
    .guide { width: 100%; height: 100%; border-radius: 0; border: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .side { padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 8px; gap: 8px; border-right: 0; border-bottom: 2px dashed rgba(255, 255, 255, 0.22); }
    .side-head { display: flex; align-items: center; gap: 8px; }
    .brand { font-size: 18px; }
    .brand img { width: 28px; height: 28px; }
    .cats button { font-size: 13.5px; padding: 6px 0; }
    .chapters { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; scrollbar-width: none; }
    .chapters::-webkit-scrollbar { display: none; }
    .chapter { flex: none; white-space: nowrap; padding: 7px 10px; font-size: 13px; gap: 7px; }
    .chapter .box { width: 18px; height: 18px; border-radius: 6px; font-size: 11px; }
    .side-note { display: none; }
    .main { padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); gap: 10px; grid-template-rows: auto minmax(0, 1fr) auto; }
    .topbar { gap: 6px; }
    .crumb { display: none; }
    .seg button { padding: 5px 10px; font-size: 12px; }
    .pill-btn { padding: 5px 10px; font-size: 12px; }
    .close { width: 32px; height: 32px; font-size: 16px; }
    .stage { min-height: 200px; border-radius: 16px; }
    .stage img { inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); }
    .note { max-height: none; padding: 14px 16px; gap: 8px; border-radius: 16px; }
    .note h2 { font-size: 19px; }
    .desc { max-height: 26vh; }
    .desc p { font-size: 14px; line-height: 1.65; }
    .nav button { padding: 10px; font-size: 14px; }
    .keys { display: none; }
  }
  /* 手機上把「漂流指南」和關閉、切換按鈕放同一排 */
  .side-head .close-m { display: none; }
  @media (max-width: 700px), (max-width: 1024px) and (orientation: portrait) {
    .side-head .close-m { display: block; }
    .topbar .close { display: none; }
    .side-head .spacer { flex: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bubbles i { animation: none; display: none; }
    .stage img { transition: none; }
  }
</style>
</head>

    <section class="note" aria-live="polite">

</div>

            { img: "./images/notes_write.webp", mobileImg: "./images/m_notes_write.webp", subtitle: "Just Let It Out", desc: "Tap 'Post a note' at the bottom right. Up to 50 characters, one note per person per day, and no edits after posting." }
          ]
        },
        {
          title: "Bottle Shooting",
          slides: [
            { img: "./images/shooting_menu.webp", mobileImg: "./images/m_shooting_menu.webp", subtitle: "Sniper Challenge", desc: "Test your reflexes on Easy, Normal or Hard. Hits in a row build a combo, misses break it, and running out of ammo ends the mission early." },
            { img: "./images/shooting_game.webp", mobileImg: "./images/m_shooting_game.webp", subtitle: "Power-ups", desc: "Shoot the bottles for points! Hitting a fish costs 20 points and breaks your combo. A glowing shell refills ammo, and a glowing hourglass adds time." }
          ]
        },
        {
          title: "Catch the Bottle",
          slides: [
            { img: "./images/catch_menu.webp", mobileImg: "./images/m_catch_menu.webp", subtitle: "Catch Challenge", desc: "Move the basket to catch falling bottles in 30 seconds — +10 points each. Three difficulties and a leaderboard!" },
            { img: "./images/catch_game.webp", mobileImg: "./images/m_catch_game.webp", subtitle: "Dodge & Shield", desc: "Watch out for sea mines: −15 points! A Double Star doubles your points for 3 seconds, and an Ocean Shield blocks one mine within 3 seconds." }
          ]
        }
      ]
    }
  };
  let currentLang = 'zh';
  let currentDeviceMode = window.matchMedia('(max-width: 700px)').matches ? 'mobile' : 'desktop';
  let currentCategory = 'main';
  let currentSubIndex = 0;
  let currentSlideIndex = 0;
  let shownSrc = '';   // 目前這頁要顯示的截圖（換圖時有淡入，放大要用這張，不是還沒換掉的舊圖）

  // 看完的章節（看到該章最後一頁）記在這台裝置上；讀不到也沒關係，只是不會打勾
  const DONE_KEY = 'tutorialDoneChapters';
  let doneSet = new Set();
  try { doneSet = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]')); } catch (e) {}
  const chapterKey = (cat, i) => cat + ':' + i;
  function markDone() {
    const slides = tutorialData[currentLang][currentCategory][currentSubIndex].slides;
    if (currentSlideIndex !== slides.length - 1) return;
    const k = chapterKey(currentCategory, currentSubIndex);
    if (doneSet.has(k)) return;
    doneSet.add(k);
    try { localStorage.setItem(DONE_KEY, JSON.stringify([...doneSet])); } catch (e) {}
  }

  // 記下這個帳號在這個瀏覽器看過教學了，登入時就不會再自動帶來這裡
  try { const u = JSON.parse(localStorage.getItem('currentUser') || '{}'); if (u.email) localStorage.setItem('tutorialSeen:' + u.email, '1'); } catch (e) {}

  const goLobby = () => { window.location.href = 'index.html'; };
  $('closeGuideBtn').onclick = goLobby;
  $('closeGuideBtnM').onclick = goLobby;

  function renderStatic() {
    const t = uiTexts[currentLang];
    document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-TW';
    $('brandText').textContent = t.brand;
    $('btnDesktop').textContent = t.desktop;
    $('btnMobile').textContent = t.mobile;
    $('zoomHint').textContent = t.zoom;
    $('langToggle').textContent = t.lang;
    $('tabMain').textContent = t.main;
    $('tabPark').textContent = t.park;
    $('sideNote').textContent = t.sideNote;
    $('keysHint').textContent = t.keys;
    stage.setAttribute('aria-label', t.zoomAria);
    ['closeGuideBtn', 'closeGuideBtnM'].forEach((id) => $(id).setAttribute('aria-label', t.close));
    document.querySelectorAll('.cats button').forEach((b) => {
      const on = b.dataset.category === currentCategory;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('.seg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === currentDeviceMode));
  }

  function renderSubMenu() {
    chapterList.innerHTML = '';
    tutorialData[currentLang][currentCategory].forEach((item, index) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const done = doneSet.has(chapterKey(currentCategory, index));
      btn.className = 'chapter' + (index === currentSubIndex ? ' on' : '') + (done ? ' done' : '');
      if (index === currentSubIndex) btn.setAttribute('aria-current', 'step');
      const box = document.createElement('span');
      box.className = 'box';
      box.textContent = done ? '✓' : '';
      btn.appendChild(box);
      btn.appendChild(document.createTextNode(item.title));
      btn.onclick = () => { currentSubIndex = index; currentSlideIndex = 0; render(); };
      chapterList.appendChild(btn);
    });
    // 手機的章節是橫向一排：把目前這章捲到看得到的地方
    const on = chapterList.querySelector('.chapter.on');
    if (on && chapterList.scrollWidth > chapterList.clientWidth) {
      chapterList.scrollTo({ left: on.offsetLeft - 12, behavior: 'smooth' });
    }
  }

  function renderSlide() {
    const t = uiTexts[currentLang];
    const chapters = tutorialData[currentLang][currentCategory];
    const chapter = chapters[currentSubIndex];
    const slides = chapter.slides;
    const s = slides[currentSlideIndex];
    const src = currentDeviceMode === 'mobile' ? s.mobileImg : s.img;
    shownSrc = src;
    if (!displayImage.src.endsWith(src.replace('./', ''))) {
      displayImage.classList.add('swap');
      const next = new Image();
      // 快速連翻時，比較晚載完的舊圖不能蓋掉目前這頁的圖
      next.onload = next.onerror = () => { if (src !== shownSrc) return; displayImage.src = src; displayImage.classList.remove('swap'); };
      next.src = src;
    }
    displayImage.alt = s.subtitle;
    $('displayTitle').textContent = s.subtitle;
    $('displayDesc').textContent = s.desc;
    $('stepText').textContent = t.step(currentSlideIndex + 1, slides.length);
    $('crumb').innerHTML = '';
    $('crumb').append(document.createTextNode((currentCategory === 'main' ? t.main : t.park).replace(/^\S+\s/, '') + ' › '));
    const b = document.createElement('b'); b.textContent = chapter.title; $('crumb').append(b);
    $('progress').innerHTML = slides.map((_, i) => `<i class="${i <= currentSlideIndex ? 'on' : ''}"></i>`).join('');

    prevBtn.disabled = currentSlideIndex === 0 && currentSubIndex === 0;
    prevBtn.setAttribute('aria-label', currentLang === 'en' ? 'Previous' : '上一頁');
    const lastSlide = currentSlideIndex === slides.length - 1;
    const lastChapter = currentSubIndex === chapters.length - 1;
    let label = t.next;
    if (lastSlide && !lastChapter) label = t.nextChapter(chapters[currentSubIndex + 1].title);
    else if (lastSlide && currentCategory === 'main') label = t.toPark;
    else if (lastSlide) label = t.finish;
    nextBtn.textContent = label;
    nextBtn.title = label;
    markDone();
  }

  function render() { renderStatic(); renderSlide(); renderSubMenu(); }

  function goNext() {
    const chapters = tutorialData[currentLang][currentCategory];
    const slides = chapters[currentSubIndex].slides;
    if (currentSlideIndex < slides.length - 1) currentSlideIndex++;
    else if (currentSubIndex < chapters.length - 1) { currentSubIndex++; currentSlideIndex = 0; }
    else if (currentCategory === 'main') { currentCategory = 'park'; currentSubIndex = 0; currentSlideIndex = 0; }
    else { goLobby(); return; }
    render();
  }
  function goPrev() {
    if (currentSlideIndex > 0) currentSlideIndex--;
    else if (currentSubIndex > 0) { currentSubIndex--; currentSlideIndex = tutorialData[currentLang][currentCategory][currentSubIndex].slides.length - 1; }
    else return;
    render();
  }
  nextBtn.onclick = goNext;
  prevBtn.onclick = goPrev;

  $('langToggle').onclick = () => { currentLang = currentLang === 'zh' ? 'en' : 'zh'; render(); };
  document.querySelectorAll('.seg button').forEach((btn) => {
    btn.onclick = () => { currentDeviceMode = btn.dataset.mode; render(); };
  });
  document.querySelectorAll('.cats button').forEach((btn) => {
    btn.onclick = () => { currentCategory = btn.dataset.category; currentSubIndex = 0; currentSlideIndex = 0; render(); };
  });

  // 放大看圖
  const openZoom = () => { lightboxImg.src = shownSrc || displayImage.src; lightbox.classList.add('show'); };
  stage.onclick = openZoom;
  stage.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openZoom(); } });
  lightbox.onclick = () => lightbox.classList.remove('show');

  // 鍵盤：← → 翻頁，Esc 關掉放大圖
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { lightbox.classList.remove('show'); return; }
    if (lightbox.classList.contains('show')) return;
    if (e.key === 'ArrowRight') goNext();
    if (e.key === 'ArrowLeft') goPrev();
  });

  // 手機：在截圖上左右滑動翻頁
  let touchX = null;
  stage.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].screenX; }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].screenX - touchX;
    touchX = null;
    if (Math.abs(dx) < 40) return;
    // 滑動過就不要再觸發點擊放大
    stage.dataset.swiped = '1';
    setTimeout(() => delete stage.dataset.swiped, 350);
    if (dx < 0) goNext(); else goPrev();
  }, { passive: true });
  stage.addEventListener('click', (e) => { if (stage.dataset.swiped) e.stopImmediatePropagation(); }, true);

  // 電腦：在截圖上滾滑鼠滾輪也能翻頁
  let wheelLock = null;
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (wheelLock) return;
    if (e.deltaY > 0) goNext(); else if (e.deltaY < 0) goPrev();
    wheelLock = setTimeout(() => { wheelLock = null; }, 450);
  }, { passive: false });

  render();
</script>
