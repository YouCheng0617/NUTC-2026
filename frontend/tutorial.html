<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漂流指南 - 心情漂流瓶</title>
<style>
  body {
    background: linear-gradient(180deg, #044b7a 0%, #011322 100%);
    margin: 0;
    height: 100vh; 
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #e0e0e0;
    overflow: hidden; 
    position: relative;
  }

  .bubbles-container {
    position: fixed; 
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none; 
  }
  .bubble {
    position: absolute;
    bottom: -100px;
    background-color: rgba(255, 255, 255, 0.15); 
    border-radius: 50%;
    animation: floatUp infinite ease-in;
  }
  .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 8s; animation-delay: 0s; }
  .bubble:nth-child(2) { left: 25%; width: 20px; height: 20px; animation-duration: 5s; animation-delay: 2s; }
  .bubble:nth-child(3) { left: 40%; width: 50px; height: 50px; animation-duration: 10s; animation-delay: 1s; }
  .bubble:nth-child(4) { left: 60%; width: 30px; height: 30px; animation-duration: 7s; animation-delay: 3s; }
  .bubble:nth-child(5) { left: 75%; width: 65px; height: 65px; animation-duration: 12s; animation-delay: 0s; }
  .bubble:nth-child(6) { left: 85%; width: 25px; height: 25px; animation-duration: 6s; animation-delay: 4s; }
  .bubble:nth-child(7) { left: 95%; width: 45px; height: 45px; animation-duration: 9s; animation-delay: 2s; }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
  }

  ::-webkit-scrollbar {
    display: none;
  }
  * {
    -ms-overflow-style: none;  
    scrollbar-width: none;  
  }

  .tutorial-window {
    position: relative;
    z-index: 10; 
    width: 1050px; 
    height: 620px; 
    max-width: 95vw; 
    max-height: 90vh; 
    background-color: rgba(15, 32, 55, 0.85); 
    backdrop-filter: blur(12px); 
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    display: flex;
    box-shadow: 0 15px 50px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  /* === 頂部標題與語言切換區塊 === */
  .header-group {
    position: absolute;
    top: 22px; 
    left: 25px;
    display: flex;
    align-items: center;
    gap: 15px; 
    z-index: 100;
  }

  .tutorial-header {
    font-size: 20px;
    font-weight: bold;
    color: #f4ecd8; 
    letter-spacing: 2px;
    white-space: nowrap; 
  }
  .tutorial-header span { color: #5ab9ff; }

  .lang-toggle-btn {
    background: #0f1929; 
    border-radius: 20px;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #3b749f; 
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    user-select: none;
    transition: 0.3s ease;
    white-space: nowrap;
  }
  .lang-toggle-btn:hover {
    color: #5ab9ff;
    background: #142136;
  }
  .lang-toggle-btn .globe {
    font-size: 15px;
    filter: drop-shadow(0 0 2px rgba(90, 185, 255, 0.5));
  }

  /* 版本切換開關 */
  .device-toggle {
    position: absolute;
    top: 20px; 
    right: 75px; 
    display: flex;
    background: rgba(0, 0, 0, 0.25); 
    border-radius: 30px;
    padding: 3px;
    z-index: 100;
    backdrop-filter: blur(6px); 
    opacity: 0.65; 
    transition: 0.3s ease;
  }
  .device-toggle:hover {
    opacity: 1; 
    background: rgba(0, 0, 0, 0.4);
  }
  .toggle-btn {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    color: rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: 0.3s;
    user-select: none;
  }
  .toggle-btn.active {
    background: rgba(90, 185, 255, 0.75); 
    color: #011322;
    box-shadow: 0 2px 10px rgba(90, 185, 255, 0.2);
  }

  .close-btn {
    position: absolute;
    top: 13px; right: 25px;
    font-size: 35px;
    color: #8899a6;
    cursor: pointer;
    font-weight: bold;
    z-index: 100;
    user-select: none;
    transition: 0.2s;
  }
  .close-btn:hover { 
    color: #5ab9ff; 
    transform: scale(1.1); 
  }

  /* === 側邊選單 === */
  .main-sidebar {
    width: 90px;
    background-color: rgba(5, 15, 28, 0.6); 
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 80px;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
  }
  .main-tab {
    width: 55px; height: 55px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.1);
    margin-bottom: 25px;
    display: flex; justify-content: center; align-items: center;
    font-size: 28px;
    cursor: pointer;
    transition: 0.3s;
    color: #888;
  }
  .main-tab.active {
    background-color: #5ab9ff; 
    color: #011322;
    box-shadow: 0 0 15px rgba(90, 185, 255, 0.6);
  }

  .sub-sidebar {
    width: 175px; 
    padding: 80px 15px 20px 15px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .sub-tab {
    padding: 12px 15px; 
    margin-bottom: 12px;
    border-radius: 30px; 
    background-color: rgba(255, 255, 255, 0.05);
    color: #99aab5;
    font-size: 14.5px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
  }
  .sub-tab:hover { background-color: rgba(255, 255, 255, 0.15); color: white; }
  .sub-tab.active {
    background-color: rgba(90, 185, 255, 0.2); 
    color: #5ab9ff; 
    border: 1px solid rgba(90, 185, 255, 0.5);
  }

  /* === 內容展示區 === */
  .content-area {
    flex: 1;
    padding: 45px 30px 25px 20px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden; 
  }

  .carousel-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 72%; 
    margin-bottom: 25px; 
    position: relative;
    touch-action: pan-y; 
  }

  .image-container {
    position: relative;
    flex: 1; 
    margin: 0; 
    width: 100%;
    height: 100%; 
    background-color: transparent; 
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: zoom-in; 
  }
  
  .image-container img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 16px; 
    filter: drop-shadow(0 8px 25px rgba(0,0,0,0.6)); 
    transition: 0.2s;
  }
  .image-container:hover img {
    transform: scale(1.02); 
  }

  .zoom-hint {
    position: absolute;
    right: 15px; bottom: 15px;
    background: rgba(0, 0, 0, 0.4); 
    color: rgba(255, 255, 255, 0.6); 
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    pointer-events: none; 
    backdrop-filter: blur(4px);
    transition: 0.3s;
    letter-spacing: 1px;
    z-index: 20;
  }
  .image-container:hover .zoom-hint {
    background: rgba(0, 0, 0, 0.6);
    color: rgba(255, 255, 255, 0.9);
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: rgba(255, 255, 255, 0.6); 
    background: rgba(0, 0, 0, 0.2) !important; 
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none !important;
    outline: none !important;
    cursor: pointer;
    transition: 0.3s;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 20;
  }
  .arrow-left { left: 10px; }
  .arrow-right { right: 10px; }
  .arrow:hover { 
    background: rgba(0, 0, 0, 0.6) !important;
    color: #fff;
  }

  .dots-wrapper {
    position: absolute;
    bottom: -25px; 
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 5; 
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 5px rgba(0,0,0,0.6); 
    transition: 0.3s;
  }
  .dot.active { background-color: #5ab9ff; box-shadow: 0 0 8px #5ab9ff, 0 0 5px rgba(0,0,0,0.6); }

  .text-container { 
    padding: 0 20px; 
    height: 28%; 
    overflow-y: auto; 
  }
  .text-title {
    font-size: 22px; 
    font-weight: bold;
    color: white;
    margin: 0 0 8px 0;
  }
  .text-desc {
    font-size: 15px; 
    color: #b0c4de; 
    line-height: 1.6;
    margin: 0;
  }

  /* === 全螢幕放大模態框 === */
  .lightbox {
    display: none; 
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    z-index: 9999; 
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .lightbox.show {
    display: flex;
    opacity: 1;
  }
  
  .lightbox img {
    width: 90vw;
    height: 90vh;
    object-fit: contain;
    border-radius: 16px; 
    filter: drop-shadow(0 0 25px rgba(255,255,255,0.15));
  }
  
  .lightbox-close {
    position: absolute;
    top: 20px; right: 30px;
    color: white;
    font-size: 50px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10000;
  }
  .lightbox-close:hover { color: #5ab9ff; }

  /* === RWD 響應式設計 === */
  @media (max-width: 900px) {
    .tutorial-window {
      flex-direction: column; 
      height: 95vh;
    }
    
    .header-group {
      top: 12px; 
      left: 15px;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .tutorial-header {
      font-size: 18px; 
    }
    .lang-toggle-btn {
      padding: 4px 10px;
      font-size: 12px;
    }
    
    .device-toggle {
      top: 12px;
      right: 60px; 
      opacity: 0.85; 
    }
    .toggle-btn {
      padding: 4px 10px;
      font-size: 12px;
    }

    .close-btn {
      top: 8px; right: 15px;
    }

    .main-sidebar {
      width: 100%;
      flex-direction: row;
      justify-content: center;
      padding: 10px 0;
      padding-top: 70px;
      border-right: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .main-tab {
      width: 45px; height: 45px;
      margin: 0 15px;
      font-size: 22px;
    }

    .sub-sidebar {
      width: 100%;
      height: auto;
      padding: 10px 15px;
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch; 
    }
    .sub-tab {
      display: inline-block;
      margin: 0 10px 0 0;
      padding: 8px 16px;
      font-size: 14px;
    }

    .content-area {
      padding: 15px 5px 20px 5px; 
    }

    .carousel-container {
      height: 75%; 
      margin-bottom: 15px;
    }
    
    .arrow {
      width: 36px;
      height: 36px;
      font-size: 16px;
    }
    .arrow-left { left: 5px; }
    .arrow-right { right: 5px; }

    .text-container {
      height: 25%; 
      padding: 0 10px; 
      margin-top: 5px;
    }
    
    .text-title {
      font-size: 20px;
    }
  }
</style>
</head>
<body>

<div class="lightbox" id="lightbox">

</div>

<div class="bubbles-container">

  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

<div class="tutorial-window">

</div>

            { img: "./images/tarot_result.webp", mobileImg: "./images/m_tarot_result.webp", subtitle: "AI Interpretation", desc: "After drawing, the system uses AI to provide a deep, comprehensive analysis and personalized reading report." },
            { img: "./images/tarot_save.webp", mobileImg: "./images/m_tarot_save.webp", subtitle: "Ask Again & Save", desc: "You can click 'Ask Again' to recalculate, or click 'Save Reading' to keep this guidance permanently." },
            { img: "./images/tarot_collection.webp", mobileImg: "./images/m_tarot_collection.webp", subtitle: "Magic Collection", desc: "Click the top right to enter the 'Magic Collection'. It marks the date, topic, drawn cards, and full AI explanation records!" }
          ]
        },
        {
          title: "Sudden Puzzle",
          slides: [
            { img: "./images/puzzle_intro.webp", mobileImg: "./images/m_puzzle_intro.webp", subtitle: "Marine Life Puzzle", desc: "A task-oriented puzzle game themed around 'Marine Life'. Each puzzle has 9 fixed blocks with normal and premium fragments." },
            { img: "./images/puzzle_gacha.webp", mobileImg: "./images/m_puzzle_gacha.webp", subtitle: "Summon & Draw", desc: "Complete daily tasks to get 'Summon Stones'. Spend them to draw random normal or premium puzzle fragments." },
            { img: "./images/puzzle_workshop.webp", mobileImg: "./images/m_puzzle_workshop.webp", subtitle: "Fragment Workshop", desc: "Have extra fragments? Use the 'Fragment Workshop' to exchange them for chests. Opening chests guarantees a fragment!" },
            { img: "./images/puzzle_cabinet.webp", mobileImg: "./images/m_puzzle_cabinet.webp", subtitle: "Puzzle Cabinet", desc: "Enter the cabinet to see your collection progress. You can directly search for specific fish names or use the dropdown to filter and view specific fragments from No. 1 to No. 9!" },
            { img: "./images/puzzle_history.webp", mobileImg: "./images/m_puzzle_history.webp", subtitle: "Summon History", desc: "Click the 'Summon History' tab at the top of the cabinet. Here you can find a complete record of all the puzzle fragments you've drawn, including the time and rarity." }
          ]
        },
        {
          title: "Daily Notes",
          slides: [
            { img: "./images/notes_wall.webp", mobileImg: "./images/m_notes_wall.webp", subtitle: "Silent Tree Hole & 3D Space", desc: "An anonymous space where messages clear after 24 hrs. Swipe to rotate the 3D space, click any note to zoom in, or click 'Refresh' at the top right to see more notes!" },
            { img: "./images/notes_write.webp", mobileImg: "./images/m_notes_write.webp", subtitle: "Pure Expression", desc: "Click 'Post' at the bottom right to write. Each note has a 50-character limit, strictly allowing 'one message per day', and cannot be edited after submission." }
          ]
        },
        {
          title: "Bottle Shooting",
          slides: [
            { img: "./images/shooting_menu.webp", mobileImg: "./images/m_shooting_menu.webp", subtitle: "Dynamic Sniper", desc: "Test your reflexes! Easy, Normal, and Hard levels. Features a combo bonus, but shooting the interference 'Fish' deducts points." },
            { img: "./images/shooting_game.webp", mobileImg: "./images/m_shooting_game.webp", subtitle: "Buffs & Debuffs", desc: "Accurately shoot falling 'bottles' for high scores. Hit the 'glowing hourglass' to add time, or 'glowing shell' to refill ammo!" }
          ]
        },
        {
          title: "Catch the Bottle",
          slides: [
            { img: "./images/catch_menu.webp", mobileImg: "./images/m_catch_menu.webp", subtitle: "Catch Challenge", desc: "Fast-paced catching game! In a 30-second limit, agilely control the basket to catch falling drift bottles for points across three difficulties." },
            { img: "./images/catch_game.webp", mobileImg: "./images/m_catch_game.webp", subtitle: "Dodge & Shield", desc: "Perfectly dodge point-deducting bombs! Random 'Double Stars' double points for 3 seconds, and 'Invincible Shields' block one bomb penalty." }
          ]
        }
      ]
    }
  };

  let currentLang = 'zh'; 
  let currentDeviceMode = 'desktop'; 
  let currentCategory = 'main'; 
  let currentSubIndex = 0;      
  let currentSlideIndex = 0;    

  langToggle.onclick = () => {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    
    document.getElementById('headerTitle').innerHTML = uiTexts[currentLang].header;
    document.getElementById('btnDesktop').innerText = uiTexts[currentLang].desktop;
    document.getElementById('btnMobile').innerText = uiTexts[currentLang].mobile;
    document.getElementById('zoomHint').innerText = uiTexts[currentLang].zoom;
    document.getElementById('langText').innerText = uiTexts[currentLang].lang;
    document.getElementById('tabMain').title = uiTexts[currentLang].tabMainTitle;
    document.getElementById('tabPark').title = uiTexts[currentLang].tabParkTitle;
    
    renderSubMenu();
    renderSlide();
  };

  const toggleBtns = document.querySelectorAll('.device-toggle .toggle-btn');
  toggleBtns.forEach(btn => {
    btn.onclick = (e) => {
      toggleBtns.forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      currentDeviceMode = e.currentTarget.getAttribute('data-mode');
      renderSlide(); 
    };
  });

  subSidebar.addEventListener('wheel', (evt) => {
    if (window.innerWidth <= 900) {
      evt.preventDefault();
      subSidebar.scrollLeft += evt.deltaY;
    }
  });

  let wheelTimeout;
  carouselContainer.addEventListener('wheel', (evt) => {
    evt.preventDefault(); 
    if (wheelTimeout) return;
    if (evt.deltaY > 0) {
      nextBtn.click(); 
    } else if (evt.deltaY < 0) {
      prevBtn.click(); 
    }
    wheelTimeout = setTimeout(() => {
      wheelTimeout = null;
    }, 400); 
  }, { passive: false });

  let touchStartX = 0;
  let touchEndX = 0;

  carouselContainer.addEventListener('touchstart', (evt) => {
    touchStartX = evt.changedTouches[0].screenX;
  }, { passive: true });

  carouselContainer.addEventListener('touchend', (evt) => {
    touchEndX = evt.changedTouches[0].screenX;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const threshold = 40; 
    if (touchStartX - touchEndX > threshold) {
      if(nextBtn.style.visibility !== 'hidden') nextBtn.click();
    } else if (touchEndX - touchStartX > threshold) {
      if(prevBtn.style.visibility !== 'hidden') prevBtn.click();
    }
  }

  function renderSubMenu() {
    subSidebar.innerHTML = ''; 
    const items = tutorialData[currentLang][currentCategory];
    
    items.forEach((item, index) => {
      const btn = document.createElement('div');
      btn.className = `sub-tab ${index === currentSubIndex ? 'active' : ''}`;
      btn.innerText = item.title;
      btn.onclick = () => {
        currentSubIndex = index;
        currentSlideIndex = 0; 
        renderSubMenu();       
        renderSlide();         
      };
      subSidebar.appendChild(btn);
    });
  }

  function renderSlide() {
    const slideData = tutorialData[currentLang][currentCategory][currentSubIndex].slides;
    const currentSlide = slideData[currentSlideIndex];

    displayImage.src = currentDeviceMode === 'mobile' ? currentSlide.mobileImg : currentSlide.img;
    displayTitle.innerText = currentSlide.subtitle;
    displayDesc.innerText = currentSlide.desc;

    dotsWrapper.innerHTML = '';
    slideData.forEach((_, idx) => {
      const dot = document.createElement('div');
      dot.className = `dot ${idx === currentSlideIndex ? 'active' : ''}`;
      dotsWrapper.appendChild(dot);
    });

    if (slideData.length <= 1) {
      prevBtn.style.visibility = 'hidden';
      nextBtn.style.visibility = 'hidden';
    } else {
      prevBtn.style.visibility = currentSlideIndex === 0 ? 'hidden' : 'visible';
      nextBtn.style.visibility = currentSlideIndex === slideData.length - 1 ? 'hidden' : 'visible';
      
      prevBtn.style.cursor = currentSlideIndex === 0 ? 'default' : 'pointer';
      prevBtn.style.cursor = currentSlideIndex === slideData.length - 1 ? 'default' : 'pointer';
      prevBtn.style.opacity = '1';
    }
  }

  prevBtn.onclick = () => {
    if (currentSlideIndex > 0) {
      currentSlideIndex--;
      renderSlide();
    }
  };
  
  nextBtn.onclick = () => {
    const maxSlides = tutorialData[currentLang][currentCategory][currentSubIndex].slides.length;
    if (currentSlideIndex < maxSlides - 1) {
      currentSlideIndex++;
      renderSlide();
    }
  };

  document.querySelectorAll('.main-tab').forEach(tab => {
    tab.onclick = (e) => {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
      e.currentTarget.classList.add('active');
      
      currentCategory = e.currentTarget.getAttribute('data-category');
      currentSubIndex = 0;
      currentSlideIndex = 0;
      
      renderSubMenu();
      renderSlide();
    };
  });

  renderSubMenu();
  renderSlide();
</script>
</body>
</html>
