<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漂流指南 - 心情漂流瓶</title>
<style>
  body {
    background: linear-gradient(180deg, #044b7a 0%, #011322 100%);
    margin: 0;
    min-height: 100vh; 
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #e0e0e0;
    overflow-y: auto; 
    position: relative;
    padding: 20px 0; 
  }

  .bubbles-container {
    position: fixed; 
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none; 
  }
  .bubble {
    position: absolute;
    bottom: -100px;
    background-color: rgba(255, 255, 255, 0.15); 
    border-radius: 50%;
    animation: floatUp infinite ease-in;
  }
  .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 8s; animation-delay: 0s; }
  .bubble:nth-child(2) { left: 25%; width: 20px; height: 20px; animation-duration: 5s; animation-delay: 2s; }
  .bubble:nth-child(3) { left: 40%; width: 50px; height: 50px; animation-duration: 10s; animation-delay: 1s; }
  .bubble:nth-child(4) { left: 60%; width: 30px; height: 30px; animation-duration: 7s; animation-delay: 3s; }
  .bubble:nth-child(5) { left: 75%; width: 65px; height: 65px; animation-duration: 12s; animation-delay: 0s; }
  .bubble:nth-child(6) { left: 85%; width: 25px; height: 25px; animation-duration: 6s; animation-delay: 4s; }
  .bubble:nth-child(7) { left: 95%; width: 45px; height: 45px; animation-duration: 9s; animation-delay: 2s; }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
  }

  .tutorial-window {
    position: relative;
    z-index: 10; 
    /* 微調寬高，給長條形圖片更多上下延伸空間 */
    width: 1150px; 
    height: 720px; 
    background-color: rgba(15, 32, 55, 0.85); 
    backdrop-filter: blur(12px); 
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    display: flex;
    box-shadow: 0 15px 50px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  .close-btn {
    position: absolute;
    top: 15px; right: 25px;
    font-size: 35px;
    color: #8899a6;
    cursor: pointer;
    font-weight: bold;
    z-index: 100;
    user-select: none;
    transition: 0.2s;
  }
  .close-btn:hover { 
    color: #5ab9ff; 
    transform: scale(1.1); 
  }

  .tutorial-header {
    position: absolute;
    top: 20px; left: 25px;
    font-size: 20px;
    font-weight: bold;
    color: #f4ecd8; 
    letter-spacing: 2px;
    z-index: 100;
  }
  .tutorial-header span { color: #5ab9ff; }

  .main-sidebar {
    width: 90px;
    background-color: rgba(5, 15, 28, 0.6); 
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 80px;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
  }
  .main-tab {
    width: 55px; height: 55px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.1);
    margin-bottom: 25px;
    display: flex; justify-content: center; align-items: center;
    font-size: 28px;
    cursor: pointer;
    transition: 0.3s;
    color: #888;
  }
  .main-tab.active {
    background-color: #5ab9ff; 
    color: #011322;
    box-shadow: 0 0 15px rgba(90, 185, 255, 0.6);
  }

  .sub-sidebar {
    width: 230px;
    padding: 80px 15px 20px 20px;
    overflow-y: auto;
  }
  .sub-tab {
    padding: 14px 18px;
    margin-bottom: 12px;
    border-radius: 30px; 
    background-color: rgba(255, 255, 255, 0.05);
    color: #99aab5;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
  }
  .sub-tab:hover { background-color: rgba(255, 255, 255, 0.15); color: white; }
  .sub-tab.active {
    background-color: rgba(90, 185, 255, 0.2); 
    color: #5ab9ff; 
    border: 1px solid rgba(90, 185, 255, 0.5);
  }

  .content-area {
    flex: 1;
    padding: 50px 30px 30px 20px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .carousel-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 25px;
  }

  .image-container {
    position: relative;
    flex: 1; 
    margin: 0 15px; 
    /* 拉高圖片展示區，讓長圖可以變更大 */
    height: 480px; 
    background-color: transparent; 
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: zoom-in; 
  }
  
  .image-container img {
    width: 100%;
    height: 100%;
    object-fit: contain; 
    filter: drop-shadow(0 8px 25px rgba(0,0,0,0.6)); 
    transition: 0.2s;
  }
  .image-container:hover img {
    transform: scale(1.02); 
  }

  .zoom-hint {
    position: absolute;
    right: 15px; bottom: 15px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    pointer-events: none; 
    backdrop-filter: blur(4px);
    opacity: 0.5;
    transition: 0.3s;
    letter-spacing: 1px;
    z-index: 20;
  }
  .image-container:hover .zoom-hint {
    opacity: 1;
  }

  .arrow {
    font-size: 40px;
    color: #5ab9ff; 
    background: transparent !important;
    border: none !important;
    outline: none !important;
    cursor: pointer;
    opacity: 0.6;
    transition: 0.3s;
    padding: 0 10px;
  }
  .arrow:hover { 
    opacity: 1; 
    text-shadow: 0 0 15px rgba(90,185,255,0.8);
  }

  .dots-wrapper {
    position: absolute;
    bottom: -25px; 
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 5; 
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 5px rgba(0,0,0,0.6); 
    transition: 0.3s;
  }
  .dot.active { background-color: #5ab9ff; box-shadow: 0 0 8px #5ab9ff, 0 0 5px rgba(0,0,0,0.6); }

  .text-container { padding: 0 15px; margin-top: 15px; }
  .text-title {
    font-size: 24px; 
    font-weight: bold;
    color: white;
    margin: 0 0 10px 0;
  }
  .text-desc {
    font-size: 16px; 
    color: #b0c4de; 
    line-height: 1.6;
    margin: 0;
  }

  /* === 全螢幕放大圖片模態框 === */
  .lightbox {
    display: none; 
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    z-index: 9999; 
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .lightbox.show {
    display: flex;
    opacity: 1;
  }
  
  .lightbox img {
    width: 100%;
    height: 100%;
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    filter: drop-shadow(0 0 25px rgba(255,255,255,0.15));
  }
  
  .lightbox-close {
    position: absolute;
    top: 20px; right: 30px;
    color: white;
    font-size: 50px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10000;
  }
  .lightbox-close:hover { color: #5ab9ff; }

</style>
</head>
<body>

<!-- 全螢幕放大圖片區塊 -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close">&times;</span>
  <img id="lightboxImg" src="" alt="放大圖片">
</div>

<div class="bubbles-container">
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
</div>

<div class="tutorial-window">
  <div class="close-btn" id="closeGuideBtn" title="返回大廳">&times;</div>
  
  <div class="tutorial-header"><span>▍</span>漂流指南</div>

  <div class="main-sidebar">
    <div class="main-tab active" data-category="main" title="心情漂流瓶">🍾</div>
    <div class="main-tab" data-category="park" title="遊樂園">🎮</div>
  </div>

  <div class="sub-sidebar" id="subSidebar"></div>

  <div class="content-area">
    <div class="carousel-container">
      <button class="arrow arrow-left" id="prevBtn">◀</button>
      
      <div class="image-container" id="imgContainer">
        <img id="displayImage" src="" alt="指南圖片">
        <div class="zoom-hint">🔍 點擊圖片放大</div>
        <div class="dots-wrapper" id="dotsWrapper"></div>
      </div>
      
      <button class="arrow arrow-right" id="nextBtn">▶</button>
    </div>

    <div class="text-container">
      <h3 class="text-title" id="displayTitle">標題</h3>
      <p class="text-desc" id="displayDesc">描述內容</p>
    </div>
  </div>
</div>

<script>
  document.getElementById('closeGuideBtn').onclick = () => {
    window.location.href = 'test.html'; 
  };

  // 全螢幕放大邏輯
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const imgContainer = document.getElementById('imgContainer');
  
  imgContainer.onclick = () => {
    lightboxImg.src = document.getElementById('displayImage').src;
    lightbox.classList.add('show');
  };
  
  lightbox.onclick = () => {
    lightbox.classList.remove('show');
  };

  const tutorialData = {
    main: [
      {
        title: "歡迎來到漂流瓶",

          { img: "./images/profile_edit.png", subtitle: "編輯個人資料", desc: "進入個人資料設定後，你可以自由修改細節，打造專屬的個人形象。" },

          { img: "./images/temple_rules.png", subtitle: "海神殿規", desc: "來到這邊要守的規則與溫馨小提醒，一起維護友善的海洋。" },
          { img: "./images/summon_current.png", subtitle: "呼喚海流", desc: "按了之後會隨機刷新瓶子，或是 60 秒後也會自動刷新。" },
          { img: "./images/channel_categories.png", subtitle: "頻道分類", desc: "這邊可以選擇貼文的分類，有分所有文章(全海域)、只看單一頻道(憤怒、秘密、傷心、厭世/躺平、開心)。" }
        ]
      },
      {
        title: "尋找共鳴與留言",
        slides: [
          { img: "./images/search.png", subtitle: "搜尋特定話題", desc: "使用畫面上方的搜尋列，輸入關鍵字就能快速尋找相關的漂流瓶，點開即可看到完整內容。" },

          { img: "./images/pet_home.png", subtitle: "你的桌寵夥伴", desc: "畫面裡有一隻可愛小傢伙陪伴你！點兩下會跑向你，不需要時也能拉牠回「桌寵的家」睡覺。" },
          { img: "./images/ai_assistant.png", subtitle: "AI 特助聊天", desc: "點擊桌寵會喚醒「AI 特助」，不但能陪你聊天，還提供夜間模式、調整字體與多國語言切換等功能！" }
        ]
      }
    ],
    park: [
      {
        title: "秘密海域遊樂場",
        slides: [
          { img: "./images/park_lobby.png", subtitle: "秘密海域大廳", desc: "心情有點悶？點擊大廳的「遊樂場」按鈕，這裡準備了六款各具特色的舒壓互動小遊戲等你探索！" }
        ]
      },
      {
        title: "海兔養成記",
        slides: [
          { img: "./images/seahare_home.png", subtitle: "遇見你的海兔", desc: "進入遊戲可享受無限重抽，直到遇見命中注定的專屬海兔並為牠命名！" },
          { img: "./images/seahare_tasks.png", subtitle: "任務與裝扮", desc: "每天完成餵食等任務賺取積分，可至商城兌換背景特效。還能建立連線房間跟好友展示海兔！" }
        ]
      },
      {
        title: "今日塔羅瓶",
        slides: [
          { img: "./images/tarot_categories.png", subtitle: "選擇占卜領域", desc: "提供個人化且無次數限制的塔羅占卜。進入介面後可快速點選預設的六大問題類別（感情、事業、學業、成長、財運、人際），或於下方自訂專屬問題。" },

        ]

          { img: "./images/puzzle_gacha.png", subtitle: "喚醒石與抽卡", desc: "玩家可透過完成每日任務獲取專屬道具「召喚石」，消耗召喚石即可進行抽卡，隨機獲取普通或高級的拼圖碎片。" },
          { img: "./images/puzzle_workshop.png", subtitle: "碎片工坊與寶箱", desc: "擁有重複或多餘碎片時，可利用右上角「碎片工坊」將碎片兌換成普通或高級寶箱，開啟寶箱必得拼圖碎片保底！" },

        ]
      },
      {
        title: "每日便利貼",
        slides: [
          { img: "./images/notes_wall.png", subtitle: "無聲樹洞", desc: "匿名情感交流空間，每人每天限留一次 50 字以內便利貼，24小時後系統會自動清除痕跡。" },
          { img: "./images/notes_write.png", subtitle: "純粹的抒發", desc: "此區刻意關閉回覆功能，讓大家在沒有社交壓力的環境下，純粹地抒發並感受彼此心境。" }
        ]
      },
      {

        slides: [
          { img: "./images/shooting_menu.png", subtitle: "動態狙擊挑戰", desc: "極度考驗反應力與精準度！選擇難度後，準確狙擊掉落的「瓶子」來累積連擊與高分。" },
          { img: "./images/shooting_game.png", subtitle: "干擾與增益", desc: "誤擊干擾物「魚」會被扣分。遊戲中會隨機掉落延長時間的沙漏與補充彈藥的貝殼，善用它們挑戰霸主！" }
        ]
      },
      {
        title: "接住小瓶",
        slides: [
          { img: "./images/catch_menu.png", subtitle: "接物挑戰", desc: "快節奏的刺激接物遊戲！在 30 秒限時內，敏捷操控籃子接住掉落的漂流瓶累積積分。" },
          { img: "./images/catch_game.png", subtitle: "閃避與護盾", desc: "必須完美閃避扣分炸彈！隨機掉落的雙倍星能讓得分翻倍，無敵護盾能擋下一次致命攻擊。" }

      }

  let currentCategory = 'main'; 
  let currentSubIndex = 0;      
  let currentSlideIndex = 0;    

  const subSidebar = document.getElementById('subSidebar');
  const displayImage = document.getElementById('displayImage');
  const displayTitle = document.getElementById('displayTitle');
  const displayDesc = document.getElementById('displayDesc');
  const dotsWrapper = document.getElementById('dotsWrapper');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function renderSubMenu() {
    subSidebar.innerHTML = ''; 
    const items = tutorialData[currentCategory];
    
    items.forEach((item, index) => {
      const btn = document.createElement('div');
      btn.className = `sub-tab ${index === currentSubIndex ? 'active' : ''}`;
      btn.innerText = item.title;
      btn.onclick = () => {
        currentSubIndex = index;
        currentSlideIndex = 0; 
        renderSubMenu();       
        renderSlide();         
      };
      subSidebar.appendChild(btn);
    });
  }

  function renderSlide() {
    const slideData = tutorialData[currentCategory][currentSubIndex].slides;
    const currentSlide = slideData[currentSlideIndex];

    displayImage.src = currentSlide.img;
    displayTitle.innerText = currentSlide.subtitle;
    displayDesc.innerText = currentSlide.desc;

    dotsWrapper.innerHTML = '';
    slideData.forEach((_, idx) => {
      const dot = document.createElement('div');
      dot.className = `dot ${idx === currentSlideIndex ? 'active' : ''}`;
      dotsWrapper.appendChild(dot);
    });

    if (slideData.length <= 1) {
      prevBtn.style.visibility = 'hidden';
      nextBtn.style.visibility = 'hidden';
    } else {
      prevBtn.style.visibility = currentSlideIndex === 0 ? 'hidden' : 'visible';
      nextBtn.style.visibility = currentSlideIndex === slideData.length - 1 ? 'hidden' : 'visible';
      
      prevBtn.style.cursor = currentSlideIndex === 0 ? 'default' : 'pointer';
      nextBtn.style.cursor = currentSlideIndex === slideData.length - 1 ? 'default' : 'pointer';
      prevBtn.style.opacity = '0.6';
      prevBtn.style.opacity = '0.6';
    }
  }

  prevBtn.onclick = () => {
    if (currentSlideIndex > 0) {
      currentSlideIndex--;
      renderSlide();
    }
  };
  
  nextBtn.onclick = () => {
    const maxSlides = tutorialData[currentCategory][currentSubIndex].slides.length;
    if (currentSlideIndex < maxSlides - 1) {
      currentSlideIndex++;
      renderSlide();
    }
  };

  document.querySelectorAll('.main-tab').forEach(tab => {
    tab.onclick = (e) => {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
      e.currentTarget.classList.add('active');
      
      currentCategory = e.currentTarget.getAttribute('data-category');
      currentSubIndex = 0;
      currentSlideIndex = 0;
      
      renderSubMenu();
      renderSlide();
    };
  });

  renderSubMenu();
  renderSlide();
</script>
</body>
</html>
