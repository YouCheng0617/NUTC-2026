<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漂流指南 - 心情漂流瓶</title>
<style>
  body {
    background: linear-gradient(180deg, #044b7a 0%, #011322 100%);
    margin: 0;
    height: 100vh; 
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #e0e0e0;
    overflow: hidden; 
    position: relative;
  }

  .bubbles-container {
    position: fixed; 
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none; 
  }
  .bubble {
    position: absolute;
    bottom: -100px;
    background-color: rgba(255, 255, 255, 0.15); 
    border-radius: 50%;
    animation: floatUp infinite ease-in;
  }
  .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 8s; animation-delay: 0s; }
  .bubble:nth-child(2) { left: 25%; width: 20px; height: 20px; animation-duration: 5s; animation-delay: 2s; }
  .bubble:nth-child(3) { left: 40%; width: 50px; height: 50px; animation-duration: 10s; animation-delay: 1s; }
  .bubble:nth-child(4) { left: 60%; width: 30px; height: 30px; animation-duration: 7s; animation-delay: 3s; }
  .bubble:nth-child(5) { left: 75%; width: 65px; height: 65px; animation-duration: 12s; animation-delay: 0s; }
  .bubble:nth-child(6) { left: 85%; width: 25px; height: 25px; animation-duration: 6s; animation-delay: 4s; }
  .bubble:nth-child(7) { left: 95%; width: 45px; height: 45px; animation-duration: 9s; animation-delay: 2s; }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
  }

  /* === 隱藏所有醜陋的系統預設滾動條，但保留滑動功能 === */
  ::-webkit-scrollbar {
    display: none;
  }
  * {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
  }

  .tutorial-window {
    position: relative;
    z-index: 10; 
    width: 1050px; 
    height: 620px; 
    max-width: 95vw; 
    max-height: 90vh; 
    background-color: rgba(15, 32, 55, 0.85); 
    backdrop-filter: blur(12px); 
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    display: flex;
    box-shadow: 0 15px 50px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  /* === 頂部按鈕與標題排版 === */
  .tutorial-header {
    position: absolute;
    top: 25px; left: 25px;
    font-size: 20px;
    font-weight: bold;
    color: #f4ecd8; 
    letter-spacing: 2px;
    z-index: 100;
  }
  .tutorial-header span { color: #5ab9ff; }

  .close-btn {
    position: absolute;
    top: 13px; right: 25px;
    font-size: 35px;
    color: #8899a6;
    cursor: pointer;
    font-weight: bold;
    z-index: 100;
    user-select: none;
    transition: 0.2s;
  }
  .close-btn:hover { 
    color: #5ab9ff; 
    transform: scale(1.1); 
  }

  /* === 側邊選單 === */
  .main-sidebar {
    width: 90px;
    background-color: rgba(5, 15, 28, 0.6); 
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 80px;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
  }
  .main-tab {
    width: 55px; height: 55px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.1);
    margin-bottom: 25px;
    display: flex; justify-content: center; align-items: center;
    font-size: 28px;
    cursor: pointer;
    transition: 0.3s;
    color: #888;
  }
  .main-tab.active {
    background-color: #5ab9ff; 
    color: #011322;
    box-shadow: 0 0 15px rgba(90, 185, 255, 0.6);
  }

  .sub-sidebar {
    width: 230px;
    padding: 80px 15px 20px 20px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .sub-tab {
    padding: 14px 18px;
    margin-bottom: 12px;
    border-radius: 30px; 
    background-color: rgba(255, 255, 255, 0.05);
    color: #99aab5;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
  }
  .sub-tab:hover { background-color: rgba(255, 255, 255, 0.15); color: white; }
  .sub-tab.active {
    background-color: rgba(90, 185, 255, 0.2); 
    color: #5ab9ff; 
    border: 1px solid rgba(90, 185, 255, 0.5);
  }

  /* === 內容展示區 === */
  .content-area {
    flex: 1;
    padding: 45px 30px 25px 20px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden; 
  }

  .carousel-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 60%; 
    margin-bottom: 15px;
  }

  .image-container {
    position: relative;
    flex: 1; 
    margin: 0 15px; 
    height: 100%; 
    background-color: transparent; 
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: zoom-in; 
  }
  
  .image-container img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 16px; 
    filter: drop-shadow(0 8px 25px rgba(0,0,0,0.6)); 
    transition: 0.2s;
  }
  .image-container:hover img {
    transform: scale(1.02); 
  }

  .zoom-hint {
    position: absolute;
    right: 15px; bottom: 15px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    pointer-events: none; 
    backdrop-filter: blur(4px);
    opacity: 0.5;
    transition: 0.3s;
    letter-spacing: 1px;
    z-index: 20;
  }
  .image-container:hover .zoom-hint {
    opacity: 1;
  }

  .arrow {
    font-size: 38px;
    color: #5ab9ff; 
    background: transparent !important;
    border: none !important;
    outline: none !important;
    cursor: pointer;
    opacity: 0.6;
    transition: 0.3s;
    padding: 0 10px;
  }
  .arrow:hover { 
    opacity: 1; 
    text-shadow: 0 0 15px rgba(90,185,255,0.8);
  }

  .dots-wrapper {
    position: absolute;
    bottom: -22px; 
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 5; 
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background-color: rgba(255,255,255,0.4);
    box-shadow: 0 0 5px rgba(0,0,0,0.6); 
    transition: 0.3s;
  }
  .dot.active { background-color: #5ab9ff; box-shadow: 0 0 8px #5ab9ff, 0 0 5px rgba(0,0,0,0.6); }

  .text-container { 
    padding: 0 15px; 
    margin-top: 15px; 
    height: 35%; 
    overflow-y: auto; 
  }
  .text-title {
    font-size: 22px; 
    font-weight: bold;
    color: white;
    margin: 0 0 8px 0;
  }
  .text-desc {
    font-size: 15px; 
    color: #b0c4de; 
    line-height: 1.6;
    margin: 0;
  }

  /* === 全螢幕放大圖片模態框 === */
  .lightbox {
    display: none; 
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    z-index: 9999; 
    justify-content: center;
    align-items: center;
    cursor: zoom-out;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .lightbox.show {
    display: flex;
    opacity: 1;
  }
  
  .lightbox img {
    width: 90vw;
    height: 90vh;
    object-fit: contain;
    border-radius: 16px; 
    filter: drop-shadow(0 0 25px rgba(255,255,255,0.15));
  }
  
  .lightbox-close {
    position: absolute;
    top: 20px; right: 30px;
    color: white;
    font-size: 50px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10000;
  }
  .lightbox-close:hover { color: #5ab9ff; }

  /* ========================================== */
  /* === RWD 響應式設計：針對平板與手機介面 === */
  /* ========================================== */
  @media (max-width: 900px) {
    .tutorial-window {
      flex-direction: column; 
      height: 95vh;
    }
    
    .tutorial-header {
      top: 15px; left: 15px;
    }

    .close-btn {
      top: 8px; right: 15px;
    }

    .main-sidebar {
      width: 100%;
      flex-direction: row;
      justify-content: center;
      padding: 10px 0;
      padding-top: 60px; /* 留出空間給上方的標題 */
      border-right: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .main-tab {
      width: 45px; height: 45px;
      margin: 0 15px;
      font-size: 22px;
    }

    .sub-sidebar {
      width: 100%;
      height: auto;
      padding: 10px 15px;
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch; 
    }
    .sub-tab {
      display: inline-block;
      margin: 0 10px 0 0;
      padding: 8px 16px;
      font-size: 14px;
    }

    .content-area {
      padding: 15px 15px 20px 15px;
    }

    .carousel-container {
      height: 55%;
    }

    .text-container {
      height: 45%;
    }
    
    .text-title {
      font-size: 20px;
    }
    
    .arrow {
      font-size: 30px;
      padding: 0 5px;
    }
  }

</style>
</head>

</div>

  const lightboxImg = document.getElementById('lightboxImg');
  const imgContainer = document.getElementById('imgContainer');
  
  imgContainer.onclick = () => {
    lightboxImg.src = document.getElementById('displayImage').src;
    lightbox.classList.add('show');
  };

    lightbox.classList.remove('show');

          { img: "./images/puzzle_intro.png", subtitle: "海洋生物拼圖", desc: "以「海洋生物」為主題的任務導向拼圖小遊戲。每幅拼圖皆由 9 個固定位置的區塊組成，碎片分為普通與高級。" },
          { img: "./images/puzzle_gacha.png", subtitle: "喚醒石與抽卡", desc: "玩家可透過完成每日任務獲取專屬道具「召喚石」，消耗召喚石進行抽卡，隨機獲取普通或高級的拼圖碎片。" },
          { img: "./images/puzzle_workshop.png", subtitle: "碎片工坊與寶箱", desc: "擁有多餘碎片時，可利用右上角「碎片工坊」將碎片兌換成寶箱，開啟寶箱將必定「保底」獲得拼圖碎片！" },
          { img: "./images/puzzle_cabinet.png", subtitle: "拼圖收藏展示櫃", desc: "點擊「我的收藏」進入展示櫃，會即時同步並視覺化所有海洋生物的收集進度，帶給你滿滿的解鎖成就感。" }
        ]
      },
      {
        title: "每日便利貼",
        slides: [
          { img: "./images/notes_wall.png", subtitle: "無聲樹洞", desc: "宛如「無聲樹洞」的匿名情感交流空間，所有留言 24 小時後自動清除。為保持純粹，此區刻意關閉回覆與評論功能。" },
          { img: "./images/notes_write.png", subtitle: "純粹的抒發", desc: "每則便利貼設有最高 50 字的字數上限，且系統嚴格限制每人「每日僅限留言一次」，送出後即不可修改。" }
        ]
      },
      {
        title: "瓶命射擊",
        slides: [
          { img: "./images/shooting_menu.png", subtitle: "動態狙擊挑戰", desc: "考驗反應力與精準度！分為簡單、普通、困難三種級別。設有連擊加成機制，但誤擊干擾物「魚」將被扣分懲罰。" },
          { img: "./images/shooting_game.png", subtitle: "干擾與增益", desc: "準確狙擊掉落的「瓶子」拿高分。擊中隨機掉落的「發光沙漏」可延長剩餘時間，擊中「發光貝殼」則能補充彈藥數量！" }
        ]
      },
      {
        title: "接住小瓶",
        slides: [
          { img: "./images/catch_menu.png", subtitle: "接物挑戰", desc: "快節奏的刺激接物遊戲！在 30 秒的單局限時內，敏捷操控籃子接住掉落的漂流瓶累積積分，分為三種難度級別。" },
          { img: "./images/catch_game.png", subtitle: "閃避與護盾", desc: "必須完美閃避扣分炸彈！隨機掉落的「雙倍星」能讓 3 秒內得分翻倍，「無敵護盾」能擋下一次炸彈的扣分懲罰。" }
        ]
      }
    ]
  };

  let currentCategory = 'main'; 
  let currentSubIndex = 0;      
  let currentSlideIndex = 0;    

  const displayImage = document.getElementById('displayImage');
  const displayTitle = document.getElementById('displayTitle');
  const displayDesc = document.getElementById('displayDesc');
  const dotsWrapper = document.getElementById('dotsWrapper');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function renderSubMenu() {
    subSidebar.innerHTML = ''; 
    const items = tutorialData[currentCategory];
    
    items.forEach((item, index) => {
      const btn = document.createElement('div');
      btn.className = `sub-tab ${index === currentSubIndex ? 'active' : ''}`;
      btn.innerText = item.title;
      btn.onclick = () => {
        currentSubIndex = index;
        currentSlideIndex = 0; 
        renderSubMenu();       
        renderSlide();         
      };
      subSidebar.appendChild(btn);
    });
  }

  function renderSlide() {
    const slideData = tutorialData[currentCategory][currentSubIndex].slides;
    const currentSlide = slideData[currentSlideIndex];

    displayImage.src = currentSlide.img;
    displayTitle.innerText = currentSlide.subtitle;
    displayDesc.innerText = currentSlide.desc;

    dotsWrapper.innerHTML = '';
    slideData.forEach((_, idx) => {
      const dot = document.createElement('div');
      dot.className = `dot ${idx === currentSlideIndex ? 'active' : ''}`;
      dotsWrapper.appendChild(dot);
    });

    if (slideData.length <= 1) {
      prevBtn.style.visibility = 'hidden';
      nextBtn.style.visibility = 'hidden';
    } else {
      prevBtn.style.visibility = currentSlideIndex === 0 ? 'hidden' : 'visible';
      nextBtn.style.visibility = currentSlideIndex === slideData.length - 1 ? 'hidden' : 'visible';
      
      prevBtn.style.cursor = currentSlideIndex === 0 ? 'default' : 'pointer';
      nextBtn.style.cursor = currentSlideIndex === slideData.length - 1 ? 'default' : 'pointer';
      prevBtn.style.opacity = '0.6';
      prevBtn.style.opacity = '0.6';
    }
  }

  prevBtn.onclick = () => {
    if (currentSlideIndex > 0) {
      currentSlideIndex--;
      renderSlide();
    }
  };
  
  nextBtn.onclick = () => {
    const maxSlides = tutorialData[currentCategory][currentSubIndex].slides.length;
    if (currentSlideIndex < maxSlides - 1) {
      currentSlideIndex++;
      renderSlide();
    }
  };

  document.querySelectorAll('.main-tab').forEach(tab => {
    tab.onclick = (e) => {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
      e.currentTarget.classList.add('active');
      
      currentCategory = e.currentTarget.getAttribute('data-category');
      currentSubIndex = 0;
      currentSlideIndex = 0;
      
      renderSubMenu();
      renderSlide();
    };
  });

  renderSubMenu();
  renderSlide();
</script>
</body>
</html>
