<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>接住小瓶 - 秘密海域 (防作弊安全版)</title>

    <link rel="stylesheet" href="test.css?v=99" />

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #001528;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
        font-family: "PingFang TC", sans-serif;
      }

      #gameCanvas {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        box-shadow: 0 0 30px rgba(77, 166, 255, 0.3);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        display: block;
        max-width: 100%;
        max-height: 100%;
      }

      #game-ui {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 600px;
        display: flex;
        justify-content: space-between;
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        z-index: 10;
      }

      .ui-box {
        background: rgba(0, 0, 0, 0.4);
        padding: 5px 15px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 20, 40, 0.85);
        backdrop-filter: blur(5px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 20;
        color: white;
        text-align: center;
      }

      .overlay h1 {
        font-size: 4rem;
        color: #4da6ff;
        text-shadow: 0 0 20px rgba(77, 166, 255, 0.8);
        margin-bottom: 30px;
        font-weight: 900;
        letter-spacing: 2px;
      }

      .btn-action {
        background: linear-gradient(135deg, #4da6ff, #0066cc);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.2);
        padding: 20px 70px;
        font-size: 1.8rem;
        font-weight: 900;
        border-radius: 50px;
        cursor: pointer;
        box-shadow:
          0 10px 25px rgba(0, 102, 204, 0.5),
          inset 0 2px 5px rgba(255, 255, 255, 0.3);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        margin: 20px;
        letter-spacing: 2px;
      }
      .btn-action:hover {
        transform: scale(1.08) translateY(-5px);
        background: linear-gradient(135deg, #66b3ff, #005bb5);
        box-shadow:
          0 15px 35px rgba(77, 166, 255, 0.7),
          inset 0 2px 5px rgba(255, 255, 255, 0.4);
      }
      .btn-action:active {
        transform: scale(0.95);
      }

      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: white;
        padding: 10px 25px;
        border-radius: 25px;
        cursor: pointer;
        z-index: 30;
        font-weight: bold;
        font-size: 1.1rem;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .diff-selector {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
      }
      .diff-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.8);
        padding: 12px 30px;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        font-size: 1.2rem;
      }
      .diff-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }
      .diff-btn.active-diff {
        background: rgba(77, 166, 255, 0.2);
        border-color: #4da6ff;
        box-shadow:
          0 0 20px rgba(77, 166, 255, 0.6),
          inset 0 0 10px rgba(77, 166, 255, 0.3);
        transform: scale(1.15);
        color: white;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      }

      .info-container {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-bottom: 30px;
        justify-content: center;
      }
      .info-pill {
        background: rgba(0, 0, 0, 0.4);
        padding: 12px 25px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: white;
        font-size: 1.15rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .info-btn {
        background: rgba(255, 255, 255, 0.1);
        padding: 12px 25px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: white;
        font-size: 1.15rem;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: bold;
      }
      .info-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-2px);
      }

      .rules-box {
        display: none;
        background: rgba(0, 20, 40, 0.8);
        padding: 20px 30px;
        border-radius: 20px;
        border: 1px solid rgba(77, 166, 255, 0.4);
        margin-bottom: 30px;
        text-align: left;
        font-size: 1.1rem;
        line-height: 1.8;
        animation: slideDownFade 0.3s ease;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        color: #d1e8ff;
      }

      .float-br-btn {
        position: absolute;
        bottom: 40px;
        right: 40px;
        padding: 15px 30px;
        border-radius: 35px;
        font-weight: bold;
        font-size: 1.2rem;
        cursor: pointer;
        color: white;
        background: rgba(10, 35, 65, 0.8);
        border: 2px solid rgba(77, 166, 255, 0.5);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        z-index: 30;
        transition: all 0.3s;
        backdrop-filter: blur(5px);
      }
      .float-br-btn:hover {
        transform: scale(1.05) translateY(-3px);
        background: rgba(77, 166, 255, 0.3);
        border-color: #4da6ff;
        box-shadow: 0 12px 30px rgba(77, 166, 255, 0.4);
      }

      .leaderboard-panel {
        background: rgba(10, 35, 65, 0.95);
        border: 2px solid rgba(77, 166, 255, 0.6);
        border-radius: 25px;
        padding: 30px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      }
      .leaderboard-item {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
        font-size: 1.2rem;
      }
      .leaderboard-item:last-child {
        border-bottom: none;
      }
      .rank-1 {
        color: #ffd700;
        font-weight: bold;
        font-size: 1.3rem;
      }
      .rank-2 {
        color: #c0c0c0;
        font-weight: bold;
      }
      .rank-3 {
        color: #cd7f32;
        font-weight: bold;
      }

      /* 🌐 語言切換按鈕樣式 */
      .lang-toggle-btn {
        position: fixed;
        top: 25px;
        right: 25px;
        background: rgba(0, 85, 165, 0.6);
        backdrop-filter: blur(8px);
        border: 1px solid #4da6ff;
        color: #fff;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.95rem;
        z-index: 100;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      }
      .lang-toggle-btn:hover {
        background: #0073e6;
        color: #ffcc00;
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(0, 115, 230, 0.5);
      }

      @media screen and (max-width: 768px) {
        .float-br-btn {
          bottom: 20px;
          right: 20px;
          padding: 12px 20px;
          font-size: 1rem;
        }
        .btn-action {
          padding: 15px 50px;
          font-size: 1.5rem;
        }
        .overlay h1 {
          font-size: 3rem;
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes slideDownFade {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <!-- 🌐 右上角中英切換按鈕 -->
    <button
      id="lang-toggle-btn"
      class="lang-toggle-btn"
      onclick="toggleLanguage()"
    >
      🌐 EN
    </button>

    <button
      id="main-back-btn"
      class="back-btn"
      onclick="handleLeave()"
      data-i18n="back-to-lobby"
    >
      🔙 回到大廳
    </button>

    <div id="game-ui" style="display: none">
      <div class="ui-box">分數: <span id="score">0</span></div>
      <div class="ui-box">⏳ <span id="time">30</span>s</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="overlay">
      <h1 data-i18n="game-title">🤲 接住小瓶</h1>

      <div class="diff-selector">
        <button
          id="btn-diff-easy"
          class="diff-btn"
          onclick="setDifficulty('easy')"
          data-i18n="diff-easy"
        >
          🟢 簡單
        </button>
        <button
          id="btn-diff-normal"
          class="diff-btn active-diff"
          onclick="setDifficulty('normal')"
          data-i18n="diff-normal"
        >
          🟡 普通
        </button>
        <button
          id="btn-diff-hard"
          class="diff-btn"
          onclick="setDifficulty('hard')"
          data-i18n="diff-hard"
        >
          🔴 困難
        </button>
      </div>

      <div class="info-container">
        <div class="info-pill">
          👑 <span id="diff-label">普通</span
          ><span data-i18n="high-score"> 最高分：</span
          ><span
            id="personal-high-score"
            style="color: #ffd700; font-weight: 900; font-size: 1.5rem"
            >0</span
          >
        </div>
        <button class="info-btn" onclick="toggleRules()" data-i18n="game-rules">
          📖 遊戲說明
        </button>
      </div>

      <div id="rules-box" class="rules-box">
        🍾 <b>漂流瓶</b>：+10 分 ｜ 💣 <b>炸彈</b>：-15 分<br />
        <span style="color: #ffd700">🌟 <b>雙倍星</b>：3秒內得分 x2！</span
        ><br />
        <span style="color: #4da6ff"
          >🛡️ <b>無敵護盾</b>：破裂前可抵擋1次炸彈！</span
        >
      </div>

      <button class="btn-action" onclick="startGame()" data-i18n="start-game">
        開始遊戲
      </button>

      <button
        class="float-br-btn btn-show-leaderboard"
        onclick="showLeaderboard()"
      >
        🏆 看 [普通] 排行榜
      </button>
    </div>

    <div id="game-over-screen" class="overlay" style="display: none">
      <h1
        data-i18n="game-over"
        style="
          font-size: 4rem;
          color: #ffeb3b;
          text-shadow: 0 0 20px rgba(255, 235, 59, 0.6);
        "
      >
        時間到！
      </h1>
      <p style="font-size: 1.4rem; color: #d1e8ff; margin-bottom: 25px">
        <span data-i18n="score-text-1">你的 </span
        ><span id="gameover-diff-label">普通</span
        ><span data-i18n="score-text-2"> 總得分是：</span><br /><span
          id="final-score"
          style="
            font-size: 4.5rem;
            color: #ffeb3b;
            font-weight: 900;
            text-shadow: 0 0 25px rgba(255, 235, 59, 0.8);
          "
          >0</span
        >
        分
      </p>

      <div
        id="new-record-msg"
        style="
          display: none;
          color: #4da6ff;
          font-weight: bold;
          font-size: 1.5rem;
          margin-bottom: 30px;
          animation: pulse 1s infinite;
        "
      >
        🎉 恭喜破紀錄啦！🎉
      </div>

      <button class="btn-action" onclick="resetGame()" data-i18n="play-again">
        再玩一次
      </button>

      <button
        class="float-br-btn btn-show-leaderboard"
        onclick="showLeaderboard()"
      >
        🏆 看 [普通] 排行榜
      </button>
    </div>

    <div
      id="leaderboard-screen"
      class="overlay"
      style="display: none; z-index: 50"
    >
      <div class="leaderboard-panel">
        <h2
          id="leaderboard-title"
          style="
            margin-top: 0;
            color: #4da6ff;
            font-size: 2rem;
            text-align: center;
          "
        >
          🏆 排行榜
        </h2>
        <div id="leaderboard-list"></div>
        <button
          class="btn-action btn-secondary"
          style="
            margin: 30px 0 0 0;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 15px;
            box-shadow: none;
            letter-spacing: 2px;
          "
          onclick="closeLeaderboard()"
          data-i18n="close-btn"
        >
          關閉
        </button>
      </div>
    </div>

    <script>
      const API_BASE_URL = "https://api.drift-bottles.xyz";
      const GAME_NAME = "catch-bottle";

      // =========================================
      // 🌐 多國語言 (i18n) 字典與切換邏輯
      // =========================================
      const translations = {
        zh: {
          "toggle-btn": "🌐 EN",
          "back-to-lobby": "🔙 回到大廳",
          "quit-game": "🔙 放棄遊戲",
          "back-to-diff": "🔙 回難度選擇",
          "game-title": "🤲 接住小瓶",
          "diff-easy": "🟢 簡單",
          "diff-normal": "🟡 普通",
          "diff-hard": "🔴 困難",
          "game-rules": "📖 遊戲說明",
          "start-game": "開始遊戲",
          "game-over": "時間到！",
          "play-again": "再玩一次",
          "close-btn": "關閉",
          // 👇 新增的動態翻譯詞彙
          "high-score": " 最高分：",
          "leaderboard-btn": "🏆 看 [{diff}] 排行榜",
          "leaderboard-title": "🏆 [{diff}] 排行榜",
          "diff-easy-label": "簡單",
          "diff-normal-label": "普通",
          "diff-hard-label": "困難",
          "score-text-1": "你的 ",
          "score-text-2": " 總得分是：",
        },
        en: {
          "toggle-btn": "🌐 中文",
          "back-to-lobby": "🔙 Lobby",
          "quit-game": "🔙 Quit",
          "back-to-diff": "🔙 Back",
          "game-title": "🤲 Catch Bottle",
          "diff-easy": "🟢 Easy",
          "diff-normal": "🟡 Normal",
          "diff-hard": "🔴 Hard",
          "game-rules": "📖 Rules",
          "start-game": "Start Game",
          "game-over": "Time's Up!",
          "play-again": "Play Again",
          "close-btn": "Close",
          // 👇 新增的動態翻譯詞彙
          "high-score": " High Score: ",
          "leaderboard-btn": "🏆 [{diff}] Leaderboard",
          "leaderboard-title": "🏆 [{diff}] Leaderboard",
          "diff-easy-label": "Easy",
          "diff-normal-label": "Normal",
          "diff-hard-label": "Hard",
          "score-text-1": "Your ",
          "score-text-2": " total score is:",
        },
      };

      let currentLang = localStorage.getItem("game_lang") || "zh";

      function applyTranslations() {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (translations[currentLang][key]) {
            el.innerHTML = translations[currentLang][key];
          }
        });

        const toggleBtn = document.getElementById("lang-toggle-btn");
        if (toggleBtn) {
          toggleBtn.innerText = translations[currentLang]["toggle-btn"];
        }

        // 🌟 切換語言時，強制更新一次動態的排行榜與難度文字
        setDifficulty(currentDifficulty);
      }

      window.toggleLanguage = function () {
        currentLang = currentLang === "zh" ? "en" : "zh";
        localStorage.setItem("game_lang", currentLang);
        applyTranslations();
      };

      document.addEventListener("DOMContentLoaded", applyTranslations);

      // 🛡️ 招式一：防外掛專用「計時與分數私有管理員」
      const ScoreManager = (() => {
        let _score = 0;
        let _lastAdd = 0;

        return {
          add: (pts) => {
            const now = Date.now();
            if (now - _lastAdd < 50 && pts > 50) {
              console.warn("🚨 系統偵測到異常外掛操作，已自動歸零積分！");
              _score = 0;
            } else {
              _score += pts;
            }
            _lastAdd = now;
            document.getElementById("score").innerText = _score;
          },
          sub: (pts) => {
            _score -= pts;
            document.getElementById("score").innerText = _score;
          },
          get: () => _score,
          reset: () => {
            _score = 0;
            _lastAdd = Date.now();
            document.getElementById("score").innerText = _score;
          },
        };
      })();

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      let timeLeft = 30;
      let gameInterval, dropInterval, timerInterval;
      let isPlaying = false;
      let items = [];

      let isDoubleScore = false;
      let isShielded = false;
      let doubleTimer = null;
      let shieldTimer = null;
      let isPaused = false;

      let currentDifficulty = "normal";

      const diffConfig = {
        easy: {
          label: "簡單",
          spawnRate: 800,
          speedBase: 2,
          speedRand: 2.5,
          bombChance: 0.1,
        },
        normal: {
          label: "普通",
          spawnRate: 600,
          speedBase: 3.5,
          speedRand: 3,
          bombChance: 0.22,
        },
        hard: {
          label: "困難",
          spawnRate: 350,
          speedBase: 5,
          speedRand: 4,
          bombChance: 0.4,
        },
      };

      const player = { x: 0, y: 0, width: 80, height: 80, emoji: "🧺" };

      window.onload = () => {
        setDifficulty("normal");
      };

      function toggleRules() {
        const rulesBox = document.getElementById("rules-box");
        rulesBox.style.display =
          rulesBox.style.display === "none" ? "block" : "none";
      }

      function handleLeave() {
        const startScreen = document.getElementById("start-screen");

        if (startScreen.style.display === "none") {
          isPlaying = false;
          clearInterval(dropInterval);
          clearInterval(timerInterval);
          clearTimeout(doubleTimer);
          clearTimeout(shieldTimer);

          document.getElementById("game-ui").style.display = "none";
          document.getElementById("game-over-screen").style.display = "none";
          document.getElementById("leaderboard-screen").style.display = "none";
          document.getElementById("rules-box").style.display = "none";

          startScreen.style.display = "flex";

          // 🌐 動態翻譯
          document.getElementById("main-back-btn").innerHTML =
            translations[currentLang]["back-to-lobby"];
        } else {
          window.location.href = "games.html";
        }
      }

      async function setDifficulty(level) {
        currentDifficulty = level;
        // 🌟 從字典抓出當前語言的難度名稱 (例如: "普通" 或 "Normal")
        const translatedLabel =
          translations[currentLang][`diff-${level}-label`];

        document
          .querySelectorAll(".diff-btn")
          .forEach((btn) => btn.classList.remove("active-diff"));
        document
          .getElementById("btn-diff-" + level)
          .classList.add("active-diff");

        // 更新畫面上的難度標籤
        document.getElementById("diff-label").innerText = translatedLabel;
        document.getElementById("gameover-diff-label").innerText =
          translatedLabel;

        // 🌟 更新所有排行榜按鈕，把 {diff} 替換成真正的難度名稱
        const btnTemplate = translations[currentLang]["leaderboard-btn"];
        document.querySelectorAll(".btn-show-leaderboard").forEach((btn) => {
          btn.innerText = btnTemplate.replace("{diff}", translatedLabel);
        });

        const scoreDisplay = document.getElementById("personal-high-score");
        scoreDisplay.innerText = "...";

        try {
          const token = localStorage.getItem("authToken");
          const response = await fetch(
            `${API_BASE_URL}/game/${GAME_NAME}/${level.toUpperCase()}`,
            {
              method: "GET",
              headers: { Authorization: `Bearer ${token}` },
            },
          );

          if (response.ok) {
            const rawData = await response.json();
            let myHighScore = 0;
            if (rawData.high_score !== undefined)
              myHighScore = rawData.high_score;
            else if (rawData.data && rawData.data.high_score !== undefined)
              myHighScore = rawData.data.high_score;
            else if (rawData.score !== undefined) myHighScore = rawData.score;
            else if (rawData.data && rawData.data.score !== undefined)
              myHighScore = rawData.data.score;
            scoreDisplay.innerText = myHighScore;
          } else {
            scoreDisplay.innerText =
              localStorage.getItem("catchBottleHighScore_" + level) || 0;
          }
        } catch (error) {
          console.error("無法取得最高分:", error);
          scoreDisplay.innerText =
            localStorage.getItem("catchBottleHighScore_" + level) || 0;
        }
      }

      function resizeCanvas() {
        const maxWidth = Math.min(window.innerWidth - 20, 600);
        const maxHeight = window.innerHeight - 40;
        canvas.width = maxWidth;
        canvas.height = maxHeight;
        player.y = canvas.height - player.height - 20;
        if (!isPlaying) player.x = canvas.width / 2 - player.width / 2;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function movePlayer(e) {
        if (!isPlaying) return;
        let clientX = e.type.includes("touch")
          ? e.touches[0].clientX
          : e.clientX;
        const rect = canvas.getBoundingClientRect();
        let newX = clientX - rect.left - player.width / 2;
        if (newX < 0) newX = 0;
        if (newX + player.width > canvas.width)
          newX = canvas.width - player.width;
        player.x = newX;
      }
      canvas.addEventListener("mousemove", movePlayer);
      canvas.addEventListener("touchmove", movePlayer, { passive: false });

      class Item {
        constructor() {
          this.size = 40;
          this.x = Math.random() * (canvas.width - this.size);
          this.y = -this.size;

          let conf = diffConfig[currentDifficulty];
          this.speed = Math.random() * conf.speedRand + conf.speedBase;

          const rand = Math.random();
          if (rand > 0.9) {
            this.type = rand > 0.95 ? "shield" : "double";
            this.emoji = this.type === "shield" ? "🛡️" : "🌟";
          } else {
            this.type = rand < conf.bombChance ? "bomb" : "bottle";
            this.emoji = this.type === "bottle" ? "🍾" : "💣";
          }
        }
        draw() {
          ctx.font = `${this.size}px Arial`;
          ctx.fillText(this.emoji, this.x, this.y + this.size);
        }
        update() {
          this.y += this.speed;
        }
      }

      function gameLoop() {
        if (!isPlaying) return;

        if (isPaused) {
          requestAnimationFrame(gameLoop);
          return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (isShielded) {
          ctx.beginPath();
          ctx.arc(
            player.x + player.width / 2,
            player.y + player.height / 2 + 5,
            player.width / 1.4,
            0,
            Math.PI * 2,
          );
          ctx.strokeStyle = "#4da6ff";
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 8]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        if (isDoubleScore) {
          ctx.beginPath();
          ctx.arc(
            player.x + player.width / 2,
            player.y + player.height / 2 + 5,
            player.width / 1.1,
            0,
            Math.PI * 2,
          );
          ctx.strokeStyle = "rgba(255, 215, 0, 0.8)";
          ctx.lineWidth = 4;
          ctx.setLineDash([10, 10]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.fillStyle = "white";
        ctx.strokeStyle = "transparent";

        ctx.font = `${player.width}px Arial`;
        ctx.fillText(player.emoji, player.x, player.y + player.height);

        for (let i = 0; i < items.length; i++) {
          let item = items[i];
          item.update();
          item.draw();

          if (
            item.y + item.size > player.y + 20 &&
            item.x + item.size > player.x &&
            item.x < player.x + player.width
          ) {
            if (item.type === "shield") {
              isShielded = true;
              showFloatingText("護盾啟動!", item.x, item.y, "#4da6ff");
              clearTimeout(shieldTimer);
            } else if (item.type === "double") {
              isDoubleScore = true;
              showFloatingText("雙倍積分!", item.x, item.y, "#ffd700");
              clearTimeout(doubleTimer);
              doubleTimer = setTimeout(() => (isDoubleScore = false), 3000);
            } else if (item.type === "bomb") {
              if (isShielded) {
                showFloatingText("護盾破裂!", item.x, item.y, "#4da6ff");
                isShielded = false;
                clearTimeout(shieldTimer);
              } else {
                ScoreManager.sub(15);
                showFloatingText("-15", item.x, item.y, "#ff4d4d");
              }
            } else if (item.type === "bottle") {
              let pts = isDoubleScore ? 20 : 10;
              ScoreManager.add(pts);
              showFloatingText(
                `+${pts}`,
                item.x,
                item.y,
                isDoubleScore ? "#ffd700" : "#4da6ff",
              );
            }

            items.splice(i, 1);
            i--;
            continue;
          }
          if (item.y > canvas.height) {
            items.splice(i, 1);
            i--;
          }
        }
        requestAnimationFrame(gameLoop);
      }

      function showFloatingText(text, x, y, color) {
        const el = document.createElement("div");
        el.innerText = text;
        el.style.position = "absolute";
        el.style.left = `${x + canvas.getBoundingClientRect().left}px`;
        el.style.top = `${y + canvas.getBoundingClientRect().top}px`;
        el.style.color = color;
        el.style.fontWeight = "bold";
        el.style.fontSize = "1.6rem";
        el.style.pointerEvents = "none";
        el.style.transition = "all 0.8s ease-out";
        el.style.zIndex = "50";
        el.style.textShadow = "0 2px 4px rgba(0,0,0,0.8)";
        document.body.appendChild(el);
        setTimeout(() => {
          el.style.top = `${y - 50 + canvas.getBoundingClientRect().top}px`;
          el.style.opacity = "0";
        }, 50);
        setTimeout(() => el.remove(), 800);
      }

      function startGame() {
        document.getElementById("start-screen").style.display = "none";
        document.getElementById("game-over-screen").style.display = "none";
        document.getElementById("game-ui").style.display = "flex";
        document.getElementById("rules-box").style.display = "none";

        // 🌐 動態翻譯
        document.getElementById("main-back-btn").innerHTML =
          translations[currentLang]["quit-game"];

        ScoreManager.reset();
        timeLeft = 30;
        items = [];
        isPlaying = true;
        isPaused = false;
        let overlay = document.getElementById("pause-overlay");
        if (overlay) overlay.remove();
        isDoubleScore = false;
        isShielded = false;
        clearTimeout(doubleTimer);
        clearTimeout(shieldTimer);

        document.getElementById("time").innerText = timeLeft;

        let spawnRate = diffConfig[currentDifficulty].spawnRate;
        dropInterval = setInterval(() => {
          if (!isPaused) items.push(new Item());
        }, spawnRate);

        timerInterval = setInterval(() => {
          if (!isPaused) {
            timeLeft--;
            document.getElementById("time").innerText = timeLeft;
            if (timeLeft <= 0) endGame();
          }
        }, 1000);
        gameLoop();
      }

      function endGame() {
        isPlaying = false;
        clearInterval(dropInterval);
        clearInterval(timerInterval);
        clearTimeout(doubleTimer);
        clearTimeout(shieldTimer);

        const finalScore = ScoreManager.get();

        document.getElementById("game-ui").style.display = "none";
        document.getElementById("game-over-screen").style.display = "flex";
        document.getElementById("final-score").innerText = finalScore;

        // 🌐 動態翻譯
        document.getElementById("main-back-btn").innerHTML =
          translations[currentLang]["back-to-diff"];

        processScore(finalScore);
      }

      async function processScore(finalScore) {
        const token = localStorage.getItem("authToken");

        try {
          const response = await fetch(`${API_BASE_URL}/game/${GAME_NAME}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              difficulty: currentDifficulty.toUpperCase(),
              score: finalScore,
            }),
          });

          if (response.ok) {
            console.log("上傳分數成功！");
            setDifficulty(currentDifficulty);
          }
        } catch (error) {
          console.error("分數上傳失敗:", error);
        }

        let keyHigh = "catchBottleHighScore_" + currentDifficulty;
        let highScore = parseInt(localStorage.getItem(keyHigh) || "0");
        if (finalScore > highScore) {
          localStorage.setItem(keyHigh, finalScore);
          document.getElementById("new-record-msg").style.display = "block";
        } else {
          document.getElementById("new-record-msg").style.display = "none";
        }
      }

      async function showLeaderboard() {
        // 🌟 讓排行榜標題也支援多國語言
        const translatedLabel =
          translations[currentLang][`diff-${currentDifficulty}-label`];
        const titleTemplate = translations[currentLang]["leaderboard-title"];
        document.getElementById("leaderboard-title").innerText =
          titleTemplate.replace("{diff}", translatedLabel);

        const listContainer = document.getElementById("leaderboard-list");
        listContainer.innerHTML =
          '<div style="color: #fff; text-align: center; padding: 20px 0;">連線抓取中... 🌊</div>';
        document.getElementById("leaderboard-screen").style.display = "flex";

        try {
          const token = localStorage.getItem("authToken");
          const response = await fetch(
            `${API_BASE_URL}/game/${GAME_NAME}/${currentDifficulty.toUpperCase()}/ranking?limit=5`,
            {
              method: "GET",
              headers: { Authorization: `Bearer ${token}` },
            },
          );

          if (response.ok) {
            const rawData = await response.json();
            let leaderboard = [];
            if (Array.isArray(rawData)) leaderboard = rawData;
            else if (rawData.data && Array.isArray(rawData.data))
              leaderboard = rawData.data;
            else if (rawData.ranking && Array.isArray(rawData.ranking))
              leaderboard = rawData.ranking;

            if (!leaderboard || leaderboard.length === 0) {
              listContainer.innerHTML =
                '<div style="color: #aaa; text-align: center; padding: 20px 0;">目前這個難度還沒有人挑戰喔，快來搶榜首！</div>';
            } else {
              let html = "";
              const medals = ["🥇", "🥈", "🥉"];
              leaderboard.forEach((entry, index) => {
                let rankClass = index < 3 ? `rank-${index + 1}` : "";
                let rankIcon =
                  index < 3
                    ? medals[index]
                    : `&nbsp;&nbsp;${index + 1}&nbsp;&nbsp;`;
                let playerName =
                  entry.name ||
                  entry.username ||
                  entry.nickname ||
                  entry.member_name ||
                  (entry.member && entry.member.name) ||
                  (entry.user && entry.user.name) ||
                  "匿名玩家";
                let playerScore = entry.high_score || 0;
                html += `
                  <div class="leaderboard-item ${rankClass}">
                      <span>${rankIcon} ${playerName}</span>
                      <span>${playerScore} 分</span>
                  </div>
                `;
              });
              listContainer.innerHTML = html;
            }
          } else {
            listContainer.innerHTML =
              '<div style="color: #ff4d4d; text-align: center; padding: 20px 0;">連線被拒絕 (403)，請確認是否已登入！</div>';
          }
        } catch (error) {
          console.error("取得排行榜失敗:", error);
          listContainer.innerHTML =
            '<div style="color: #ff4d4d; text-align: center; padding: 20px 0;">伺服器無回應，請稍後再試。</div>';
        }
      }

      function closeLeaderboard() {
        document.getElementById("leaderboard-screen").style.display = "none";
      }
      function resetGame() {
        startGame();
      }

      function triggerPause() {
        if (!isPlaying || isPaused) return;

        isPaused = true;

        if (document.getElementById("pause-overlay")) return;

        let pauseOverlay = document.createElement("div");
        pauseOverlay.id = "pause-overlay";
        pauseOverlay.style.cssText =
          "position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,20,40,0.85);backdrop-filter:blur(5px);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;";

        // 這裡的文字也可以接翻譯，但為求簡單先維持中文
        pauseOverlay.innerHTML = `
    <h1 style="font-size:3.5rem;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,0.8);margin-bottom:20px;margin-top:0;">⏸️ 遊戲已暫停</h1>
    <p style="font-size:1.4rem;color:#d1e8ff;margin-bottom:30px;">你剛剛切換了分頁，遊戲已自動為你凍結！</p>
    <button class="btn-action" onclick="resumeFromPause()">▶️ 繼續遊戲</button>
  `;

        document.body.appendChild(pauseOverlay);
        console.log("⏸️ 離開視窗，已凍結遊戲！");
      }

      function resumeFromPause() {
        isPaused = false;
        let overlay = document.getElementById("pause-overlay");
        if (overlay) overlay.remove();
        console.log("▶️ 遊戲繼續！");
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          triggerPause();
        }
      });
    </script>
  </body>
</html>
