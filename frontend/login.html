<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>心情漂流瓶 - 登入與註冊</title>
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="login-container">
      <img src="images/background.png" class="bg-img" alt="背景" />
      
      <div class="css-bubbles">
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
      </div>

      <div class="enter-btn-container" onclick="openAuthModal()">
        <img src="images/fish_logo.png" style="width: 80px; margin-bottom: 10px" />
        <h2>開啟漂流瓶</h2>
        <p>點擊登入 / 註冊</p>
      </div>
    </div>

    <div id="auth-modal" class="cute-modal" style="display: none">
      <div class="cute-modal-content">
        <span class="close-btn" onclick="closeAuthModal()">&times;</span>

        <div class="tab-container" id="main-tabs">
          <div class="tab active" id="tab-login" onclick="switchTab('login')">登入</div>
          <div class="tab" id="tab-register" onclick="switchTab('register')">註冊</div>
        </div>

        <form id="login-form" class="auth-form bubble-layout" onsubmit="event.preventDefault(); processLogin();">
          <div class="bg-watermark">心情漂流瓶</div>
          
          <div class="b-row">
            <div class="b-item b-pill" style="width: 100%;">
              <label>信箱 (Email):</label>
              <input type="email" id="login-email" required />
            </div>
          </div>
          
          <div class="b-row">
            <div class="b-item b-pill" style="width: 100%;">
              <label>密碼 (Password):</label>
              <div class="password-wrapper">
                <input type="password" id="login-password" required style="padding-right:35px !important;" />
                <span class="toggle-password" onclick="togglePassword('login-password', this)" style="right: 5px;">
                  <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
              </div>
            </div>
          </div>
          
          <div class="b-row">
            <div class="b-item b-pill" style="flex: 1.5;">
              <label>圖形驗證碼:</label>
              <input type="text" id="captcha-input" required />
              <input type="hidden" id="captcha-id" />
            </div>
            <div class="b-item b-captcha-img" style="flex: 1;" onclick="loadCaptcha()" title="看不清楚？點擊換一張">
              <div id="captcha-container"><span>載入中...</span></div>
            </div>
          </div>

          <div style="width: 100%; text-align: right; padding-right: 15px; margin-top: -5px; z-index: 10;">
            <a href="#" onclick="switchTab('forgot')" style="color: #004b87; font-size: 0.85rem; text-decoration: none; font-weight: bold;">忘記密碼？</a>
          </div>

          <button type="submit" class="b-check-btn" title="確認登入">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </form>

        <form id="register-form" class="auth-form bubble-layout" style="display: none" onsubmit="event.preventDefault(); processRegister();">
          <div class="bg-watermark">心情漂流瓶</div>

          <div class="b-row">
            <div class="b-item b-circle">
              <label>暱稱:</label>
              <input type="text" id="reg-name" required />
            </div>
            <div class="b-item b-circle"> 
              <label>性別:</label>
              <select id="reg-gender">
                <option value="生理男">生理男</option>
                <option value="生理女">生理女</option>
                <option value="秘密">秘密</option>
              </select>
            </div>
            <div class="b-item b-circle">
              <label>生日:</label>
              <input type="date" id="reg-birthday" />
            </div>
          </div>

          <div class="b-row">
            <div class="b-item b-pill" style="flex: 1.3;">
              <label>GMAIL:</label>
              <input type="email" id="reg-email" required />
            </div>
            <div class="b-item b-circle" style="flex: 0.7;"> 
              <label>星座:</label>
              <select id="reg-zodiac">
                <option value="">不透露</option>
                <option value="牡羊座">牡羊座</option>
                <option value="金牛座">金牛座</option>
                <option value="雙子座">雙子座</option>
                <option value="巨蟹座">巨蟹座</option>
                <option value="獅子座">獅子座</option>
                <option value="處女座">處女座</option>
                <option value="天秤座">天秤座</option>
                <option value="天蠍座">天蠍座</option>
                <option value="射手座">射手座</option>
                <option value="摩羯座">摩羯座</option>
                <option value="水瓶座">水瓶座</option>
                <option value="雙魚座">雙魚座</option>
              </select>
            </div>
          </div>

          <div class="b-row">
            <div class="b-item b-pill" style="width: 100%;">
              <label>密碼:</label>
              <div class="password-wrapper">
                <input type="password" id="reg-password" required style="padding-right: 30px !important;" />
                <span class="toggle-password" onclick="togglePassword('reg-password', this)" style="right: 5px;">
                  <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
              </div>
            </div>
          </div>

          <div class="b-row">
            <div class="b-item b-rect">
              <label>自我介紹:</label>
              <textarea id="reg-bio" rows="2"></textarea>
            </div>
          </div>

          <button type="submit" class="b-check-btn" title="送出註冊">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </form>

        <form id="forgot-form" class="auth-form bubble-layout" style="display: none; align-items: center;" onsubmit="event.preventDefault(); processForgotPassword();">
          <div class="bg-watermark">心情漂流瓶</div>
          <h2 style="color: #004b87; margin-top: 20px; margin-bottom: 10px; font-weight: 900; letter-spacing: 2px;">找回密碼</h2>
          <p style="color: #004b87; font-size: 0.95rem; text-align: center; font-weight: bold; margin-bottom: 25px; line-height: 1.5;">請輸入你註冊時使用的信箱，<br>我們將發送驗證碼給你。</p>
          
          <div class="b-row" style="width: 100%;">
            <div class="b-item b-pill" style="width: 100%;">
              <label>信箱 (Email):</label>
              <input type="email" id="forgot-email" required />
            </div>
          </div>
          
          <div style="text-align: center; margin-top: 15px; z-index: 10;">
            <a href="#" onclick="switchTab('login')" style="color: #004b87; font-size: 0.9rem; font-weight: bold; text-decoration: none;">返回登入</a>
          </div>

          <button type="submit" class="b-check-btn" title="發送驗證碼" style="margin-top: 20px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </form>
        
        <form id="reset-form" class="auth-form bubble-layout" style="display: none; align-items: center;" onsubmit="event.preventDefault(); processResetPassword();">
          <div class="bg-watermark">心情漂流瓶</div>
          <h2 style="color: #004b87; margin-top: 20px; margin-bottom: 10px; font-weight: 900; letter-spacing: 2px;">設定新密碼</h2>
          <p style="color: #004b87; font-size: 0.95rem; text-align: center; font-weight: bold; margin-bottom: 25px;">請輸入信件中的驗證碼與新密碼。</p>
          
          <div class="b-row" style="width: 100%;">
            <div class="b-item b-pill" style="width: 100%;">
              <label>驗證碼 (Token):</label>
              <input type="text" id="reset-token" required />
            </div>
          </div>
          <div class="b-row" style="width: 100%;">
            <div class="b-item b-pill" style="width: 100%;">
              <label>新密碼 (New Password):</label>
              <div class="password-wrapper">
                <input type="password" id="reset-password" required style="padding-right:35px !important;" />
                <span class="toggle-password" onclick="togglePassword('reset-password', this)" style="right: 5px;">
                  <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
              </div>
            </div>
          </div>

          <div style="text-align: center; margin-top: 15px; z-index: 10;">
            <a href="#" onclick="switchTab('login')" style="color: #004b87; font-size: 0.9rem; font-weight: bold; text-decoration: none;">返回登入</a>
          </div>

          <button type="submit" class="b-check-btn" title="確認重設" style="margin-top: 20px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        </form>
      </div>
    </div>

    <script>
      const API_BASE_URL = "https://163.17.135.120";

      function openAuthModal() { document.getElementById("auth-modal").style.display = "flex"; clearErrorMessage(); }
      function closeAuthModal() { document.getElementById("auth-modal").style.display = "none"; clearErrorMessage(); }
      function clearErrorMessage() { const errorEl = document.getElementById("modal-error-msg"); if (errorEl) errorEl.remove(); }
      
      function showModalError(message) {
        clearErrorMessage();
        const errorDiv = document.createElement("div");
        errorDiv.id = "modal-error-msg";
        errorDiv.style.cssText = `background: rgba(255, 77, 77, 0.15); border: 1px solid #ff4d4d; color: #ff4d4d; padding: 10px; border-radius: 15px; margin-bottom: 10px; font-size: 0.9rem; font-weight: bold; text-align: center; width: 90%; z-index: 10;`;
        errorDiv.innerText = message;
        const tabContainer = document.getElementById("main-tabs");
        tabContainer.parentNode.insertBefore(errorDiv, tabContainer.nextSibling);
      }

      function togglePassword(inputId, iconEl) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          iconEl.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        } else {
          input.type = "password";
          iconEl.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
        }
      }

      function switchTab(tab) {
        clearErrorMessage();
        document.getElementById("login-form").style.display = "none";
        document.getElementById("register-form").style.display = "none";
        document.getElementById("forgot-form").style.display = "none";
        document.getElementById("reset-form").style.display = "none";
        
        const mainTabs = document.getElementById("main-tabs");
        document.getElementById("tab-login").classList.remove("active");
        document.getElementById("tab-register").classList.remove("active");

        if (tab === "login") {
          mainTabs.style.display = "flex"; document.getElementById("tab-login").classList.add("active"); document.getElementById("login-form").style.display = "flex";
        } else if (tab === "register") {
          mainTabs.style.display = "flex"; document.getElementById("tab-register").classList.add("active"); document.getElementById("register-form").style.display = "flex";
        } else if (tab === "forgot") {
          mainTabs.style.display = "none"; document.getElementById("forgot-form").style.display = "flex";
        } else if (tab === "reset") {
          mainTabs.style.display = "none"; document.getElementById("reset-form").style.display = "flex";
        }
      }

      function updateZodiac() {
        const birthdayInput = document.getElementById("reg-birthday").value;
        const zodiacSelect = document.getElementById("reg-zodiac");
        if (!birthdayInput) return;
        const date = new Date(birthdayInput);
        const month = date.getMonth() + 1; 
        const day = date.getDate();
        let zodiac = "";

        if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) zodiac = "牡羊座";
        else if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) zodiac = "金牛座";
        else if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) zodiac = "雙子座";
        else if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) zodiac = "巨蟹座";
        else if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) zodiac = "獅子座";
        else if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) zodiac = "處女座";
        else if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) zodiac = "天秤座";
        else if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) zodiac = "天蠍座";
        else if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) zodiac = "射手座";
        else if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) zodiac = "摩羯座";
        else if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) zodiac = "水瓶座";
        else if ((month == 2 && day >= 19) || (month == 3 && day <= 20)) zodiac = "雙魚座";

        if (zodiac) zodiacSelect.value = zodiac;
      }

      async function loadCaptcha() {
        const container = document.getElementById("captcha-container");
        const idInput = document.getElementById("captcha-id"); 
        try {
          const response = await fetch(`${API_BASE_URL}/captcha`);
          if (!response.ok) throw new Error("驗證碼載入失敗");
          const data = await response.json();
          container.innerHTML = data.image;
          if (idInput) idInput.value = data.captchaId;
        } catch (error) {
          container.innerHTML = "<span style='color:#0055a5; font-weight:bold;'>載入失敗，點擊重試</span>";
        }
      }

      async function processLogin() {
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;
        const captchaId = document.getElementById("captcha-id").value;
        const userInput = document.getElementById("captcha-input").value;

        if (email.trim() === "" || password.trim() === "") { showModalError("⚠️ 請輸入信箱與密碼！"); return; }
        if (userInput.trim() === "") { showModalError("⚠️ 驗證碼錯誤或已過期，請重新輸入"); return; }

        try {
          const response = await fetch(`${API_BASE_URL}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
            body: JSON.stringify({ email: email, password: password, captchaId: captchaId, userInput: userInput }),
          });
          const responseData = await response.json();

          if (response.ok) {
            const realToken = responseData.data?.result?.token || responseData.token || responseData.data?.token;
            const realUser = responseData.data?.result?.member || responseData.user || responseData.data?.user || { email: email, name: email.split("@")[0] };
            localStorage.setItem("authToken", realToken);

            const userToSave = {
              email: realUser.email || email, name: realUser.name || email.split("@")[0], avatar: realUser.avatar || "images/fish_logo.png",
              birthday: realUser.birthday || "", bio: realUser.bio || "", constellation: realUser.constellation || "", role: realUser.role || "USER",
            };
            localStorage.setItem("currentUser", JSON.stringify(userToSave));
            window.location.href = "test.html";
          } else {
            showModalError("❌ 登入失敗：" + (responseData.message || "帳號或密碼錯誤"));
            document.getElementById("captcha-input").value = "";
            loadCaptcha();
          }
        } catch (error) {
          showModalError("📡 無法連接到後端伺服器！");
        }
      }

      async function processRegister() {
        const email = document.getElementById("reg-email").value;
        const password = document.getElementById("reg-password").value;
        const name = document.getElementById("reg-name").value;

        if (email.trim() === "" || name.trim() === "" || password.trim() === "") { showModalError("⚠️ 信箱、姓名和密碼是必填的喔！"); return; }
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z]).{8,16}$/;
        if (!passwordRegex.test(password)) { showModalError("⚠️ 密碼格式錯誤！請設定 8~16 字元，且必須包含大小寫英文。"); return; }

        const birthdayRaw = document.getElementById("reg-birthday").value;
        const finalBirthday = birthdayRaw ? new Date(birthdayRaw).toISOString() : new Date("2000-01-01").toISOString();

        const userData = {
          email: email, password: password, name: name, birthday: finalBirthday,
          bio: document.getElementById("reg-bio").value || "", blood_type: "",
          constellation: document.getElementById("reg-zodiac").value || "",
        };

        try {
          const response = await fetch(`${API_BASE_URL}/auth/register`, {
            method: "POST", headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" }, body: JSON.stringify(userData),
          });
          const data = await response.json();
          if (response.ok) {
            alert("🎉 註冊成功！請登入。"); switchTab("login");
          } else {
            showModalError("❌ 註冊失敗：" + (data.message || "信箱已存在或格式錯誤"));
          }
        } catch (error) {
          showModalError("📡 無法連接到後端伺服器！");
        }
      }

      async function processForgotPassword() {
        const email = document.getElementById("forgot-email").value;
        if (email.trim() === "") { alert("請填寫信箱！"); return; }
        try {
          const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: email }) });
          if (response.ok) { alert("✅ 已成功發送重設信件！"); switchTab("login"); } 
          else { const data = await response.json(); alert("發送失敗：" + (data.message || "請確認信箱是否正確")); }
        } catch (error) { alert("無法連接到後端伺服器！"); }
      }

      async function processResetPassword() {
        const token = document.getElementById("reset-token").value;
        const newPassword = document.getElementById("reset-password").value;
        if (token.trim() === "" || newPassword.trim() === "") { alert("驗證碼與新密碼不可為空！"); return; }
        try {
          const response = await fetch(`${API_BASE_URL}/auth/reset-password`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, newPassword: newPassword }) });
          if (response.ok) { alert("密碼重設成功！請登入。"); switchTab("login"); } 
          else { const data = await response.json(); alert("重設失敗：" + (data.message || "Token 無效或過期")); }
        } catch (error) { alert("無法連接到後端伺服器！"); }
      }

      window.addEventListener("DOMContentLoaded", () => {
        loadCaptcha();
        const birthdayInput = document.getElementById("reg-birthday");
        if(birthdayInput) birthdayInput.addEventListener("change", updateZodiac);
      });
    </script>
  </body>
</html>
