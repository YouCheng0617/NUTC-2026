<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>AI 特助聊天室</title>
    <link rel="stylesheet" href="./chat.css">
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="chat-wrapper">
        <!-- 頂部設定列 -->
        <header class="chat-header">
            <div class="title">✨ AI 特助</div>
            <div class="settings">
                <button id="home-btn" title="回首頁" onclick="window.location.href='../test.html'">
                    <i class="fa-solid fa-house"></i>
                </button>
                <button id="theme-toggle" title="切換深淺色"><i class="fa-solid fa-moon"></i></button>
                <button id="font-toggle" title="調整字體大小"><i class="fa-solid fa-text-height"></i></button>
                <div class="dropdown-container">
                    <button id="lang-toggle" title="切換語言"><i class="fa-solid fa-globe"></i></button>
                    <ul class="dropdown-menu" id="lang-menu">
                        <li data-lang="zh-TW">繁體中文</li>
                        <li data-lang="zh-CN">简体中文</li>
                        <li data-lang="en">English</li>
                        <li data-lang="ja">日本語</li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- 聊天顯示區 -->
        <main class="chat-area" id="chat-area">
            <!-- 初始歡迎畫面 (破冰) -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-avatar">🤖</div>
                <h2>嗨！我是您的 AI 特助</h2>
                <p>今天有什麼我可以幫忙的呢？</p>
                <div class="suggestion-chips">
                    <button class="chip">幫我寫一封請假信</button>
                    <button class="chip">推薦我好聽的白噪音</button>
                    <button class="chip">我想聽個笑話</button>
                </div>
            </div>
            <!-- 動態生成的氣泡會放在這裡 -->
        </main>

        <!-- 底部輸入區 -->
        <footer class="input-container">
            <div class="input-box">
                <textarea id="message-input" rows="1" placeholder="問問我任何事..."></textarea>
                <button id="action-btn" class="action-btn send-mode" disabled>
                    <i class="fa-solid fa-paper-plane send-icon"></i>
                    <i class="fa-solid fa-stop stop-icon" style="display: none;"></i>
                </button>
            </div>
            <div class="input-footer-text">AI 生成的內容可能會有誤，請自行核實。</div>
        </footer>
    </div>

    <script src="./chat.js"></script>
</body>
</html>
