<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>AI 特助聊天室</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="../images/icon-192.png" />
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png" />
    <link rel="stylesheet" href="./chat.css">
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .chat-header {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            flex-wrap: nowrap !important;
            width: 100% !important;
            box-sizing: border-box !important;
            padding: 12px 16px !important;
            gap: 8px !important;
            /* 已經移除了 overflow: hidden，讓下拉選單可以正常往下展開 */
        }

        .chat-header .title {
            white-space: nowrap !important;
            font-size: clamp(1.25rem, 5.5vw, 1.5rem) !important; 
            font-weight: bold !important;
            flex-shrink: 1 !important;
            margin: 0 !important;
        }

        .chat-header .settings {
            display: flex !important;
            align-items: center !important;
            flex-wrap: nowrap !important;
            gap: 8px !important; 
            flex-shrink: 1 !important; 
        }

        .chat-header .settings button,
        .chat-header .settings .dropdown-container button {
            display: inline-flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin: 0 !important;
            width: clamp(40px, 10vw, 48px) !important;
            height: clamp(40px, 10vw, 48px) !important;
            font-size: clamp(1.1rem, 5vw, 1.4rem) !important;
            padding: 0 !important;
            min-width: 0 !important;
        }

        .chat-header .settings .dropdown-container {
            display: inline-flex !important;
            width: auto !important;
            height: auto !important;
            margin: 0 !important;
            position: relative !important;
        }

        /* 確保下拉選單顯示在最上層，不會被下方對話內容蓋住 */
        .chat-header .settings .dropdown-menu {
            z-index: 9999 !important;
        }

        @media screen and (max-width: 360px) {
            .chat-header {
                padding: 10px 8px !important;
                gap: 4px !important;
            }
            .chat-header .settings {
                gap: 4px !important;
            }
            .chat-header .settings button,
            .chat-header .settings .dropdown-container button {
                width: 36px !important;
                height: 36px !important;
                font-size: 1rem !important;
            }
        }
    </style>
</head>

<body>
    <div class="chat-wrapper">
        <!-- 頂部設定列 -->
        <header class="chat-header">
            <div class="title">✨ AI 特助</div>
            <div class="settings">
                <button id="home-btn" title="回首頁" onclick="window.location.href='../index.html'">
                    <i class="fa-solid fa-house"></i>
                </button>
                <button id="theme-toggle" title="切換深淺色"><i class="fa-solid fa-moon"></i></button>
                <button id="font-toggle" title="調整字體大小"><i class="fa-solid fa-text-height"></i></button>
                <div class="dropdown-container">
                    <button id="lang-toggle" title="切換語言"><i class="fa-solid fa-globe"></i></button>
                    <ul class="dropdown-menu" id="lang-menu">
                        <li data-lang="zh-TW">繁體中文</li>
                        <li data-lang="zh-CN">简体中文</li>
                        <li data-lang="en">English</li>
                        <li data-lang="ja">日本語</li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- 聊天顯示區 -->
        <main class="chat-area" id="chat-area">
            <!-- 初始歡迎畫面 (破冰) -->
            <div class="welcome-screen" id="welcome-screen" style="text-align: center;">
                <div class="welcome-avatar" style="margin: 0 auto !important; background: transparent !important; border: none !important; box-shadow: none !important; width: 100px !important; height: 100px !important; display: flex !important; justify-content: center !important; align-items: center !important;">
                    <img src="../images/fish_logo.webp" alt="AI特助" style="width: 100%; height: 100%; object-fit: contain; display: block;">
                </div>
                <h2>嗨！我是您的 AI 特助</h2>
                <p>今天有什麼我可以幫忙的呢？</p>
                <div class="suggestion-chips" style="justify-content: center;">
                    <button class="chip">幫我寫一封請假信</button>
                    <button class="chip">推薦我好聽的白噪音</button>
                    <button class="chip">我想聽個笑話</button>
                </div>
            </div>
            <!-- 動態生成的氣泡會放在這裡 -->
        </main>

        <!-- 底部輸入區 -->
        <footer class="input-container">
            <div class="input-box">
                <textarea id="message-input" rows="1" placeholder="問問我任何事..."></textarea>
                <button id="action-btn" class="action-btn send-mode" disabled>
                    <i class="fa-solid fa-paper-plane send-icon"></i>
                    <i class="fa-solid fa-stop stop-icon" style="display: none;"></i>
                </button>
            </div>
            <div class="input-footer-text">AI 生成的內容可能會有誤，請自行核實。</div>
        </footer>
    </div>

    <!-- 更精確、絕對固定尺寸的 JavaScript 替換腳本 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const chatArea = document.getElementById("chat-area");
            if (!chatArea) return;

            const replaceAvatar = (node) => {
                if (node.nodeType === Node.TEXT_NODE && node.nodeValue.includes("🤖")) {
                    const span = document.createElement("span");
                    // 保持絕對尺寸 40px，避免對話拉長時變形
                    span.innerHTML = node.nodeValue.replace(/🤖/g, '<img src="../images/fish_logo.webp" style="width: 40px !important; height: 40px !important; min-width: 40px !important; flex-shrink: 0 !important; object-fit: contain; vertical-align: middle; background: transparent; display: inline-block;">');
                    node.parentNode.replaceChild(span, node);
                } 
                else if (node.nodeType === Node.ELEMENT_NODE) {
                    if (node.tagName.toLowerCase() === 'img' && (node.src.includes('bot') || node.alt.includes('AI') || node.alt.includes('🤖'))) {
                        node.src = '../images/fish_logo.webp';
                        node.style.background = 'transparent';
                        node.style.objectFit = 'contain';
                        node.style.width = '40px';
                        node.style.height = '40px';
                        node.style.minWidth = '40px';
                        node.style.flexShrink = '0';
                    }
                    node.childNodes.forEach(replaceAvatar);
                }
            };

            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    mutation.addedNodes.forEach(replaceAvatar);
                });
            });
            
            observer.observe(chatArea, { childList: true, subtree: true });
        });
    </script>

    <script src="./chat.js?v=2"></script>
</body>
</html>
