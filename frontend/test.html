<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心情漂流瓶 - 論壇</title>
    <link rel="stylesheet" href="test.css?v=18" />
  </head>
  <body>
    <div class="sidebar-overlay" id="mobile-sidebar-overlay" onclick="toggleMobileSidebar()"></div>

    <div id="forum-view">
        <header class="light-header">
        <button class="hamburger-btn" id="mobile-menu-btn" onclick="toggleMobileSidebar()" style="display: none; background: none; border: none; color: white; font-size: 1.8rem; cursor: pointer; margin-right: 15px; padding: 0;">☰</button>
        <div class="logo" onclick="window.location.href = 'test.html'" title="回到主頁">
          <img src="images/fish_logo.png" style="width: 30px; margin-right: 10px; vertical-align: middle" />心情漂流瓶
        </div>
        
        <div class="search-container">
          <input 
            type="text" 
            class="search-input light-search" 
            placeholder="🔍 搜尋海域、標題、內容..." 
            id="main-search-input" 
            autocomplete="off" 
          />
          <div id="search-history-dropdown" class="search-history-box" style="display: none"></div>
        </div>

        <div class="nav-actions">
          <button id="login-trigger" class="btn-login">註冊 / 登入</button>
          
          <div id="user-profile" class="user-menu-wrapper" style="display: none">
            <div class="user-info-trigger" id="user-menu-btn">
              <img id="user-avatar" src="images/fish_logo.png" alt="頭像" class="avatar-img" />
              <span id="user-name" class="user-name-text"></span>
              <span class="menu-arrow">▼</span>
            </div>

            <div class="user-dropdown-menu" id="user-dropdown">
              <div class="menu-item" id="open-profile">👤 個人資料</div>
              <div class="menu-item" onclick="window.location.href = 'saved.html'">⭐ 收藏瓶子</div>
              <div class="menu-item" onclick="window.location.href = 'post.html'">📝 我的瓶子</div>
              <div class="menu-divider"></div>
              <div class="menu-item logout-item" id="logout-btn">🚪 退出登入</div>
            </div>

            <button id="btn-new-post" class="btn-post" style="margin-left: 10px">✏️ 發文</button>
          </div>
        </div>
      </header>

      <div class="container light-container">
        <aside class="sidebar light-sidebar">
          <h3>熱門看板</h3>
          <ul>
            <li class="active">😡 極度憤怒中</li>
            <li>🤫 沒人懂的秘密</li>
            <li>💔 破碎的碎片</li>
            <li>😑 極度厭世/躺平</li>
          </ul>
        </aside>

        <main class="main-feed" id="feed-view">
            <div id="post-container">
                <div class="empty-state-text" style="display: none;">目前沒有漂流瓶，快來拋出第一個吧！🌊</div>
            </div>
        </main>

        <main class="main-feed ocean-detail-card" id="detail-view" style="display: none;">
          
          <div class="detail-nav-bar">
            <div class="back-action" onclick="closePostDetail()">
              <span class="back-arrow">&larr;</span> 
              <span class="back-text">返回海域</span>
            </div>
            <div class="board-badge">
              <img src="images/fish_logo.png" class="board-icon" />
              <span id="detail-board-tag">綜合閒聊</span>
            </div>
          </div>

          <h2 id="detail-post-title" class="detail-title"></h2>

          <div class="detail-author-box">
            <img src="images/fish_logo.png" class="detail-avatar" />
            <div class="detail-author-text">
              <div id="detail-author-tag" class="detail-author-name"></div>
              <div class="detail-post-time">今天發布</div>
            </div>
          </div>

          <div id="detail-post-content" class="detail-content"></div>

          <div class="detail-comments-wrapper">
            <h3 class="comments-title">
              💬 共 <span id="detail-comment-count">0</span> 則留言
            </h3>

            <div id="detail-comments-list" class="comments-list"></div>

            <div class="comment-action-bar">
              <button type="button" id="save-bottle-btn" class="save-btn" title="收藏這個瓶子" onclick="this.classList.toggle('active')">⭐</button>
              <input type="text" id="new-comment-input" placeholder="寫下溫暖的留言..." class="comment-input" autocomplete="off" />
              <button type="button" onclick="submitComment()" class="send-btn">送出</button>
            </div>
          </div>
        </main>

        <aside class="right-panel light-right-panel">
          <h3>熱門話題</h3>
          <div class="tag-cloud">
            <span class="tag"># AI革命</span><span class="tag"># 心情點滴</span>
          </div>
        </aside>
      </div>
    </div>

    <div id="post-modal" class="modal">
      <div class="modal-content ocean-post-modal">
        <span class="close-btn" id="close-post-modal">&times;</span>
        <div class="post-modal-header">
          <h2>📝 撰寫漂流瓶</h2>
          <p>把你的心事裝進瓶子，讓海浪替你傳遞...</p>
        </div>
        <form id="new-post-form" class="ocean-post-form">
          <div class="form-row">
            <select id="post-board" required class="ocean-input">
              <option value="" disabled selected>🌊 選擇拋出的海域...</option>
              <option value="1">😡 極度憤怒中</option>
              <option value="2">🤫 沒人懂的秘密</option>
              <option value="3">💔 破碎的碎片</option>
              <option value="4">😑 極度厭世/躺平</option>
            </select>
            <select id="post-identity" required class="ocean-input">
              <option value="真實姓名">👤 實名發布</option>
              <option value="匿名">🎭 偷偷說 (匿名)</option>
            </select>
          </div>
          <input type="text" id="post-title-input" placeholder="為這瓶心事下個標題吧！" required class="ocean-input" autocomplete="off" />
          <textarea id="post-content-input" placeholder="寫下你想說的話..." required class="ocean-input ocean-textarea"></textarea>
          <button type="submit" class="ocean-submit-btn">拋出漂流瓶</button>
        </form>
      </div>
    </div>

    <div id="profile-modal" class="modal">
      <div class="modal-content light-modal" style="width: 400px; text-align: center">
        <span class="close-btn" id="close-profile-modal">&times;</span>
        <h2 style="color: #0055a5; margin-bottom: 20px">個人資訊</h2>
        <div class="profile-detail">
          <div style="position: relative; display: inline-block; cursor: pointer" onclick="document.getElementById('change-avatar-input').click()">
            <img id="detail-avatar" src="images/fish_logo.png" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid #4da6ff; margin-bottom: 15px; object-fit: cover;" />
            <div style="position: absolute; bottom: 15px; right: 0; background: #4da6ff; color: white; border-radius: 50%; width: 25px; height: 25px; font-size: 14px; line-height: 25px; text-align: center;">📷</div>
          </div>
          <input type="file" id="change-avatar-input" accept="image/*" style="display: none" />
          <h3 id="detail-name" style="margin: 5px 0">姓名</h3>
          <p id="detail-email" style="color: #888; font-size: 0.9rem">email@example.com</p>
          <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0" />
          <div style="text-align: left; padding: 0 20px; line-height: 2">
            <div><strong>🎂 生日：</strong><span id="detail-birthday">未填寫</span></div>
            <div><strong>🚻 性別：</strong><span id="detail-gender">未填寫</span></div>
            <div><strong>✨ 星座：</strong><span id="detail-zodiac">未填寫</span></div>
            <div style="margin-top: 10px"><strong>📝 自我介紹：</strong></div>
            <p id="detail-bio" style="background: #f9fbfd; padding: 10px; border-radius: 8px; font-size: 0.9rem;">尚未填寫自我介紹...</p>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="test.js?v=18"></script>
    
    <div class="ocean-refresh-btn" onclick="callOceanCurrent()">🌊 呼喚海流</div>
    <div class="back-to-home-btn" onclick="window.location.href='test.html'" style="display: none !important;">🏠 回到主頁</div>

    <script>
      function toggleMobileSidebar() {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('mobile-sidebar-overlay');
        if(sidebar && overlay) {
          sidebar.classList.toggle('active-sidebar');
          overlay.classList.toggle('active-overlay');
        }
      }
      document.querySelectorAll('.sidebar li').forEach(item => {
        item.addEventListener('click', () => {
            if(window.innerWidth <= 768) {
                toggleMobileSidebar();
            }
        });
      });
    </script>
  </body>
</html>
