<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>寄居蟹的換殼日記 - 秘密海域</title>

    <link rel="stylesheet" href="test.css?v=99" />

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #001528;
        font-family: "PingFang TC", sans-serif;
        color: white;
        user-select: none;
      }

      /* 🌟 海灘養成舞台 */
      .beach-stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 60%;
        /* 深海到沙灘的漸層背景 */
        background: linear-gradient(
          to bottom,
          rgba(0, 30, 60, 0.9) 0%,
          rgba(20, 80, 120, 0.7) 60%,
          #e0c097 100%
        );
        border-bottom: 5px solid rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }

      /* 🦀 寄居蟹本體與動畫 */
      .crab-container {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        transition: all 0.5s ease;
        animation: crabWaddle 3s infinite alternate ease-in-out;
        z-index: 10;
        cursor: pointer;
      }

      @keyframes crabWaddle {
        0% {
          transform: translateX(-60%) rotate(-5deg);
        }
        100% {
          transform: translateX(-40%) rotate(5deg);
        }
      }

      .crab-body {
        font-size: 6rem;
        display: inline-block;
        filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.5));
      }

      /* 巧妙把殼疊在寄居蟹背上 */
      .crab-shell {
        position: absolute;
        top: -10px;
        right: -15px;
        font-size: 4.5rem;
        transform: rotate(15deg);
        filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.5));
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      /* 🌟 狀態面板與操作區 */
      .ui-panel {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40%;
        background: rgba(10, 35, 65, 0.95);
        border-top: 1px solid rgba(77, 166, 255, 0.5);
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
      }

      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .points-badge {
        background: rgba(255, 215, 0, 0.2);
        border: 2px solid #ffd700;
        color: #ffd700;
        padding: 8px 20px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-card {
        background: rgba(255, 255, 255, 0.08);
        padding: 15px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        margin-bottom: 20px;
        line-height: 1.6;
      }

      /* 市集商品網格 */
      .shop-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 15px;
      }
      .shop-item {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(77, 166, 255, 0.3);
        border-radius: 15px;
        padding: 15px 10px;
        text-align: center;
        transition: 0.3s;
        cursor: pointer;
      }
      .shop-item:hover {
        background: rgba(77, 166, 255, 0.2);
        border-color: #4da6ff;
        transform: translateY(-3px);
      }
      .item-icon {
        font-size: 2.5rem;
        margin-bottom: 10px;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
      }
      .item-price {
        color: #ffd700;
        font-weight: bold;
        margin-top: 5px;
        font-size: 0.9rem;
      }

      /* 放置在沙灘上的裝飾品 */
      .decoration {
        position: absolute;
        font-size: 3rem;
        filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.5));
        z-index: 5;
      }

      .back-btn {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: white;
        padding: 8px 20px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
      }

      /* 🌟 Demo 專用的 AI 模擬按鈕區 */
      .demo-controls {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        justify-content: center;
        border-top: 1px dashed rgba(255, 255, 255, 0.2);
        padding-top: 15px;
      }
      .demo-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #aaa;
        padding: 5px 10px;
        border-radius: 10px;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .demo-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="beach-stage" id="beach">
      <button
        class="back-btn"
        style="position: absolute; top: 20px; left: 20px; z-index: 50"
        onclick="window.location.href = 'games.html'"
      >
        🔙 返回
      </button>

      <div class="crab-container" onclick="pokeCrab()">
        <span class="crab-body">🦀</span>
        <span class="crab-shell" id="crab-shell">📦</span>
      </div>
    </div>

    <div class="ui-panel">
      <div class="header-bar">
        <h2 style="margin: 0; color: #4da6ff; font-size: 1.5rem">
          🦀 我的專屬沙灘
        </h2>
        <div class="points-badge">🪙 <span id="points">0</span></div>
      </div>

      <div class="status-card">
        <div
          style="font-size: 1.1rem; font-weight: bold; margin-bottom: 5px"
          id="mood-title"
        >
          AI 心情分析：近期比較【厭世】
        </div>
        <div style="color: #d1e8ff; font-size: 0.95rem" id="mood-desc">
          因此你的小寄居蟹換上了「紙箱殼」，看起來有點想躲起來呢。快去發點開心的事情賺點數吧！
        </div>

        <div class="demo-controls">
          <span style="font-size: 0.8rem; color: #888"
            >[Demo展示用] 模擬發文情緒：</span
          >
          <button class="demo-btn" onclick="setMood('angry')">😡 憤怒</button>
          <button class="demo-btn" onclick="setMood('depressed')">
            😮‍💨 厭世
          </button>
          <button class="demo-btn" onclick="setMood('happy')">🥰 快樂</button>
        </div>
      </div>

      <h3 style="margin: 0 0 15px 0; font-size: 1.2rem">
        🛒 裝飾市集 (點擊購買)
      </h3>
      <div class="shop-grid">
        <div class="shop-item" onclick="buyItem('starfish', 50, '⭐')">
          <div class="item-icon">⭐</div>
          <div>小海星</div>
          <div class="item-price">50 點</div>
        </div>
        <div class="shop-item" onclick="buyItem('shell', 100, '🐚')">
          <div class="item-icon">🐚</div>
          <div>珍珠貝殼</div>
          <div class="item-price">100 點</div>
        </div>
        <div class="shop-item" onclick="buyItem('castle', 250, '🏰')">
          <div class="item-icon">🏰</div>
          <div>豪華沙堡</div>
          <div class="item-price">250 點</div>
        </div>
        <div class="shop-item" onclick="buyItem('umbrella', 400, '🏖️')">
          <div class="item-icon">🏖️</div>
          <div>渡假陽傘</div>
          <div class="item-price">400 點</div>
        </div>
      </div>
    </div>

    <script>
      // 🌟 定義心情與對應的殼
      const moodConfig = {
        angry: {
          emoji: "🥫",
          title: "AI 心情分析：近期充滿【火氣】",
          desc: "你的寄居蟹感受到你的怒火，換上了紅色的「易開罐殼」，看起來隨時要爆炸啦！",
        },
        depressed: {
          emoji: "📦",
          title: "AI 心情分析：近期比較【厭世】",
          desc: "你的寄居蟹感受到了你的疲憊，頂著「紙箱殼」躲在裡面不想出門。",
        },
        happy: {
          emoji: "✨🐚",
          title: "AI 心情分析：近期非常【快樂】",
          desc: "你的正能量讓寄居蟹也開心起來了！牠換上了閃閃發光的「豪華海螺殼」！",
        },
      };

      // 🌟 初始化資料 (讀取 localStorage)
      let crabData = JSON.parse(localStorage.getItem("hermitCrabData")) || {
        points: 1000, // 初始給 1000 點方便 Demo
        mood: "depressed",
        decorations: [],
      };

      window.onload = () => {
        updateUI();
        renderDecorations();
      };

      // 🌟 更新介面與寄居蟹外觀
      function updateUI() {
        document.getElementById("points").innerText = crabData.points;

        const currentMood = moodConfig[crabData.mood];
        document.getElementById("crab-shell").innerText = currentMood.emoji;
        document.getElementById("mood-title").innerText = currentMood.title;
        document.getElementById("mood-desc").innerText = currentMood.desc;

        // 若為快樂，給殼加點特效
        if (crabData.mood === "happy") {
          document.getElementById("crab-shell").style.textShadow =
            "0 0 20px #ffd700";
        } else {
          document.getElementById("crab-shell").style.textShadow = "none";
        }
      }

      // 🌟 專題 Demo 用的切換心情函式
      function setMood(newMood) {
        crabData.mood = newMood;
        saveData();

        // 加點彈跳特效讓換殼更明顯
        const shellEl = document.getElementById("crab-shell");
        shellEl.style.transform = "translateY(-30px) rotate(30deg) scale(1.5)";
        setTimeout(() => {
          updateUI();
          shellEl.style.transform = "rotate(15deg) scale(1)";
        }, 300);
      }

      // 🌟 購買裝飾品
      function buyItem(id, price, emoji) {
        if (crabData.points >= price) {
          crabData.points -= price;

          // 隨機產生在沙灘上的位置 (Y軸 10%~30%, X軸 10%~90%)
          const randomX = Math.floor(Math.random() * 80) + 10;
          const randomY = Math.floor(Math.random() * 20) + 10;

          const newDeco = { emoji: emoji, x: randomX, y: randomY };
          crabData.decorations.push(newDeco);

          saveData();
          updateUI();

          // 畫出新買的裝飾
          drawDecoration(newDeco);

          // 提示
          const msg = document.createElement("div");
          msg.innerText = "- " + price + " 點";
          msg.style.cssText = `position:absolute; top:40%; left:50%; color:#ff4d4d; font-size:2rem; font-weight:bold; z-index:100; animation: floatUp 1s forwards;`;
          document.body.appendChild(msg);
          setTimeout(() => msg.remove(), 1000);
        } else {
          alert("🪙 點數不夠喔！快去漂流瓶發文或留言賺點數吧！");
        }
      }

      // 🌟 將裝飾品畫在沙灘上
      function renderDecorations() {
        const beach = document.getElementById("beach");
        // 清除舊的避免重複
        document.querySelectorAll(".decoration").forEach((el) => el.remove());
        crabData.decorations.forEach(drawDecoration);
      }

      function drawDecoration(deco) {
        const beach = document.getElementById("beach");
        const el = document.createElement("div");
        el.className = "decoration";
        el.innerText = deco.emoji;
        el.style.left = deco.x + "%";
        el.style.bottom = deco.y + "%";

        // 如果是海星或貝殼，給一點隨機旋轉角度
        if (deco.emoji === "⭐" || deco.emoji === "🐚") {
          el.style.transform = `rotate(${Math.random() * 60 - 30}deg)`;
        }
        beach.appendChild(el);
      }

      // 戳戳寄居蟹的互動
      function pokeCrab() {
        const crab = document.querySelector(".crab-container");
        crab.style.transform = "translateX(-50%) scale(1.1) translateY(-20px)";
        setTimeout(() => {
          crab.style.transform = "translateX(-50%) scale(1) translateY(0)";
        }, 200);
      }

      function saveData() {
        localStorage.setItem("hermitCrabData", JSON.stringify(crabData));
      }
    </script>

    <style>
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -50px);
        }
      }
    </style>
  </body>
</html>
