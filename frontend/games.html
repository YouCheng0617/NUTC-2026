<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>秘密海域遊樂場 - 心情漂流瓶</title>

    <link rel="stylesheet" href="test.css?v=99" />

    <style>
      /* 🌟 解除 test.css 的高度鎖定詛咒，讓這個頁面可以正常上下滾動！ */
      body,
      html {
        height: auto !important;
        min-height: 100vh !important;
        overflow-y: auto !important;
      }

      .game-btn-container {
        max-width: 950px; /* 稍微加寬一點點 */
        margin: 80px auto 60px auto;
        padding: 20px;
        text-align: center;
        user-select: none;
      }

      .game-title {
        color: #ffffff;
        text-shadow: 0 0 15px rgba(77, 166, 255, 0.9);
        font-size: 2.5rem;
        margin-bottom: 10px;
        font-weight: 900;
      }

      .game-subtitle {
        color: #d1e8ff;
        font-size: 1.1rem;
        margin-bottom: 40px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }

      /* 🌟 微調按鈕寬度，讓電腦版可以完美呈現「一行 3 個」的黃金比例 */
      .game-btn-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 25px;
        padding: 10px;
      }

      /* 🎮 超大毛玻璃按鈕設計 */
      .big-game-btn {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        padding: 30px 15px; /* 稍微縮減上下留白，比例更精緻 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 8px 32px rgba(0, 20, 50, 0.3);
        color: white;
        outline: none;
        text-decoration: none;
      }

      .big-game-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.8);
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 15px 40px rgba(77, 166, 255, 0.4);
      }

      .big-game-btn:active {
        transform: translateY(2px) scale(0.98);
        box-shadow: 0 5px 15px rgba(77, 166, 255, 0.3);
      }

      .game-emoji {
        font-size: 3.8rem;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      }

      .game-name {
        font-size: 1.3rem;
        font-weight: bold;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <header class="light-header">
      <div
        class="logo"
        onclick="window.location.href = 'test.html'"
        title="回到主頁"
        style="cursor: pointer"
      >
        <img
          src="images/fish_logo.png"
          style="width: 30px; margin-right: 10px; vertical-align: middle"
        />心情漂流瓶
      </div>
      <div class="nav-actions">
        <button
          class="btn-login"
          onclick="window.location.href = 'test.html'"
          style="
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
          "
        >
          🏠 回到首頁
        </button>
      </div>
    </header>

    <div class="game-btn-container">
      <h1 class="game-title">🎮 秘密海域遊樂場</h1>
      <p class="game-subtitle">點擊下方按鈕，直接開始你的專屬遊戲！</p>

      <div class="game-btn-grid">
        <button class="big-game-btn" onclick="alert('寄居蟹系統開發中！')">
          <span class="game-emoji">🦀</span>
          <span class="game-name">寄居蟹的換殼日記</span>
        </button>

        <button class="big-game-btn" onclick="alert('占卜系統開發中！')">
          <span class="game-emoji">🔮</span>
          <span class="game-name">命運海之占卜：今日塔羅瓶</span>
        </button>

        <button class="big-game-btn" onclick="alert('拼圖開發中！')">
          <span class="game-emoji">🧩</span>
          <span class="game-name">突然想拼圖</span>
        </button>

        <button class="big-game-btn" onclick="alert('便利貼開發中！')">
          <span class="game-emoji">📝</span>
          <span class="game-name">每日便利貼</span>
        </button>

        <button class="big-game-btn" onclick="alert('摔瓶子開發中！')">
          <span class="game-emoji">💥</span>
          <span class="game-name">再摔幾瓶</span>
        </button>

        <button
          class="big-game-btn"
          onclick="window.location.href = 'catch-bottle.html'"
        >
          <span class="game-emoji">🤲</span>
          <span class="game-name">接住小瓶</span>
        </button>
      </div>
    </div>
  </body>
</html>
