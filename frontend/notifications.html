<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通知中心 - 心情漂流瓶</title>
    <!-- 引入你的超美 CSS -->
    <link rel="stylesheet" href="notifications.css" />
  </head>
  <body>
    <!-- 全局背景 (沿用你們的深海背景) -->
    <div class="ocean-bg"></div> <!--[cite: 2] -->

    <!-- 通知頁面主容器 -->
    <main class="notif-page-container"> <!--[cite: 2] -->
      <!-- 頂部導覽列 -->
      <header class="notif-header"> <!--[cite: 2] -->
        <button class="back-btn" onclick="history.back()">🔙 返回</button> <!--[cite: 2] -->
        <h2>通知中心</h2> <!--[cite: 2] -->
        <button class="mark-all-btn" onclick="markAllAsReadAPI()">全部已讀</button> <!--[cite: 2] -->
      </header>

      <!-- 通知列表區塊 (這邊留空，讓 JS 來動態生成！) -->
      <div class="notif-list" id="notif-list-container">
        <!-- JS 會在這裡塞入卡片 -->
      </div>
    </main>

    <!-- 引入魔法 JS -->
    <script src="notifications.js"></script>
  </body>
</html>
