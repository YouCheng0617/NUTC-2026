<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>今日塔羅瓶 - 秘密海域</title>

    <link rel="stylesheet" href="test.css?v=99" />

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100vw;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        background-color: #001528;
        font-family: "PingFang TC", sans-serif;
        color: white;
        user-select: none;
        background: radial-gradient(
          circle at center,
          #003366 0%,
          #001122 80%,
          #000000 100%
        );
      }

      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 10px 25px;
        border-radius: 25px;
        cursor: pointer;
        z-index: 50;
        font-weight: bold;
        font-size: 1.1rem;
        transition: 0.3s;
        backdrop-filter: blur(5px);
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      .header-title {
        text-align: center;
        margin-top: 50px;
        z-index: 10;
        position: relative;
      }
      .header-title h1 {
        font-size: 3rem;
        color: #e6e6fa;
        text-shadow: 0 0 20px rgba(171, 130, 255, 0.8);
        margin: 0 0 10px 0;
        letter-spacing: 3px;
      }
      .header-title p {
        color: #b3b3cc;
        font-size: 1.2rem;
        margin: 0;
      }

      /* 卡牌區塊 */
      .tarot-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        min-height: 350px;
        margin-top: 20px;
        margin-bottom: 40px;
        perspective: 1000px;
      }

      .card-wrapper {
        width: 180px;
        height: 280px;
        position: relative;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .card-label {
        color: #e6e6fa;
        font-weight: bold;
        font-size: 1.2rem;
        text-shadow: 0 0 10px rgba(171, 130, 255, 0.5);
        opacity: 0.8;
        transition: 0.3s;
      }
      .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-style: preserve-3d;
      }
      .card-wrapper.flipped .card-inner {
        transform: rotateY(180deg);
      }
      .card-wrapper.flipped .card-label {
        opacity: 1;
        color: #ffd700;
        text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
      }

      .card-front,
      .card-back {
        width: 100%;
        height: 100%;
        position: absolute;
        backface-visibility: hidden;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      }
      .card-back {
        background: rgba(10, 25, 50, 0.6);
        border: 2px solid rgba(171, 130, 255, 0.4);
        backdrop-filter: blur(5px);
        animation: float 3s infinite ease-in-out alternate;
      }
      .bottle-icon {
        font-size: 4rem;
        filter: drop-shadow(0 0 15px rgba(171, 130, 255, 0.8));
      }
      .card-front {
        background: linear-gradient(135deg, #1a2a6c, #112240, #2a0845);
        border: 2px solid #ffd700;
        transform: rotateY(180deg);
        padding: 15px;
        box-sizing: border-box;
        text-align: center;
      }
      .tarot-img {
        font-size: 4.5rem;
        margin-bottom: 10px;
        filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
        transition: transform 0.5s;
      }
      .tarot-img.reversed {
        transform: rotate(180deg);
        filter: drop-shadow(0 0 10px rgba(255, 100, 100, 0.6));
      }
      .tarot-position {
        font-size: 0.85rem;
        padding: 2px 8px;
        border-radius: 10px;
        margin-bottom: 5px;
        display: inline-block;
        font-weight: bold;
      }
      .pos-upright {
        background: rgba(77, 166, 255, 0.3);
        color: #4da6ff;
        border: 1px solid rgba(77, 166, 255, 0.5);
      }
      .pos-reversed {
        background: rgba(255, 100, 100, 0.3);
        color: #ff6666;
        border: 1px solid rgba(255, 100, 100, 0.5);
      }
      .tarot-name {
        color: #ffd700;
        font-weight: bold;
        font-size: 1.2rem;
        margin-bottom: 5px;
      }
      .tarot-desc {
        color: #d1e8ff;
        font-size: 0.85rem;
        line-height: 1.4;
      }

      /* 🌟 全新升級：遮罩與彈出式 Modal */
      #modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 5, 15, 0.8);
        backdrop-filter: blur(5px);
        z-index: 100;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      #ai-modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -45%);
        width: 90%;
        max-width: 650px;
        max-height: 85vh;
        overflow-y: auto;
        background: #fdfdfd; /* 乾淨白底 */
        color: #333;
        border-radius: 24px;
        padding: 35px 30px;
        box-sizing: border-box;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.6),
          inset 0 0 0 1px rgba(0, 0, 0, 0.05);
        z-index: 101;
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      }
      #ai-modal.show {
        opacity: 1;
        transform: translate(-50%, -50%);
      }

      /* Modal 內的關閉按鈕 */
      .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 1.5rem;
        color: #aaa;
        background: none;
        border: none;
        cursor: pointer;
        transition: 0.2s;
      }
      .close-btn:hover {
        color: #555;
      }

      /* Modal 頂部：抽到的牌陣展示區 */
      .modal-cards-row {
        display: flex;
        justify-content: center;
        gap: 20px;
        padding-bottom: 25px;
        margin-bottom: 25px;
        border-bottom: 1px dashed #ddd;
      }
      .modal-mini-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 90px;
        background: #f4f6f8;
        padding: 15px 10px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .modal-mini-card .img {
        font-size: 3rem;
        margin-bottom: 8px;
      }
      .modal-mini-card .img.reversed {
        transform: rotate(180deg);
      }
      .modal-mini-card .name {
        font-size: 0.95rem;
        font-weight: bold;
        color: #222;
        text-align: center;
      }
      .modal-mini-card .pos {
        font-size: 0.8rem;
        color: #777;
        margin-top: 4px;
      }

      /* Modal 標題與日期 */
      .modal-header-info {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px;
      }
      .ai-title {
        font-size: 1.4rem;
        color: #1a2a6c;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
      }
      .modal-date {
        font-size: 0.9rem;
        color: #888;
        font-weight: bold;
        letter-spacing: 1px;
      }

      /* AI 狀態標籤 (適應淺色背景) */
      .status-badge {
        font-size: 0.75rem;
        padding: 4px 10px;
        border-radius: 12px;
        font-weight: bold;
        margin-left: 10px;
        letter-spacing: 0.5px;
      }
      .status-connecting {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
      }
      .status-connected {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .status-disconnected {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      /* 內文區塊 */
      .ai-content {
        font-size: 1.15rem;
        line-height: 1.9;
        color: #444;
        letter-spacing: 0.5px;
        min-height: 80px;
      }

      /* 底部互動區塊 (適應淺色背景) */
      #ai-actions {
        margin-top: 30px;
        border-top: 1px solid #eee;
        padding-top: 25px;
      }
      .action-input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }
      #ai-question-input {
        flex: 1;
        padding: 12px 15px;
        border-radius: 20px;
        border: 1px solid #ccc;
        background: #fff;
        color: #333;
        outline: none;
        font-size: 1rem;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
      }
      #ai-question-input:focus {
        border-color: #ab82ff;
        box-shadow: 0 0 0 3px rgba(171, 130, 255, 0.2);
      }

      .btn-ask {
        background: linear-gradient(135deg, #1a2a6c, #2a0845);
        color: white;
        border: none;
        padding: 0 25px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
        transition: 0.3s;
      }
      .btn-ask:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(26, 42, 108, 0.4);
      }

      .btn-save {
        width: 100%;
        background: #fff8e1;
        border: 1px solid #ffc107;
        color: #b78a00;
        padding: 12px;
        border-radius: 15px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1.05rem;
        transition: 0.3s;
      }
      .btn-save:hover {
        background: #ffecb3;
        color: #8f6b00;
      }

      @keyframes float {
        0% {
          transform: translateY(0);
          box-shadow: 0 5px 15px rgba(171, 130, 255, 0.2);
        }
        100% {
          transform: translateY(-15px);
          box-shadow: 0 20px 30px rgba(171, 130, 255, 0.6);
        }
      }

      @media screen and (max-width: 768px) {
        .tarot-container {
          flex-direction: column;
          height: auto;
          gap: 15px;
          margin-top: 30px;
          margin-bottom: 30px;
        }
        .card-wrapper {
          width: 140px;
          height: 210px;
          flex-direction: row;
          justify-content: flex-start;
        }
        .card-label {
          writing-mode: vertical-lr;
          font-size: 1rem;
        }
        .header-title h1 {
          font-size: 2.2rem;
        }

        #ai-modal {
          padding: 25px 20px;
          width: 95%;
          max-height: 90vh;
        }
        .modal-cards-row {
          gap: 10px;
        }
        .modal-mini-card {
          width: 75px;
          padding: 10px 5px;
        }
        .modal-mini-card .img {
          font-size: 2.2rem;
        }
        .ai-title {
          font-size: 1.15rem;
        }
        .modal-date {
          font-size: 0.8rem;
        }
        .ai-content {
          font-size: 1.05rem;
        }
      }
    </style>
  </head>
  <body>
    <button class="back-btn" onclick="window.location.href = 'games.html'">
      🔙 返回遊樂場
    </button>

    <div class="header-title">
      <h1>🔮 今日塔羅瓶</h1>
      <p>點擊海面上的發光寶石瓶，揭曉今日專屬的海洋指引</p>
    </div>

    <div class="tarot-container">
      <div class="card-wrapper" onclick="flipCard(this, 'past')">
        <div class="card-label">【過去】</div>
        <div class="card-inner">
          <div class="card-back" style="animation-delay: 0s">
            <div class="bottle-icon">🏺</div>
          </div>
          <div class="card-front" id="card-front-past"></div>
        </div>
      </div>
      <div class="card-wrapper" onclick="flipCard(this, 'present')">
        <div class="card-label">【現在】</div>
        <div class="card-inner">
          <div class="card-back" style="animation-delay: 0.5s">
            <div class="bottle-icon">🔮</div>
          </div>
          <div class="card-front" id="card-front-present"></div>
        </div>
      </div>
      <div class="card-wrapper" onclick="flipCard(this, 'future')">
        <div class="card-label">【未來】</div>
        <div class="card-inner">
          <div class="card-back" style="animation-delay: 1s">
            <div class="bottle-icon">💎</div>
          </div>
          <div class="card-front" id="card-front-future"></div>
        </div>
      </div>
    </div>

    <!-- 🌟 彈出式遮罩與 Modal -->
    <div id="modal-backdrop" onclick="closeModal()"></div>

    <div id="ai-modal">
      <button class="close-btn" onclick="closeModal()">✖</button>

      <!-- 動態插入抽到的牌陣 -->
      <div class="modal-cards-row" id="modal-cards-row"></div>

      <div class="modal-header-info">
        <h3 class="ai-title">
          ✨ 來自深海的指引
          <span
            id="ai-status-badge"
            class="status-badge"
            style="display: none"
          ></span>
        </h3>
        <span class="modal-date" id="modal-date"></span>
      </div>

      <div class="ai-content" id="ai-text"></div>

      <div id="ai-actions" style="display: none">
        <div
          style="
            margin-bottom: 15px;
            color: #666;
            font-size: 0.95rem;
            font-weight: bold;
          "
        >
          想針對這個結果問更深入的問題嗎？
        </div>
        <div class="action-input-group">
          <input
            type="text"
            id="ai-question-input"
            placeholder="例如：那我該如何改善目前的困境？"
          />
          <button class="btn-ask" onclick="askAIQuestion()">發問</button>
        </div>
        <button class="btn-save" onclick="saveReading()">
          ⭐ 收藏今日占卜結果
        </button>
      </div>
    </div>

    <script>
      const API_BASE_URL = "https://api.drift-bottles.xyz/"; // ⚠️ 後端網址

      const tarotDeck = [
        {
          id: 0,
          emoji: "🃏",
          name: "愚者",

          rev: "魯莽行事、過度冒險、逃避責任",
        },
        {

          emoji: "🪄",
          name: "魔術師",

        {

        },
        {
          id: 4,
          emoji: "🛡️",

          up: "權威、穩定、秩序與領導力",

        },
        {
          id: 5,
          emoji: "🏛️",
          name: "教皇",
          up: "傳統、心靈指引、教育與貴人",

        },
        {
          id: 6,
          emoji: "💞",
          name: "戀人",
          up: "重大抉擇、和諧的關係、吸引力",
          rev: "誘惑、關係破裂、錯誤的決定",
        },
        {
          id: 7,
          emoji: " रथ",
          name: "戰車",
          up: "意志力、克服困難、勝利的決心",
          rev: "失控、挫折、遭遇強大阻礙",
        },
        {
          id: 8,
          emoji: "🦁",
          name: "力量",
          up: "勇氣、耐心、以柔克剛的內在力量",
          rev: "軟弱、恐懼、缺乏自信與耐力",
        },
        {
          id: 9,
          emoji: "🏮",
          name: "隱者",
          up: "內省、孤獨、尋求真理與指引",
          rev: "逃避現實、過度孤立、迷失方向",
        },
        {
          id: 10,
          emoji: "🎡",
          name: "命運之輪",
          up: "轉機、命中註定的契機、好運",
          rev: "阻礙、運勢低迷、抗拒改變",
        },
        {
          id: 11,
          emoji: "⚖️",
          name: "正義",
          up: "平衡、理智、公平與看清真相",
          rev: "偏見、不公不義、猶豫不決",
        },
        {
          id: 12,
          emoji: "🪢",
          name: "倒吊人",
          up: "犧牲、換位思考、暫停與沉澱",
          rev: "無謂的掙扎、徒勞無功、鑽牛角尖",
        },
        {
          id: 13,
          emoji: "💀",
          name: "死神",
          up: "結束、轉化、重生與割捨過去",
          rev: "停滯不前、抗拒改變、無法放手",
        },
        {
          id: 14,
          emoji: "🏺",
          name: "節制",
          up: "平衡、協調、溝通與自我淨化",
          rev: "失衡、極端、缺乏節制與耐心",
        },
        {
          id: 15,
          emoji: "😈",
          name: "惡魔",
          up: "慾望、物質束縛、誘惑與沉迷",
          rev: "擺脫控制、覺醒、看清現實",
        },
        {
          id: 16,
          emoji: "⚡",
          name: "高塔",
          up: "突變、毀滅、陣痛與徹底崩壞",
          rev: "重建、避免災難、困境中的微光",
        },
        {
          id: 17,
          emoji: "✨",
          name: "星星",
          up: "希望、療癒、平靜與靈感湧現",
          rev: "絕望、失望、缺乏信心與目標",
        },
        {
          id: 18,
          emoji: "🌕",
          name: "月亮",
          up: "不安、迷惘、潛意識的恐懼",
          rev: "恐懼消散、看清真相、柳暗花明",
        },
        {
          id: 19,
          emoji: "☀️",
          name: "太陽",
          up: "成功、喜悅、充滿生命力與光明",
          rev: "延遲的成功、熱情消退、缺乏方向",
        },
        {
          id: 20,
          emoji: "📯",
          name: "審判",
          up: "覺醒、重塑、自我反省與召喚",
          rev: "懊悔、缺乏決斷、逃避內心的聲音",
        },
        {
          id: 21,
          emoji: "🌍",
          name: "世界",
          up: "圓滿、達成目標、完美的旅程",
          rev: "未完成、停滯、缺乏最後一步的動力",
        },
      ];

      let flippedCount = 0;
      let drawnCards = [];

      function drawCards() {
        let shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
        let selected = shuffled.slice(0, 3);

        return selected.map((card) => {
          const isReversed = Math.random() > 0.5;
          return {
            ...card,
            isReversed: isReversed,
            positionText: isReversed ? "逆位" : "正位",
            meaning: isReversed ? card.rev : card.up,
            cssClass: isReversed ? "reversed pos-reversed" : "pos-upright",
          };
        });
      }

      const todayCards = drawCards();

      function flipCard(element, position) {
        if (element.classList.contains("flipped")) return;

        let cardData;
        if (position === "past") cardData = todayCards[0];
        if (position === "present") cardData = todayCards[1];
        if (position === "future") cardData = todayCards[2];

        const frontEl = document.getElementById(`card-front-${position}`);
        frontEl.innerHTML = `
              <div class="tarot-img ${cardData.isReversed ? "reversed" : ""}">${cardData.emoji}</div>
              <div class="tarot-position ${cardData.cssClass}">${cardData.positionText}</div>
              <div class="tarot-name">${cardData.name}</div>
              <div class="tarot-desc">${cardData.meaning}</div>
          `;

        element.classList.add("flipped");
        flippedCount++;

        if (flippedCount === 3) {
          setTimeout(showAIReadingModal, 1000);
        }
      }

      // 🌟 開啟/關閉 Modal 邏輯
      function closeModal() {
        document.getElementById("modal-backdrop").style.opacity = "0";
        document.getElementById("ai-modal").classList.remove("show");
        setTimeout(() => {
          document.getElementById("modal-backdrop").style.display = "none";
          document.getElementById("ai-modal").style.display = "none";
        }, 300); // 等動畫播完
      }

      // 🌟 將今日日期放入右上角
      function setTodayDate() {
        const dateEl = document.getElementById("modal-date");
        const d = new Date();
        dateEl.innerText = `${d.getFullYear()} / ${(d.getMonth() + 1).toString().padStart(2, "0")} / ${d.getDate().toString().padStart(2, "0")}`;
      }

      function renderTypingEffect(message, element, onComplete) {
        element.innerHTML = "";
        let index = 0;
        function typeWriter() {
          if (index < message.length) {
            element.innerHTML += message.charAt(index);
            index++;
            setTimeout(typeWriter, Math.random() * 30 + 15);
          } else {
            if (onComplete) onComplete();
          }
        }
        typeWriter();
      }

      function setAiStatus(status) {
        const badge = document.getElementById("ai-status-badge");
        badge.style.display = "inline-block";
        if (status === "connecting") {
          badge.className = "status-badge status-connecting";
          badge.innerText = "AI連線中 ⏳";
        } else if (status === "connected") {
          badge.className = "status-badge status-connected";
          badge.innerText = "AI已連接 🟢";
        } else if (status === "disconnected") {
          badge.className = "status-badge status-disconnected";
          badge.innerText = "未連接AI 🔴";
        }
      }

      // 🌟 核心：開啟 Modal 並顯示解讀
      async function showAIReadingModal() {
        const backdrop = document.getElementById("modal-backdrop");
        const modal = document.getElementById("ai-modal");
        const textEl = document.getElementById("ai-text");

        // 填入小圖示卡牌
        const cardsRow = document.getElementById("modal-cards-row");
        cardsRow.innerHTML = todayCards
          .map(
            (card) => `
              <div class="modal-mini-card">
                  <div class="img ${card.isReversed ? "reversed" : ""}">${card.emoji}</div>
                  <div class="name">${card.name}</div>
                  <div class="pos">${card.positionText}</div>
              </div>
          `,
          )
          .join("");

        setTodayDate();

        // 顯示 Modal
        backdrop.style.display = "block";
        modal.style.display = "block";
        setTimeout(() => {
          backdrop.style.opacity = "1";
          modal.classList.add("show");
        }, 10);

        textEl.innerHTML =
          '<span style="color: #666;">✨ 占卜師正在推演星象中... ⏳</span>';
        setAiStatus("connecting");

        const [past, present, future] = todayCards;

        try {
          const token = localStorage.getItem("authToken");
          const response = await fetch(`${API_BASE_URL}/tarot/reading`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              past: {
                name: past.name,
                position: past.positionText,
                meaning: past.meaning,
              },
              present: {
                name: present.name,
                position: present.positionText,
                meaning: present.meaning,
              },
              future: {
                name: future.name,
                position: future.positionText,
                meaning: future.meaning,
              },
            }),
          });

          if (response.ok) {
            const data = await response.json();
            setAiStatus("connected");
            renderTypingEffect(data.ai_response || data.message, textEl, () => {
              document.getElementById("ai-actions").style.display = "block";
            });
          } else {
            throw new Error("API尚未準備好");
          }
        } catch (error) {
          setAiStatus("disconnected");
          const fallbackMessage = `海浪將你的命運軌跡推演了出來。回顧【過去】，你抽到了『${past.name} (${past.positionText})』，這象徵著你曾被「${past.meaning}」的能量所圍繞。而在【現在】的十字路口，『${present.name} (${present.positionText})』顯示你當下正處於「${present.meaning}」的狀態。對於你所好奇的【未來】，『${future.name} (${future.positionText})』給出了指引，暗示未來將與「${future.meaning}」息息相關。深呼吸，海洋會包容你的一切選擇。`;

          renderTypingEffect(fallbackMessage, textEl, () => {
            document.getElementById("ai-actions").style.display = "block";
            modal.scrollTo({ top: modal.scrollHeight, behavior: "smooth" }); // 自動捲動到最底部的輸入框
          });
        }
      }

      async function askAIQuestion() {
        const inputEl = document.getElementById("ai-question-input");
        const textEl = document.getElementById("ai-text");
        const modal = document.getElementById("ai-modal");
        const question = inputEl.value.trim();

        if (!question) return alert("請先輸入你想問的問題喔！");

        inputEl.value = "";
        textEl.innerHTML += `<br><br><strong style="color: #1a2a6c;">你問：</strong>${question}<br><strong id="loading-msg" style="color: #888;">AI 思考中... ⏳</strong>`;
        modal.scrollTo({ top: modal.scrollHeight, behavior: "smooth" });

        setAiStatus("connecting");

        try {
          const token = localStorage.getItem("authToken");
          const response = await fetch(`${API_BASE_URL}/tarot/ask`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ question: question }),
          });

          if (response.ok) {
            const data = await response.json();
            setAiStatus("connected");
            document.getElementById("loading-msg")?.remove();
            textEl.innerHTML += `<strong style="color: #1a2a6c;">深海回音：</strong> ${data.answer}`;
            modal.scrollTo({ top: modal.scrollHeight, behavior: "smooth" });
          } else {
            throw new Error("API尚未準備好");
          }
        } catch (error) {
          setAiStatus("disconnected");
          setTimeout(() => {
            document.getElementById("loading-msg")?.remove();
            textEl.innerHTML += `<strong style="color: #1a2a6c;">深海回音：</strong> 關於這個問題，海洋給予的指引是，保持內心的平靜，不要急於求成。時間會為你帶來最好的答案。(💡 備用資料)`;
            modal.scrollTo({ top: modal.scrollHeight, behavior: "smooth" });
          }, 1500);
        }
      }

      function saveReading() {
        alert("⭐ 已將今日塔羅籤詩與牌面收藏至你的個人背包！");
      }
    </script>
  </body>
</html>
